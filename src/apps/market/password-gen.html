<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>密码生成器</title>
<style>
  :root{
    --bg:#fffdf8; --surface:#fff; --line:#e6e3dc; --text:#1a1916; --sub:#6b6a65;
    --accent:#2f6b58; --accent-soft:#e8f1ed; --warn:#b4483c; --amber:#b07f2a; --dim:#ede9e0;
    --shadow:0 1px 2px rgba(26,25,22,.05),0 8px 24px rgba(26,25,22,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#1b1b19;--surface:#242422;--line:#373632;--text:#eceae4;--sub:#a4a29b;
      --accent:#6fae94;--accent-soft:#22302b;--warn:#e08a7d;--amber:#d6a75a;--dim:#33322e;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;padding:18px 14px 26px}
  .wrap{width:100%;max-width:540px;display:flex;flex-direction:column;gap:12px}
  h1{margin:0;font-size:17px;font-weight:600}
  .sub{margin:2px 0 0;font-size:12px;color:var(--sub)}
  .tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px}
  .tabs button{flex:1;border:0;background:transparent;color:var(--sub);font:inherit;font-size:12px;
    padding:7px 4px;border-radius:8px;cursor:pointer}
  .tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .pane{display:none;flex-direction:column;gap:12px}
  .pane.on{display:flex}
  .out{background:var(--surface);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px}
  .value{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:19px;
    line-height:1.5;word-break:break-all;min-height:58px;display:flex;align-items:center;
    justify-content:center;text-align:center;user-select:all;letter-spacing:.02em}
  .meter{height:6px;border-radius:3px;background:var(--dim);overflow:hidden}
  .meter i{display:block;height:100%;width:0;border-radius:3px;transition:width .25s,background .25s}
  .strength{display:flex;justify-content:space-between;font-size:11px;color:var(--sub)}
  .btns{display:grid;grid-template-columns:1fr auto;gap:6px}
  .btns button{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;
    border-radius:10px;padding:10px;cursor:pointer;font-weight:600}
  .btns button:hover{filter:brightness(1.06)}
  .btns .copy{background:var(--surface);color:var(--sub);border-color:var(--line);font-weight:400;
    padding:10px 16px}
  .btns .copy:hover{color:var(--accent);border-color:var(--accent);filter:none}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;
    display:flex;flex-direction:column;gap:10px}
  .lenrow{display:flex;align-items:center;gap:10px}
  .lenrow label{font-size:12px;color:var(--sub);flex:none}
  .lenrow input[type="range"]{flex:1;accent-color:var(--accent);min-width:0}
  .lenrow b{font-variant-numeric:tabular-nums;font-size:14px;width:28px;text-align:right}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .opts label{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text);
    border:1px solid var(--line);border-radius:9px;padding:7px 9px;cursor:pointer;background:var(--bg)}
  .opts label:hover{border-color:var(--accent)}
  .opts input{accent-color:var(--accent);margin:0;flex:none}
  .opts label.wide{grid-column:1 / -1}
  .hint{font-size:11px;color:var(--sub)}
  .msg{font-size:12px;color:var(--accent);min-height:16px;text-align:center}
  .foot{font-size:11px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>密码生成器</h1>
    <p class="sub">密码长得越乱越安全；记不住就用下面的「易记短语」</p>
  </div>

  <div class="tabs" role="tablist" aria-label="模式">
    <button type="button" role="tab" data-pane="random" aria-selected="true">随机密码</button>
    <button type="button" role="tab" data-pane="phrase" aria-selected="false">易记短语</button>
  </div>

  <div class="pane on" id="pane-random">
    <div class="out">
      <div class="value" id="value">点下面的按钮生成</div>
      <div class="meter"><i id="meter"></i></div>
      <div class="strength"><span id="strength">—</span><span id="entropy"></span></div>
      <div class="btns">
        <button type="button" id="gen">换一个</button>
        <button type="button" class="copy" id="copy">复制</button>
      </div>
    </div>

    <div class="panel">
      <div class="lenrow">
        <label for="len">长度</label>
        <input type="range" id="len" min="8" max="64" step="1" value="16">
        <b id="lenVal">16</b>
      </div>
      <div class="opts">
        <label><input type="checkbox" id="lower" checked> 小写 a-z</label>
        <label><input type="checkbox" id="upper" checked> 大写 A-Z</label>
        <label><input type="checkbox" id="digit" checked> 数字 0-9</label>
        <label><input type="checkbox" id="symbol" checked> 符号 !@#</label>
        <label class="wide"><input type="checkbox" id="plain"> 去掉容易看错的 0O1lI</label>
      </div>
      <div class="hint">会在本机生成，不上传任何地方</div>
    </div>
  </div>

  <div class="pane" id="pane-phrase">
    <div class="out">
      <div class="value" id="phraseValue">点下面的按钮生成</div>
      <div class="meter"><i id="phraseMeter"></i></div>
      <div class="strength"><span id="phraseStrength">—</span><span id="phraseEntropy"></span></div>
      <div class="btns">
        <button type="button" id="phraseGen">换一个</button>
        <button type="button" class="copy" id="phraseCopy">复制</button>
      </div>
    </div>

    <div class="panel">
      <div class="lenrow">
        <label for="words">词数</label>
        <input type="range" id="words" min="3" max="8" step="1" value="4">
        <b id="wordsVal">4</b>
      </div>
      <div class="opts">
        <label class="wide"><input type="checkbox" id="addNum" checked> 末尾加一个数字</label>
      </div>
      <div class="hint">几个不相干的词拼起来，比乱码好记，长度也够</div>
    </div>
  </div>

  <div class="msg" id="msg" role="status"></div>
  <div class="foot">设置保存在仓库里 · 生成的密码不会保存</div>
</div>

<script>
(function () {
  var KEY = 'settings';
  var WORDS = ['苹果', '火车', '下雨', '灯塔', '老虎', '面包', '月光', '河流', '铅笔', '窗台',
    '森林', '风扇', '石头', '咖啡', '风筝', '乌鸦', '雨伞', '星球', '台阶', '棉花',
    '麦田', '钥匙', '铁锅', '彩虹', '木马', '海豚', '沙漠', '松树', '玻璃', '钟表',
    '肥皂', '蘑菇', '面包', '灯塔', '气球', '靴子', '山谷', '蜂蜜', '柠檬', '落日',
    '码头', '风筝', '渔网', '烟囱', '瓷砖', '围巾', '抽屉', '邮筒', '薄荷', '沙发',
    '岩羊', '纸船', '指纹', '水壶', '帆布', '灰鸽', '书架', '磁带', '枇杷', '青瓦'];
  // 词表去重，避免同一个词出现两次拉高「看似」的熵
  WORDS = WORDS.filter(function (w, i) { return WORDS.indexOf(w) === i; });
  var bridge = window.glimnote && window.glimnote.data;
  var insecure = !(window.crypto && window.crypto.getRandomValues);

  var el = {
    value: document.getElementById('value'), meter: document.getElementById('meter'),
    strength: document.getElementById('strength'), entropy: document.getElementById('entropy'),
    gen: document.getElementById('gen'), copy: document.getElementById('copy'),
    len: document.getElementById('len'), lenVal: document.getElementById('lenVal'),
    lower: document.getElementById('lower'), upper: document.getElementById('upper'),
    digit: document.getElementById('digit'), symbol: document.getElementById('symbol'),
    plain: document.getElementById('plain'),
    phraseValue: document.getElementById('phraseValue'), phraseMeter: document.getElementById('phraseMeter'),
    phraseStrength: document.getElementById('phraseStrength'), phraseEntropy: document.getElementById('phraseEntropy'),
    phraseGen: document.getElementById('phraseGen'), phraseCopy: document.getElementById('phraseCopy'),
    words: document.getElementById('words'), wordsVal: document.getElementById('wordsVal'),
    addNum: document.getElementById('addNum'), msg: document.getElementById('msg')
  };

  var SETS = {
    lower: 'abcdefghijklmnopqrstuvwxyz',
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    digit: '0123456789',
    symbol: '!@#$%^&*()-_=+[]{};:,.?'
  };
  var AMBIGUOUS = '0O1lI';

  function randomInt(n) {
    if (window.crypto && window.crypto.getRandomValues) {
      var max = Math.floor(0xffffffff / n) * n;
      var arr = new Uint32Array(1);
      do { window.crypto.getRandomValues(arr); } while (arr[0] >= max);
      return arr[0] % n;
    }
    return Math.floor(Math.random() * n);
  }

  function charset() {
    var s = '';
    ['lower', 'upper', 'digit', 'symbol'].forEach(function (k) {
      if (el[k].checked) s += SETS[k];
    });
    if (el.plain.checked) {
      s = s.split('').filter(function (ch) { return AMBIGUOUS.indexOf(ch) < 0; }).join('');
    }
    return s;
  }

  function entropyOf(len, size) {
    return size > 1 ? len * Math.log2(size) : 0;
  }

  function grade(bits) {
    if (bits >= 100) return { label: '很强', color: 'var(--accent)', pct: 100 };
    if (bits >= 75) return { label: '够用', color: 'var(--accent)', pct: 78 };
    if (bits >= 50) return { label: '一般', color: 'var(--amber)', pct: 52 };
    return { label: '偏弱', color: 'var(--warn)', pct: 24 };
  }

  function settingsSnapshot() {
    return {
      len: Number(el.len.value),
      lower: el.lower.checked, upper: el.upper.checked,
      digit: el.digit.checked, symbol: el.symbol.checked,
      plain: el.plain.checked,
      words: Number(el.words.value), addNum: el.addNum.checked,
      mode: view
    };
  }

  function save() {
    if (!bridge) return Promise.resolve();
    return bridge.set(KEY, settingsSnapshot()).catch(function () {});
  }

  function makePassword() {
    var s = charset();
    if (!s.length) {
      el.msg.textContent = '至少勾选一种字符';
      return '';
    }
    var len = Number(el.len.value);
    var out = '';
    for (var i = 0; i < len; i += 1) out += s[randomInt(s.length)];
    return out;
  }

  function renderPassword(pwd) {
    var s = charset();
    var bits = entropyOf(pwd.length, s.length);
    var g = grade(bits);
    el.value.textContent = pwd;
    el.value.style.color = 'var(--text)';
    el.meter.style.width = g.pct + '%';
    el.meter.style.background = g.color;
    el.strength.textContent = g.label + ' · ' + pwd.length + ' 位';
    el.entropy.textContent = '约 ' + Math.round(bits) + ' bit 强度';
  }

  function generate() {
    el.msg.textContent = '';
    var pwd = makePassword();
    if (!pwd) return;
    renderPassword(pwd);
    if (insecure) el.msg.textContent = '当前环境没有安全随机源，结果可能不够随机';
    el.value.dataset.has = '1';
    save();
  }

  function makePhrase() {
    var n = Number(el.words.value);
    var picked = [];
    var pool = WORDS.slice();
    for (var i = 0; i < n && pool.length; i += 1) {
      var idx = randomInt(pool.length);
      picked.push(pool[idx]);
      pool.splice(idx, 1);
    }
    var text = picked.join('-');
    if (el.addNum.checked) text += '-' + randomInt(10);
    return text;
  }

  function phraseBits(n) {
    // 无放回抽词：每个词的可选空间依次减一
    var bits = 0;
    for (var i = 0; i < n && i < WORDS.length; i += 1) bits += Math.log2(WORDS.length - i);
    if (el.addNum.checked) bits += Math.log2(10);
    return bits;
  }

  function renderPhrase(text) {
    var n = Number(el.words.value);
    var bits = phraseBits(n);
    var g = grade(bits);
    el.phraseValue.textContent = text;
    el.phraseMeter.style.width = g.pct + '%';
    el.phraseMeter.style.background = g.color;
    el.phraseStrength.textContent = g.label + ' · ' + n + ' 个词';
    el.phraseEntropy.textContent = '约 ' + Math.round(bits) + ' bit 强度';
  }

  function generatePhrase() {
    el.msg.textContent = '';
    renderPhrase(makePhrase());
    if (insecure) el.msg.textContent = '当前环境没有安全随机源，结果可能不够随机';
    el.phraseValue.dataset.has = '1';
    save();
  }

  function copy(node, label) {
    var text = node.textContent;
    if (!text || text.indexOf('点下面') === 0) {
      el.msg.textContent = '还没有内容可复制';
      return;
    }
    var done = function () { el.msg.textContent = label + '已复制，记得存进密码管理器'; };
    var fail = function () { el.msg.textContent = '复制失败，请手动选中复制'; };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, fail);
        return;
      }
    } catch (e) { /* 继续用兜底 */ }
    try {
      var range = document.createRange();
      range.selectNodeContents(node);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      document.execCommand('copy') ? done() : fail();
    } catch (e2) {
      fail();
    }
  }

  var view = 'random';
  function renderTabs() {
    document.querySelectorAll('.pane').forEach(function (p) { p.classList.remove('on'); });
    document.getElementById('pane-' + view).classList.add('on');
    document.querySelectorAll('[data-pane]').forEach(function (t) {
      t.setAttribute('aria-selected', String(t.getAttribute('data-pane') === view));
    });
  }

  el.gen.addEventListener('click', generate);
  el.copy.addEventListener('click', function () { copy(el.value, '密码'); });
  el.phraseGen.addEventListener('click', generatePhrase);
  el.phraseCopy.addEventListener('click', function () { copy(el.phraseValue, '短语'); });

  el.len.addEventListener('input', function () {
    el.lenVal.textContent = el.len.value;
    if (el.value.dataset.has === '1') generate();
  });
  el.words.addEventListener('input', function () {
    el.wordsVal.textContent = el.words.value;
    if (el.phraseValue.dataset.has === '1') generatePhrase();
  });
  ['lower', 'upper', 'digit', 'symbol', 'plain'].forEach(function (k) {
    el[k].addEventListener('change', function () {
      if (el.value.dataset.has === '1') generate();
    });
  });
  el.addNum.addEventListener('change', function () {
    if (el.phraseValue.dataset.has === '1') generatePhrase();
  });

  document.querySelectorAll('[data-pane]').forEach(function (tab) {
    tab.addEventListener('click', function () {
      view = tab.getAttribute('data-pane');
      renderTabs();
      if (view === 'phrase' && el.phraseValue.dataset.has !== '1') generatePhrase();
      save();
    });
  });

  function apply(s) {
    if (!s || typeof s !== 'object') return;
    if (Number(s.len) >= 8 && Number(s.len) <= 64) el.len.value = String(Number(s.len));
    if (Number(s.words) >= 3 && Number(s.words) <= 8) el.words.value = String(Number(s.words));
    ['lower', 'upper', 'digit', 'symbol', 'plain', 'addNum'].forEach(function (k) {
      if (typeof s[k] === 'boolean') el[k].checked = s[k];
    });
    el.lenVal.textContent = el.len.value;
    el.wordsVal.textContent = el.words.value;
    if (s.mode === 'phrase') view = 'phrase';
    renderTabs();
  }

  var loaded = bridge
    ? bridge.get(KEY, null).catch(function () { return null; })
    : Promise.resolve(null);

  loaded.then(function (s) {
    apply(s);
    generate();
    if (view === 'phrase') generatePhrase();
  });
})();
</script>

<script>
(function () {
  var api = window.glimnote && window.glimnote.data;
  if (!api) return;
  var timer = null;
  function banner() {
    var box = document.getElementById('__glnError');
    if (!box) {
      box = document.createElement('div');
      box.id = '__glnError';
      box.setAttribute('role', 'alert');
      box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:10px 12px;' +
        'border-radius:10px;background:#8f2f26;color:#fff;font:13px/1.5 system-ui,sans-serif;' +
        'box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;max-width:560px;margin:0 auto;';
      document.body.appendChild(box);
    }
    return box;
  }
  function show(message) {
    var box = banner();
    box.textContent = message || '未保存，请重试';
    box.style.display = 'block';
    clearTimeout(timer);
    timer = setTimeout(function () { box.style.display = 'none'; }, 5000);
  }
  ['set', 'remove', 'clear'].forEach(function (name) {
    var original = api[name];
    if (typeof original !== 'function') return;
    api[name] = function () {
      var promise = original.apply(api, arguments);
      if (promise && typeof promise.then === 'function') {
        promise.then(null, function (error) {
          show('保存失败：' + ((error && error.message) || '请重试'));
        });
      }
      return promise;
    };
  });
})();
</script>
</body>
</html>
