<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base64 编码器</title>
<style>
  :root{
    --bg:#fffdf8; --surface:#fff; --line:#e6e3dc; --text:#1a1916; --sub:#6b6a65;
    --accent:#2f6b58; --accent-soft:#e8f1ed; --warn:#b4483c; --dim:#f4f1e9;
    --shadow:0 1px 2px rgba(26,25,22,.05),0 8px 24px rgba(26,25,22,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#1b1b19;--surface:#242422;--line:#373632;--text:#eceae4;--sub:#a4a29b;
      --accent:#6fae94;--accent-soft:#22302b;--warn:#e08a7d;--dim:#2d2d2a;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;padding:18px 14px 24px}
  .wrap{width:100%;max-width:780px;display:flex;flex-direction:column;gap:10px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{margin:0;font-size:17px;font-weight:600}
  .head p{margin:2px 0 0;font-size:12px;color:var(--sub)}
  .modes{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .modes button{font:inherit;font-size:12px;border:0;background:var(--surface);color:var(--sub);
    padding:6px 12px;cursor:pointer}
  .modes button+button{border-left:1px solid var(--line)}
  .modes button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .tools{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .tools button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--surface);
    color:var(--sub);border-radius:8px;padding:5px 10px;cursor:pointer}
  .tools button:hover{border-color:var(--accent);color:var(--accent)}
  .tools button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .tools button.primary:hover{filter:brightness(1.06)}
  .tools button.danger:hover{border-color:var(--warn);color:var(--warn)}
  .tools label{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--sub);
    cursor:pointer;user-select:none}
  .tools input[type=checkbox]{accent-color:var(--accent);margin:0}
  .tools select{font:inherit;font-size:12px;color:var(--sub);background:var(--surface);
    border:1px solid var(--line);border-radius:8px;padding:5px 6px}
  .panes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:680px){.panes{grid-template-columns:1fr}}
  .pane{display:flex;flex-direction:column;gap:5px;min-width:0}
  .pane h2{margin:0;font-size:12px;font-weight:500;color:var(--sub);display:flex;
    justify-content:space-between;align-items:center;gap:8px}
  .pane h2 .hint{font-weight:400;font-size:11px}
  textarea{width:100%;min-height:210px;resize:vertical;font-family:ui-monospace,SFMono-Regular,
    Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;color:inherit;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;padding:11px;box-shadow:var(--shadow);
    word-break:break-all}
  textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  textarea[readonly]{color:var(--text)}
  .drop{position:relative}
  .drop.over textarea{border-color:var(--accent);background:var(--accent-soft)}
  .drop-tip{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    border:2px dashed var(--accent);border-radius:12px;background:var(--accent-soft);
    color:var(--accent);font-size:13px;pointer-events:none}
  .drop.over .drop-tip{display:flex}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  @media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:6px 4px;text-align:center}
  .stat b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
  .stat span{font-size:10px;color:var(--sub)}
  .msg{font-size:12px;color:var(--accent);min-height:18px;word-break:break-all}
  .msg.err{color:var(--warn)}
  .foot{font-size:11px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>Base64 编码器</h1>
      <p>文本和 Base64 互转，支持中文、URL-safe 和文件</p>
    </div>
    <div class="modes" role="group" aria-label="转换方向">
      <button type="button" id="modeEncode" class="on" aria-pressed="true">文本 → Base64</button>
      <button type="button" id="modeDecode" aria-pressed="false">Base64 → 文本</button>
    </div>
  </div>

  <div class="tools">
    <button type="button" data-act="swap">交换两边</button>
    <button type="button" data-act="copy">复制结果</button>
    <button type="button" data-act="file">读取文件</button>
    <button type="button" data-act="sample">示例</button>
    <button type="button" data-act="clear" class="danger">清空</button>
    <label><input type="checkbox" id="urlSafe"> URL-safe（-_）</label>
    <label><input type="checkbox" id="padding" checked> 保留 = 补位</label>
    <label><input type="checkbox" id="dataPrefix"> 加 data: 前缀</label>
    <select id="wrap" aria-label="换行宽度">
      <option value="0">不换行</option>
      <option value="64">每 64 字符换行</option>
      <option value="76" selected>每 76 字符换行</option>
    </select>
    <input type="file" id="fileInput" hidden>
  </div>

  <div class="panes">
    <section class="pane drop" id="dropEncode">
      <h2><span id="inLabel">原始文本</span><span class="hint" id="inHint">可以直接粘贴，也可以拖一个文件进来</span></h2>
      <textarea id="input" spellcheck="false" aria-label="输入内容"
        placeholder="输入要编码的文本。中文会按 UTF-8 处理，不会变成乱码。"></textarea>
      <div class="drop-tip">松手即可读取文件</div>
    </section>
    <section class="pane">
      <h2><span id="outLabel">Base64 结果</span><span class="hint" id="outHint">实时转换</span></h2>
      <textarea id="output" spellcheck="false" aria-label="输出内容" readonly
        placeholder="转换结果会出现在这里"></textarea>
    </section>
  </div>

  <div class="stats">
    <div class="stat"><b id="s-in">0</b><span>输入字符</span></div>
    <div class="stat"><b id="s-out">0</b><span>结果字符</span></div>
    <div class="stat"><b id="s-text">0</b><span>文本 UTF-8 字节</span></div>
    <div class="stat"><b id="s-b64">0</b><span>Base64 字符</span></div>
  </div>

  <div class="msg" id="msg" role="status"></div>
  <div class="foot">纯本地处理，内容不会上传 · 文件只读进内存，不会保存</div>
</div>

<script>
(function () {
  var input = document.getElementById('input');
  var output = document.getElementById('output');
  var msg = document.getElementById('msg');
  var urlSafeEl = document.getElementById('urlSafe');
  var paddingEl = document.getElementById('padding');
  var dataPrefixEl = document.getElementById('dataPrefix');
  var wrapEl = document.getElementById('wrap');
  var fileInput = document.getElementById('fileInput');
  var dropZone = document.getElementById('dropEncode');
  var inLabel = document.getElementById('inLabel');
  var outLabel = document.getElementById('outLabel');
  var inHint = document.getElementById('inHint');
  var outHint = document.getElementById('outHint');
  var statIn = document.getElementById('s-in');
  var statOut = document.getElementById('s-out');
  var statText = document.getElementById('s-text');
  var statB64 = document.getElementById('s-b64');

  var mode = 'encode';
  var fileData = null;
  var timer = null;

  function say(text, isErr) {
    msg.textContent = text;
    msg.className = 'msg' + (isErr ? ' err' : '');
  }

  function bytesOf(text) {
    return new TextEncoder().encode(text);
  }

  function b64OfBytes(bytes) {
    var bin = '';
    var chunk = 0x8000;
    for (var i = 0; i < bytes.length; i += chunk) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(bin);
  }

  function bytesOfB64(text) {
    var clean = text.replace(/\s+/g, '');
    clean = clean.replace(/-/g, '+').replace(/_/g, '/');
    var pad = clean.length % 4;
    if (pad === 1) throw new Error('Base64 长度不对，可能少了一截');
    if (pad) clean += new Array(5 - pad).join('=');
    var bin = atob(clean);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i += 1) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function wrapText(text, width) {
    if (!width) return text;
    var out = [];
    for (var i = 0; i < text.length; i += width) out.push(text.slice(i, i + width));
    return out.join('\n');
  }

  function encodeBytes(bytes) {
    var b64 = b64OfBytes(bytes);
    if (urlSafeEl.checked) b64 = b64.replace(/\+/g, '-').replace(/\//g, '_');
    if (!paddingEl.checked) b64 = b64.replace(/=+$/, '');
    b64 = wrapText(b64, Number(wrapEl.value));
    if (dataPrefixEl.checked) {
      var mime = fileData && fileData.type ? fileData.type : 'text/plain;charset=utf-8';
      b64 = 'data:' + mime + ';base64,' + b64.replace(/\n/g, '');
    }
    return b64;
  }

  function decodeText(text) {
    var body = text.trim();
    var prefix = /^data:[^,]*;base64,/i.exec(body);
    if (prefix) body = body.slice(prefix[0].length);
    var bytes = bytesOfB64(body);
    var textOut;
    var binary = false;
    try {
      textOut = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
    } catch (e) {
      binary = true;
      textOut = new TextDecoder('utf-8', { fatal: false }).decode(bytes);
    }
    return { text: textOut, bytes: bytes, binary: binary };
  }

  function stats() {
    statIn.textContent = String(input.value.length);
    statOut.textContent = String(output.value.length);
    if (mode === 'encode') {
      var bytes = fileData ? fileData.bytes : bytesOf(input.value);
      statText.textContent = String(bytes.length);
      statB64.textContent = String(output.value.replace(/\s/g, '').length);
    } else {
      var decoded = null;
      try { decoded = decodeText(input.value); } catch (e) { decoded = null; }
      statText.textContent = String(decoded ? decoded.bytes.length : 0);
      statB64.textContent = String(input.value.replace(/\s/g, '').length);
    }
  }

  function convert() {
    if (mode === 'encode') {
      var bytes = fileData ? fileData.bytes : bytesOf(input.value);
      if (!fileData && !input.value) {
        output.value = '';
        stats();
        say('');
        return;
      }
      if (fileData && fileData.bytes.length > 10 * 1024 * 1024) {
        output.value = '';
        stats();
        say('文件超过 10MB，Base64 会膨胀到约 13MB，建议用专门的工具处理', true);
        return;
      }
      output.value = encodeBytes(bytes);
      stats();
      say(fileData
        ? '已读取「' + fileData.name + '」 · ' + fileData.bytes.length + ' 字节，转成 Base64'
        : '编码完成（UTF-8）' + (urlSafeEl.checked ? ' · URL-safe' : ''));
      return;
    }

    if (!input.value.trim()) {
      output.value = '';
      stats();
      say('');
      return;
    }
    try {
      var res = decodeText(input.value);
      output.value = res.text;
      stats();
      say(res.binary
        ? '解出来的不是有效 UTF-8 文本，可能是图片、压缩包等二进制数据'
        : '解码完成 · ' + res.bytes.length + ' 字节', res.binary);
    } catch (e) {
      output.value = '';
      stats();
      say((e && e.message) || '解不开，检查是不是完整的 Base64', true);
    }
  }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(convert, 120);
  }

  function setMode(next) {
    if (next === mode) return;
    mode = next;
    document.getElementById('modeEncode').classList.toggle('on', mode === 'encode');
    document.getElementById('modeDecode').classList.toggle('on', mode === 'decode');
    document.getElementById('modeEncode').setAttribute('aria-pressed', String(mode === 'encode'));
    document.getElementById('modeDecode').setAttribute('aria-pressed', String(mode === 'decode'));
    inLabel.textContent = mode === 'encode' ? '原始文本' : 'Base64 内容';
    outLabel.textContent = mode === 'encode' ? 'Base64 结果' : '解码后的文本';
    inHint.textContent = mode === 'encode' ? '可以直接粘贴，也可以拖一个文件进来' : '带不带换行、URL-safe 都能解';
    outHint.textContent = mode === 'encode' ? '实时转换' : '实时解码';
    input.placeholder = mode === 'encode'
      ? '输入要编码的文本。中文会按 UTF-8 处理，不会变成乱码。'
      : '粘贴 Base64。data:xxx;base64, 前缀会自动忽略。';
    fileData = null;
    output.value = '';
    convert();
  }

  function readFile(file) {
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) {
      say('文件超过 10MB，建议用专门的工具处理', true);
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      // 先切到编码模式再放文件数据：setMode 切换时会清空上一份文件
      setMode('encode');
      fileData = { bytes: new Uint8Array(reader.result), name: file.name, type: file.type };
      input.value = '[文件] ' + file.name + ' · ' + file.size + ' 字节';
      convert();
    };
    reader.onerror = function () {
      say('读不了这个文件，换个位置试试', true);
    };
    reader.readAsArrayBuffer(file);
  }

  var ACTIONS = {
    swap: function () {
      var next = output.value;
      if (!next) return say('右边还没有内容', true);
      input.value = next;
      output.value = '';
      fileData = null;
      setMode(mode === 'encode' ? 'decode' : 'encode');
      convert();
    },
    copy: function () {
      if (!output.value) return say('右边还没有内容', true);
      var ok = function () { say('已复制 ' + output.value.length + ' 个字符'); };
      var fail = function () {
        output.focus();
        output.select();
        say('已全选，按 Ctrl+C 复制', true);
      };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(output.value).then(ok, fail);
          return;
        }
      } catch (e) { /* 兜底 */ }
      try {
        output.focus();
        output.select();
        document.execCommand('copy') ? ok() : fail();
      } catch (e2) {
        fail();
      }
    },
    file: function () { fileInput.click(); },
    sample: function () {
      setMode('encode');
      fileData = null;
      input.value = '萤光笔记 · Glimnote\n把每天的碎碎念，认真收好。';
      convert();
    },
    clear: function () {
      input.value = '';
      output.value = '';
      fileData = null;
      stats();
      say('');
      input.focus();
    },
  };

  document.querySelectorAll('[data-act]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var act = ACTIONS[btn.getAttribute('data-act')];
      if (act) act();
    });
  });

  document.getElementById('modeEncode').addEventListener('click', function () { setMode('encode'); });
  document.getElementById('modeDecode').addEventListener('click', function () { setMode('decode'); });

  input.addEventListener('input', function () {
    fileData = null;
    schedule();
  });
  [urlSafeEl, paddingEl, dataPrefixEl].forEach(function (el) {
    el.addEventListener('change', convert);
  });
  wrapEl.addEventListener('change', convert);

  fileInput.addEventListener('change', function () {
    readFile(fileInput.files && fileInput.files[0]);
    fileInput.value = '';
  });

  ['dragenter', 'dragover'].forEach(function (name) {
    dropZone.addEventListener(name, function (e) {
      e.preventDefault();
      dropZone.classList.add('over');
    });
  });
  ['dragleave', 'drop'].forEach(function (name) {
    dropZone.addEventListener(name, function (e) {
      e.preventDefault();
      dropZone.classList.remove('over');
    });
  });
  dropZone.addEventListener('drop', function (e) {
    var files = e.dataTransfer && e.dataTransfer.files;
    if (files && files[0]) readFile(files[0]);
  });

  stats();
})();
</script>
</body>
</html>
