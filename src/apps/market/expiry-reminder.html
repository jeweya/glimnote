<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>到期提醒</title>
<style>
  :root{--bg:#fffdf8;--surface:#fff;--line:#e6e3dc;--text:#1a1916;--sub:#6b6a65;
    --accent:#2f6b58;--accent-soft:#e8f1ed;--warn:#b4483c;--warn-soft:#f7e7e4;
    --amber:#a8742a;--amber-soft:#f7efe1;--track:#efece4;
    --shadow:0 1px 2px rgba(26,25,22,.05),0 8px 24px rgba(26,25,22,.05)}
  @media (prefers-color-scheme:dark){:root{--bg:#1b1b19;--surface:#242422;--line:#373632;--text:#eceae4;--sub:#a4a29b;
    --accent:#6fae94;--accent-soft:#22302b;--warn:#e08a7d;--warn-soft:#3a2624;--amber:#d6a55e;--amber-soft:#332a1f;--track:#2e2e2a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;padding:18px 14px 22px}
  .wrap{width:100%;max-width:600px;display:flex;flex-direction:column;gap:12px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  h1{margin:0;font-size:17px;font-weight:600}
  .head p{margin:2px 0 0;font-size:12px;color:var(--sub)}
  .head .soon{font-size:12px;color:var(--sub);white-space:nowrap}
  .head .soon b{color:var(--warn);font-variant-numeric:tabular-nums}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px}
  form.add{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  input,select{font:inherit;font-size:13px;color:var(--text);background:var(--bg);border:1px solid var(--line);
    border-radius:9px;padding:8px 10px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  form.add input[type=text]{flex:1 1 160px;min-width:120px}
  .btn{font:inherit;font-size:13px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);cursor:pointer;white-space:nowrap}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .msg{font-size:12px;color:var(--warn);min-height:16px;margin:-4px 0 6px}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  li{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg);border-left:3px solid var(--accent)}
  li.warn{border-left-color:var(--warn);background:var(--warn-soft)}
  li.amber{border-left-color:var(--amber);background:var(--amber-soft)}
  .info{flex:1;min-width:0}
  .name{font-size:14px;font-weight:600;word-break:break-word}
  .meta{font-size:11px;color:var(--sub);margin-top:1px}
  .days{flex:0 0 auto;text-align:right;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent)}
  li.warn .days{color:var(--warn)}
  li.amber .days{color:var(--amber)}
  .days i{display:block;font-style:normal;font-size:10px;color:var(--sub);font-weight:400}
  .del,.edit{border:0;background:transparent;color:var(--sub);font-size:16px;line-height:1;cursor:pointer;opacity:0;padding:0 2px}
  .edit{font-size:14px}
  li:hover .del,li:hover .edit,li:focus-within .del,li:focus-within .edit{opacity:1}
  @media (hover:none){.del,.edit{opacity:1}}
  .empty{font-size:12px;color:var(--sub);padding:8px 0}
  .foot{font-size:11px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>到期提醒</h1><p>食品、药品、证件、会员，快到期的排前面</p></div>
    <div class="soon">7 天内 <b id="soonCount">0</b> 件</div>
  </div>
  <div class="card">
    <form class="add" id="form">
      <input type="text" id="name" maxlength="40" placeholder="什么东西？例如：牛奶" aria-label="名称">
      <input type="date" id="date" aria-label="到期日期">
      <select id="cat" aria-label="分类">
        <option>食品</option>
        <option>药品</option>
        <option>证件</option>
        <option>会员</option>
        <option>其它</option>
      </select>
      <button class="btn primary" type="submit" id="submitBtn">加入</button>
      <button class="btn" type="button" id="cancelEdit" style="display:none">取消修改</button>
    </form>
    <div class="msg" id="msg" role="status"></div>
    <ul id="list"></ul>
    <div class="empty" id="empty">还没有记录，先加一个快到期的。</div>
  </div>
  <div class="foot">只在本机提醒，不会自动发通知 · 点 ✎ 改内容或日期，点 × 删除</div>
</div>

<script>
(function () {
  var KEY = 'expiry';
  var mem = {};
  var bridge = window.glimnote && window.glimnote.data;
  function get(k, d) {
    if (!bridge) return Promise.resolve(k in mem ? mem[k] : d);
    return bridge.get(k, d).catch(function () { return k in mem ? mem[k] : d; });
  }
  function set(k, v) {
    mem[k] = v;
    if (!bridge) return Promise.resolve();
    return bridge.set(k, v).catch(function () {});
  }

  var items = [];
  var listEl = document.getElementById('list');
  var emptyEl = document.getElementById('empty');
  var msgEl = document.getElementById('msg');
  var soonEl = document.getElementById('soonCount');
  var nameEl = document.getElementById('name');
  var dateEl = document.getElementById('date');
  var catEl = document.getElementById('cat');
  var submitBtn = document.getElementById('submitBtn');
  var cancelBtn = document.getElementById('cancelEdit');
  var editingId = null;
  var touched = false; // 用户已经动过清单，异步载入的旧数据不再整体覆盖
  var lastDay = 0;

  function findItem(id) {
    for (var i = 0; i < items.length; i += 1) if (items[i].id === id) return items[i];
    return null;
  }

  function startEdit(item) {
    nameEl.value = item.name;
    dateEl.value = item.date;
    catEl.value = item.cat || '其它';
    editingId = item.id;
    submitBtn.textContent = '保存修改';
    cancelBtn.style.display = '';
    msgEl.textContent = '';
    nameEl.focus();
  }

  function stopEdit(clear) {
    editingId = null;
    submitBtn.textContent = '加入';
    cancelBtn.style.display = 'none';
    if (clear) { nameEl.value = ''; dateEl.value = ''; }
  }

  function todayStart() {
    var d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  }
  function daysLeft(dateStr) {
    var parts = String(dateStr || '').split('-');
    if (parts.length !== 3) return 9999;
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    return Math.round((d.getTime() - todayStart()) / 86400000);
  }
  function save() { set(KEY, items); }

  function render() {
    var sorted = items.slice().sort(function (a, b) { return daysLeft(a.date) - daysLeft(b.date); });
    var soon = 0;
    listEl.textContent = '';
    sorted.forEach(function (item) {
      var left = daysLeft(item.date);
      if (left >= 0 && left <= 7) soon += 1;
      var li = document.createElement('li');
      if (left < 0) li.className = 'warn';
      else if (left <= 3) li.className = 'warn';
      else if (left <= 30) li.className = 'amber';

      var info = document.createElement('div');
      info.className = 'info';
      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = item.name;
      var meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = item.cat + ' · ' + item.date + (left < 0 ? ' · 已过期' : '');
      info.appendChild(name); info.appendChild(meta);

      var badge = document.createElement('div');
      badge.className = 'days';
      badge.textContent = left < 0 ? '过期 ' + Math.abs(left) + ' 天' : left === 0 ? '今天到期' : '还有 ' + left + ' 天';
      var hint = document.createElement('i');
      hint.textContent = left < 0 ? '尽快处理' : left <= 3 ? '要留心了' : left <= 30 ? '一个月内' : '还早';
      badge.appendChild(hint);

      var edit = document.createElement('button');
      edit.className = 'edit';
      edit.type = 'button';
      edit.textContent = '✎';
      edit.title = '修改';
      edit.setAttribute('aria-label', '修改 ' + item.name);
      edit.addEventListener('click', function () { startEdit(item); });

      var del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.textContent = '×';
      del.title = '删除';
      del.setAttribute('aria-label', '删除 ' + item.name);
      del.addEventListener('click', function () {
        if (editingId === item.id) stopEdit(true);
        touched = true;
        items = items.filter(function (x) { return x.id !== item.id; });
        save(); render();
      });

      li.appendChild(info); li.appendChild(badge); li.appendChild(edit); li.appendChild(del);
      listEl.appendChild(li);
    });
    emptyEl.style.display = items.length ? 'none' : 'block';
    soonEl.textContent = String(soon);
    document.title = (soon ? soon + ' 件临期 · ' : '') + '到期提醒';
  }

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = nameEl.value.trim();
    var date = dateEl.value;
    if (!name) { msgEl.textContent = '先写一下是什么东西'; nameEl.focus(); return; }
    if (!date) { msgEl.textContent = '选一个到期日期'; dateEl.focus(); return; }
    msgEl.textContent = '';
    touched = true;
    if (editingId) {
      var target = findItem(editingId);
      if (target) { target.name = name; target.date = date; target.cat = catEl.value; }
      stopEdit(true);
    } else {
      items.push({ id: 'x' + Date.now().toString(36), name: name, date: date, cat: catEl.value });
      nameEl.value = ''; dateEl.value = '';
    }
    save(); render();
    nameEl.focus();
  });

  cancelBtn.addEventListener('click', function () {
    stopEdit(true);
    nameEl.focus();
  });

  get(KEY, []).then(function (saved) {
    var list = Array.isArray(saved) ? saved.filter(function (x) { return x && x.name && x.date; }) : [];
    if (!touched) {
      items = list;
    } else {
      var seen = {};
      items.forEach(function (x) { seen[x.id] = true; });
      list.forEach(function (x) { if (!seen[x.id]) items.push(x); });
    }
    lastDay = todayStart();
    render();
  });

  // 跨过零点后「还有几天」需要重算，每天检查一次
  setInterval(function () {
    var nowDay = todayStart();
    if (nowDay !== lastDay) { lastDay = nowDay; render(); }
  }, 60000);
})();
</script>

<script>
(function () {
  var api = window.glimnote && window.glimnote.data;
  if (!api) return;
  var timer = null;
  function banner() {
    var box = document.getElementById('__glnError');
    if (!box) {
      box = document.createElement('div');
      box.id = '__glnError';
      box.setAttribute('role', 'alert');
      box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:10px 12px;' +
        'border-radius:10px;background:#8f2f26;color:#fff;font:13px/1.5 system-ui,sans-serif;' +
        'box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;max-width:560px;margin:0 auto;';
      document.body.appendChild(box);
    }
    return box;
  }
  function show(message) {
    var box = banner();
    box.textContent = message || '未保存，请重试';
    box.style.display = 'block';
    clearTimeout(timer);
    timer = setTimeout(function () { box.style.display = 'none'; }, 5000);
  }
  ['set', 'remove', 'clear'].forEach(function (name) {
    var original = api[name];
    if (typeof original !== 'function') return;
    api[name] = function () {
      var promise = original.apply(api, arguments);
      if (promise && typeof promise.then === 'function') {
        promise.then(null, function (error) {
          show('保存失败：' + ((error && error.message) || '请重试'));
        });
      }
      return promise;
    };
  });
})();
</script>
</body>
</html>
