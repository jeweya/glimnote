<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记忆卡片</title>
<style>
  :root{
    --bg:#fffdf8; --surface:#fff; --line:#e6e3dc; --text:#1a1916; --sub:#6b6a65;
    --accent:#2f6b58; --accent-soft:#e8f1ed; --warn:#b4483c; --amber:#b07f2a; --dim:#ede9e0;
    --shadow:0 1px 2px rgba(26,25,22,.05),0 8px 24px rgba(26,25,22,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#1b1b19;--surface:#242422;--line:#373632;--text:#eceae4;--sub:#a4a29b;
      --accent:#6fae94;--accent-soft:#22302b;--warn:#e08a7d;--amber:#d6a75a;--dim:#33322e;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;padding:18px 14px 26px}
  .wrap{width:100%;max-width:600px;display:flex;flex-direction:column;gap:12px}
  h1{margin:0;font-size:17px;font-weight:600}
  .sub{margin:2px 0 0;font-size:12px;color:var(--sub)}
  .tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px}
  .tabs button{flex:1;border:0;background:transparent;color:var(--sub);font:inherit;font-size:12px;
    padding:7px 4px;border-radius:8px;cursor:pointer}
  .tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .tabs button span{color:var(--sub);font-size:10px;margin-left:2px}
  .pane{display:none;flex-direction:column;gap:10px}
  .pane.on{display:flex}
  .add{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;padding:12px}
  .add input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);
    border-radius:9px;padding:8px 10px;min-width:0;width:100%}
  .add input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .add .wide{grid-column:1 / -1}
  .add button{grid-column:1 / -1;font:inherit;border:1px solid var(--accent);background:var(--accent);
    color:#fff;border-radius:10px;padding:9px;cursor:pointer;font-weight:600}
  .add button:hover{filter:brightness(1.06)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);padding:22px 18px;text-align:center;min-height:150px;
    display:flex;flex-direction:column;justify-content:center;gap:10px;cursor:pointer}
  .card .q{font-size:17px;font-weight:600;line-height:1.5;word-break:break-word}
  .card .a{font-size:14px;color:var(--sub);line-height:1.6;word-break:break-word;
    border-top:1px dashed var(--line);padding-top:10px}
  .card .hint{font-size:11px;color:var(--sub)}
  .card.revealed{cursor:default;text-align:left}
  .card.revealed .q{font-size:15px;text-align:center}
  .card.revealed .a{text-align:left}
  .rate{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .rate button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--surface);
    color:var(--text);border-radius:10px;padding:9px 4px;cursor:pointer}
  .rate button b{display:block;font-size:11px;color:var(--sub);font-weight:400}
  .rate button[data-r="0"]:hover{border-color:var(--warn);color:var(--warn)}
  .rate button[data-r="1"]:hover{border-color:var(--amber);color:var(--amber)}
  .rate button[data-r="2"]:hover{border-color:var(--accent);color:var(--accent)}
  .bar{display:flex;justify-content:space-between;font-size:11px;color:var(--sub)}
  .progress{height:5px;border-radius:3px;background:var(--dim);overflow:hidden}
  .progress i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .2s}
  .item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
    display:flex;flex-direction:column;gap:4px}
  .item .row{display:flex;align-items:flex-start;gap:8px}
  .item .front{font-size:13px;font-weight:600;flex:1;min-width:0;word-break:break-word}
  .item .back{font-size:12px;color:var(--sub);word-break:break-word}
  .lv{font-size:10px;border:1px solid var(--line);color:var(--sub);border-radius:999px;padding:1px 6px;flex:none}
  .item .del{border:0;background:transparent;color:var(--sub);cursor:pointer;padding:2px;line-height:0;border-radius:5px}
  .item .del:hover{color:var(--warn)}
  .empty{border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--sub);font-size:12px}
  .msg{font-size:12px;color:var(--warn);min-height:16px}
  .foot{font-size:11px;color:var(--sub);text-align:center}
  .done{background:var(--accent-soft);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--accent);font-size:13px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>记忆卡片</h1>
    <p class="sub">正面是问题，翻过来看答案；答得越稳，下次问得越晚</p>
  </div>

  <div class="tabs" role="tablist" aria-label="视图">
    <button type="button" role="tab" data-pane="review" aria-selected="true">复习<span id="c-due"></span></button>
    <button type="button" role="tab" data-pane="all" aria-selected="false">全部<span id="c-all"></span></button>
  </div>

  <div class="pane on" id="pane-review">
    <div class="bar"><span id="pos">今天没有要复习的</span><span id="left"></span></div>
    <div class="progress"><i id="prog" style="width:0%"></i></div>
    <div id="stage"></div>
    <div class="rate" id="rate" style="display:none">
      <button type="button" data-r="0">忘了<b>明天再来</b></button>
      <button type="button" data-r="1">模糊<b>过 3 天</b></button>
      <button type="button" data-r="2">记住了<b>拉长间隔</b></button>
    </div>
  </div>

  <div class="pane" id="pane-all">
    <form class="add" id="form">
      <input id="front" class="wide" maxlength="60" placeholder="正面：问题或单词" aria-label="正面">
      <input id="back" class="wide" maxlength="120" placeholder="背面：答案或释义" aria-label="背面">
      <button type="submit">加一张</button>
    </form>
    <div class="list" id="list"></div>
  </div>

  <div class="msg" id="msg" role="status"></div>
  <div class="foot">数据保存在仓库里 · 间隔按 1 / 3 / 7 / 16 / 35 天递增</div>
</div>

<script>
(function () {
  var KEY = 'cards';
  var STEPS = [0, 1, 3, 7, 16, 35];
  var mem = [];
  var queue = [];
  var pos = 0;
  var revealed = false;
  var touched = false;   // 用户在异步加载完成前是否已经加/删/评过卡
  var bridge = window.glimnote && window.glimnote.data;

  function load() {
    if (!bridge) return Promise.resolve(mem);
    return bridge.get(KEY, []).then(function (v) { return Array.isArray(v) ? v : []; })
      .catch(function () { return mem; });
  }
  function save() {
    if (!bridge) return Promise.resolve();
    return bridge.set(KEY, mem).catch(function () {});
  }

  var el = {
    stage: document.getElementById('stage'), rate: document.getElementById('rate'),
    pos: document.getElementById('pos'), left: document.getElementById('left'),
    prog: document.getElementById('prog'), list: document.getElementById('list'),
    form: document.getElementById('form'), front: document.getElementById('front'),
    back: document.getElementById('back'), msg: document.getElementById('msg')
  };

  function dayKey(d) {
    var t = d || new Date();
    return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
  }
  function plusDays(n) {
    var d = new Date();
    d.setDate(d.getDate() + n);
    return dayKey(d);
  }
  function isDue(card) {
    return !card.due || card.due <= dayKey();
  }

  function buildQueue() {
    queue = mem.filter(isDue).sort(function (a, b) { return (a.due || '') < (b.due || '') ? -1 : 1; });
    pos = 0;
    revealed = false;
  }

  function renderReview() {
    document.getElementById('c-due').textContent = String(mem.filter(isDue).length);
    document.getElementById('c-all').textContent = String(mem.length);

    el.stage.textContent = '';
    el.rate.style.display = 'none';

    if (!queue.length) {
      var done = document.createElement('div');
      done.className = 'done';
      done.textContent = mem.length ? '今天的卡片都过完了，明天再来' : '还没有卡片，去「全部」里加几张';
      el.stage.appendChild(done);
      el.pos.textContent = mem.length ? '今天的卡片都过完了' : '今天没有要复习的';
      el.left.textContent = '';
      el.prog.style.width = '0%';
      return;
    }
    if (pos >= queue.length) {
      var fin = document.createElement('div');
      fin.className = 'done';
      fin.textContent = '这一轮完成，共过了 ' + queue.length + ' 张';
      el.stage.appendChild(fin);
      el.pos.textContent = '这一轮完成';
      el.left.textContent = '';
      el.prog.style.width = '100%';
      buildQueue();
      return;
    }

    var card = queue[pos];
    var box = document.createElement('div');
    box.className = 'card' + (revealed ? ' revealed' : '');

    var q = document.createElement('div');
    q.className = 'q';
    q.textContent = card.front;
    box.appendChild(q);

    if (revealed) {
      var a = document.createElement('div');
      a.className = 'a';
      a.textContent = card.back;
      box.appendChild(a);
      el.rate.style.display = 'grid';
    } else {
      var hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = '点一下看答案';
      box.appendChild(hint);
      box.addEventListener('click', function () {
        revealed = true;
        renderReview();
      });
    }
    el.stage.appendChild(box);
    el.pos.textContent = '第 ' + (pos + 1) + ' / ' + queue.length + ' 张';
    el.left.textContent = '已掌握 ' + mem.filter(function (c) { return (c.box || 0) >= 4; }).length + ' 张';
    el.prog.style.width = (pos / queue.length * 100).toFixed(1) + '%';
  }

  function renderAll() {
    el.list.textContent = '';
    if (!mem.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '还没有卡片。一张卡片只放一个点，越短越好记。';
      el.list.appendChild(empty);
      return;
    }
    mem.slice().sort(function (a, b) { return (b.created || '') < (a.created || '') ? -1 : 1; })
      .forEach(function (card) {
        var item = document.createElement('div');
        item.className = 'item';
        var row = document.createElement('div');
        row.className = 'row';
        var front = document.createElement('div');
        front.className = 'front';
        front.textContent = card.front;
        var lv = document.createElement('span');
        lv.className = 'lv';
        lv.textContent = '第 ' + ((card.box || 0) + 1) + ' 级';
        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'del';
        del.title = '删除这张';
        del.setAttribute('aria-label', '删除 ' + card.front);
        del.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
        del.addEventListener('click', function () {
          touched = true;
          mem = mem.filter(function (c) { return c.id !== card.id; });
          save().then(function () { buildQueue(); renderReview(); renderAll(); });
        });
        row.appendChild(front);
        row.appendChild(lv);
        row.appendChild(del);
        var back = document.createElement('div');
        back.className = 'back';
        back.textContent = card.back;
        item.appendChild(row);
        item.appendChild(back);
        el.list.appendChild(item);
      });
  }

  var view = 'review';
  function render() {
    document.querySelectorAll('.pane').forEach(function (p) { p.classList.remove('on'); });
    document.getElementById('pane-' + view).classList.add('on');
    ['review', 'all'].forEach(function (k) {
      document.querySelector('[data-pane="' + k + '"]').setAttribute('aria-selected', String(k === view));
    });
    if (view === 'review') renderReview(); else renderAll();
  }

  el.rate.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-r]');
    if (!btn) return;
    // 连点保护：第一次评分后立刻锁住，避免把下一张没翻面的卡也评掉
    if (!revealed) return;
    var card = queue[pos];
    if (!card) return;
    revealed = false;
    el.rate.style.display = 'none';
    touched = true;
    var r = Number(btn.getAttribute('data-r'));
    var box = Number(card.box) || 0;
    var due;
    if (r === 0) {
      box = 0;
      due = plusDays(1);
    } else if (r === 1) {
      // 「模糊」按文案固定 3 天后，级别不倒退但也不跳级
      box = Math.max(1, box);
      due = plusDays(3);
    } else {
      // 「记住了」至少升到第 4 级（7 天），之后每级按表拉长
      box = Math.min(5, Math.max(box + 2, 3));
      due = plusDays(STEPS[box]);
    }
    card.box = box;
    card.due = due;
    pos += 1;
    save().then(function () {
      renderReview();
      document.getElementById('c-due').textContent = String(mem.filter(isDue).length);
    });
  });

  el.form.addEventListener('submit', function (e) {
    e.preventDefault();
    var front = el.front.value.trim();
    var back = el.back.value.trim();
    if (!front || !back) {
      el.msg.textContent = '正反面都要写';
      (front ? el.back : el.front).focus();
      return;
    }
    if (mem.length >= 2000) {
      el.msg.textContent = '卡片太多了，先删一些';
      return;
    }
    el.msg.textContent = '';
    touched = true;
    mem.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      front: front, back: back, box: 0, due: dayKey(), created: new Date().toISOString()
    });
    el.front.value = '';
    el.back.value = '';
    el.front.focus();
    save().then(function () { buildQueue(); render(); });
  });

  document.querySelectorAll('[data-pane]').forEach(function (tab) {
    tab.addEventListener('click', function () {
      view = tab.getAttribute('data-pane');
      if (view === 'review') buildQueue();
      render();
    });
  });

  load().then(function (list) {
    var loaded = list.map(function (c) {
      return {
        id: String(c.id || ''), front: String(c.front || ''), back: String(c.back || ''),
        box: Math.max(0, Math.min(5, Number(c.box) || 0)),
        due: String(c.due || ''), created: String(c.created || '')
      };
    }).filter(function (c) { return c.front && c.back; });
    if (touched) {
      // 加载期间用户已经动手：保留本地新增，再把仓库里没出现过的卡补回来
      var seen = {};
      mem.forEach(function (c) { seen[c.id] = true; });
      loaded.forEach(function (c) { if (!seen[c.id]) mem.push(c); });
      save();
    } else {
      mem = loaded;
    }
    buildQueue();
    render();
  });
})();
</script>

<script>
(function () {
  var api = window.glimnote && window.glimnote.data;
  if (!api) return;
  var timer = null;
  function banner() {
    var box = document.getElementById('__glnError');
    if (!box) {
      box = document.createElement('div');
      box.id = '__glnError';
      box.setAttribute('role', 'alert');
      box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:10px 12px;' +
        'border-radius:10px;background:#8f2f26;color:#fff;font:13px/1.5 system-ui,sans-serif;' +
        'box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;max-width:560px;margin:0 auto;';
      document.body.appendChild(box);
    }
    return box;
  }
  function show(message) {
    var box = banner();
    box.textContent = message || '未保存，请重试';
    box.style.display = 'block';
    clearTimeout(timer);
    timer = setTimeout(function () { box.style.display = 'none'; }, 5000);
  }
  ['set', 'remove', 'clear'].forEach(function (name) {
    var original = api[name];
    if (typeof original !== 'function') return;
    api[name] = function () {
      var promise = original.apply(api, arguments);
      if (promise && typeof promise.then === 'function') {
        promise.then(null, function (error) {
          show('保存失败：' + ((error && error.message) || '请重试'));
        });
      }
      return promise;
    };
  });
})();
</script>
</body>
</html>
