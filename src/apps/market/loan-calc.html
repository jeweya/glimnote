<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>贷款计算器</title>
<style>
  :root{--bg:#fffdf8;--surface:#fff;--line:#e6e3dc;--text:#1a1916;--sub:#6b6a65;
    --accent:#2f6b58;--accent-soft:#e8f1ed;--track:#efece4;
    --shadow:0 1px 2px rgba(26,25,22,.05),0 8px 24px rgba(26,25,22,.05)}
  @media (prefers-color-scheme:dark){:root{--bg:#1b1b19;--surface:#242422;--line:#373632;--text:#eceae4;--sub:#a4a29b;
    --accent:#6fae94;--accent-soft:#22302b;--track:#2e2e2a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;padding:18px 14px 22px}
  .wrap{width:100%;max-width:620px;display:flex;flex-direction:column;gap:12px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  h1{margin:0;font-size:17px;font-weight:600}
  .head p{margin:2px 0 0;font-size:12px;color:var(--sub)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:520px){.grid{grid-template-columns:1fr}}
  label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--sub)}
  input,select{font:inherit;font-size:13px;color:var(--text);background:var(--bg);border:1px solid var(--line);
    border-radius:9px;padding:8px 10px;outline:none;width:100%}
  input:focus,select:focus{border-color:var(--accent)}
  .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  @media (max-width:520px){.sum{grid-template-columns:1fr 1fr}.sum .metric:nth-child(3){grid-column:1/-1}}
  .metric{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:9px 11px}
  .metric span{display:block;font-size:11px;color:var(--sub)}
  .metric b{display:block;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}
  .metric.hero b{color:var(--accent)}
  .metric em{font-style:normal;font-size:10px;color:var(--sub)}
  .table-wrap{margin-top:14px;border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .table-head{display:flex;justify-content:space-between;align-items:center;padding:8px 11px;border-bottom:1px solid var(--line);
    font-size:12px;color:var(--sub);background:var(--bg)}
  .scroll{max-height:230px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
  th,td{padding:6px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--track)}
  th:first-child,td:first-child{text-align:left}
  th{position:sticky;top:0;background:var(--surface);color:var(--sub);font-weight:500;z-index:1}
  tbody tr:last-child td{border-bottom:0}
  .note{margin-top:10px;font-size:11px;color:var(--sub);line-height:1.5}
  .foot{font-size:11px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>贷款计算器</h1><p>等额本息和等额本金，算清月供和总利息</p></div>
  </div>
  <div class="card">
    <div class="grid">
      <label>贷款金额（万元）
        <input type="number" id="amount" min="0" step="1" value="100" inputmode="decimal">
      </label>
      <label>年利率（%）
        <input type="number" id="rate" min="0" step="0.05" value="3.1" inputmode="decimal">
      </label>
      <label>贷款年限（年）
        <input type="number" id="years" min="1" max="40" step="1" value="30" inputmode="numeric">
      </label>
      <label>还款方式
        <select id="method">
          <option value="equal">等额本息（每月一样）</option>
          <option value="principal">等额本金（逐月递减）</option>
        </select>
      </label>
    </div>

    <div class="sum">
      <div class="metric hero"><span id="monthLabel">每月还款</span><b id="month">—</b><em id="monthHint"></em></div>
      <div class="metric"><span>总利息</span><b id="interest">—</b><em id="interestHint"></em></div>
      <div class="metric"><span>还款总额</span><b id="total">—</b><em>本金 + 利息</em></div>
    </div>

    <div class="table-wrap">
      <div class="table-head"><span>逐年还款</span><span id="monthCount"></span></div>
      <div class="scroll">
        <table>
          <thead><tr><th>年份</th><th>年还本金</th><th>年还利息</th><th>年末剩余</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
    <div class="note">结果为按月计息的估算值，不含手续费、保险和提前还款；实际以银行合同为准。</div>
  </div>
  <div class="foot">参数保存在应用里 · 改一个数字就重新算</div>
</div>

<script>
(function () {
  var KEY = 'loan';
  var mem = {};
  var bridge = window.glimnote && window.glimnote.data;
  function get(k, d) {
    if (!bridge) return Promise.resolve(k in mem ? mem[k] : d);
    return bridge.get(k, d).catch(function () { return k in mem ? mem[k] : d; });
  }
  function set(k, v) {
    mem[k] = v;
    if (!bridge) return Promise.resolve();
    return bridge.set(k, v).catch(function () {});
  }

  var amountEl = document.getElementById('amount');
  var rateEl = document.getElementById('rate');
  var yearsEl = document.getElementById('years');
  var methodEl = document.getElementById('method');
  var touched = false; // 用户已经改过参数，异步载入的旧值不再覆盖

  function money(n) {
    if (!isFinite(n)) return '—';
    var fixed = Math.abs(n) >= 10000 ? n.toFixed(0) : n.toFixed(2);
    return Number(fixed).toLocaleString('zh-CN');
  }
  function save() {
    set(KEY, {
      amount: amountEl.value,
      rate: rateEl.value,
      years: yearsEl.value,
      method: methodEl.value
    });
  }

  function calc() {
    var P = Math.max(0, Number(amountEl.value) || 0) * 10000;
    var annual = Math.max(0, Number(rateEl.value) || 0) / 100;
    var n = Math.max(1, Math.min(480, Math.round(Number(yearsEl.value) || 1) * 12));
    var r = annual / 12;
    var method = methodEl.value;
    var rows = [];

    if (!P) {
      document.getElementById('monthLabel').textContent = '每月还款';
      document.getElementById('month').textContent = '—';
      document.getElementById('interest').textContent = '—';
      document.getElementById('total').textContent = '—';
      document.getElementById('monthHint').textContent = '';
      document.getElementById('interestHint').textContent = '';
      document.getElementById('monthCount').textContent = '';
      document.getElementById('rows').textContent = '';
      document.title = '贷款计算器';
      return;
    }

    var totalInterest;
    if (method === 'equal') {
      var pay = r === 0 ? P / n : P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
      totalInterest = pay * n - P;
      document.getElementById('monthLabel').textContent = '每月还款';
      document.getElementById('month').textContent = money(pay);
      document.getElementById('monthHint').textContent = '共 ' + n + ' 期';

      var balance = P;
      for (var y = 1; y <= Math.ceil(n / 12); y += 1) {
        var principalSum = 0, interestSum = 0;
        for (var m = (y - 1) * 12; m < Math.min(y * 12, n); m += 1) {
          var interest = balance * r;
          var principal = pay - interest;
          if (principal > balance) principal = balance;
          balance -= principal;
          principalSum += principal;
          interestSum += interest;
        }
        rows.push({ year: y, principal: principalSum, interest: interestSum, left: Math.max(0, balance) });
      }
    } else {
      var principalPart = P / n;
      var first = principalPart + P * r;
      var last = principalPart + principalPart * r;
      totalInterest = P * r * (n + 1) / 2;
      document.getElementById('monthLabel').textContent = '首月还款';
      document.getElementById('month').textContent = money(first);
      document.getElementById('monthHint').textContent = '末月约 ' + money(last);

      var left = P;
      for (var yr = 1; yr <= Math.ceil(n / 12); yr += 1) {
        var pSum = 0, iSum = 0;
        for (var mo = (yr - 1) * 12; mo < Math.min(yr * 12, n); mo += 1) {
          var int2 = left * r;
          var prin2 = principalPart;
          if (prin2 > left) prin2 = left;
          left -= prin2;
          pSum += prin2; iSum += int2;
        }
        rows.push({ year: yr, principal: pSum, interest: iSum, left: Math.max(0, left) });
      }
    }

    document.getElementById('interest').textContent = money(totalInterest);
    document.getElementById('interestHint').textContent = '利息占比 ' + Math.round(totalInterest / (P + totalInterest) * 100) + '%';
    document.getElementById('total').textContent = money(P + totalInterest);
    document.getElementById('monthCount').textContent = n + ' 期 · ' + (n / 12).toFixed(n % 12 ? 1 : 0) + ' 年';

    var tbody = document.getElementById('rows');
    tbody.textContent = '';
    rows.forEach(function (row) {
      var tr = document.createElement('tr');
      [('第 ' + row.year + ' 年'), money(row.principal), money(row.interest), money(row.left)].forEach(function (text) {
        var td = document.createElement('td');
        td.textContent = text;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    document.title = money(P) + ' · 贷款计算';
  }

  // 输入框允许手输，失焦时把年限拉回 1–40 年，避免显示的年份和实际计算不一致
  function clampYears() {
    var raw = Number(yearsEl.value);
    if (!isFinite(raw) || raw < 1) yearsEl.value = '1';
    else if (raw > 40) yearsEl.value = '40';
    else yearsEl.value = String(Math.round(raw) || 1);
  }

  [amountEl, rateEl, yearsEl, methodEl].forEach(function (el) {
    el.addEventListener('input', function () { touched = true; calc(); save(); });
    el.addEventListener('change', function () {
      touched = true;
      if (el === yearsEl) clampYears();
      calc();
      save();
    });
  });

  get(KEY, null).then(function (saved) {
    if (!touched && saved && typeof saved === 'object') {
      if (saved.amount !== undefined) amountEl.value = saved.amount;
      if (saved.rate !== undefined) rateEl.value = saved.rate;
      if (saved.years !== undefined) yearsEl.value = saved.years;
      if (saved.method === 'principal' || saved.method === 'equal') methodEl.value = saved.method;
    }
    if (!touched) clampYears();
    calc();
  });
})();
</script>

<script>
(function () {
  var api = window.glimnote && window.glimnote.data;
  if (!api) return;
  var timer = null;
  function banner() {
    var box = document.getElementById('__glnError');
    if (!box) {
      box = document.createElement('div');
      box.id = '__glnError';
      box.setAttribute('role', 'alert');
      box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:10px 12px;' +
        'border-radius:10px;background:#8f2f26;color:#fff;font:13px/1.5 system-ui,sans-serif;' +
        'box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;max-width:560px;margin:0 auto;';
      document.body.appendChild(box);
    }
    return box;
  }
  function show(message) {
    var box = banner();
    box.textContent = message || '未保存，请重试';
    box.style.display = 'block';
    clearTimeout(timer);
    timer = setTimeout(function () { box.style.display = 'none'; }, 5000);
  }
  ['set', 'remove', 'clear'].forEach(function (name) {
    var original = api[name];
    if (typeof original !== 'function') return;
    api[name] = function () {
      var promise = original.apply(api, arguments);
      if (promise && typeof promise.then === 'function') {
        promise.then(null, function (error) {
          show('保存失败：' + ((error && error.message) || '请重试'));
        });
      }
      return promise;
    };
  });
})();
</script>
</body>
</html>
