<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>购物清单</title>
<style>
  :root{--bg:#fffdf8;--surface:#fff;--line:#e6e3dc;--text:#1a1916;--sub:#6b6a65;
    --accent:#2f6b58;--accent-soft:#e8f1ed;--track:#efece4;
    --shadow:0 1px 2px rgba(26,25,22,.05),0 8px 24px rgba(26,25,22,.05)}
  @media (prefers-color-scheme:dark){:root{--bg:#1b1b19;--surface:#242422;--line:#373632;--text:#eceae4;--sub:#a4a29b;
    --accent:#6fae94;--accent-soft:#22302b;--track:#2e2e2a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;padding:18px 14px 22px}
  .wrap{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  h1{margin:0;font-size:17px;font-weight:600}
  .head p{margin:2px 0 0;font-size:12px;color:var(--sub)}
  .head .left{font-size:12px;color:var(--sub);white-space:nowrap}
  .head .left b{font-size:16px;color:var(--accent);font-variant-numeric:tabular-nums}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px}
  .bar{height:4px;border-radius:4px;background:var(--track);overflow:hidden;margin:2px 0 12px}
  .bar i{display:block;height:100%;width:0;border-radius:4px;background:var(--accent);transition:width .25s}
  .add{display:flex;gap:7px;margin-bottom:12px}
  .add input{flex:1;min-width:0;font:inherit;font-size:13px;color:var(--text);background:var(--bg);
    border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none}
  .add input:focus{border-color:var(--accent)}
  .btn{font:inherit;font-size:13px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);cursor:pointer;white-space:nowrap}
  .btn:hover{background:var(--bg)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
  li{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px}
  li:hover{background:var(--bg)}
  .tick{width:19px;height:19px;flex:0 0 19px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);
    cursor:pointer;display:grid;place-items:center;color:#fff;font-size:12px}
  li.done .tick{background:var(--accent);border-color:var(--accent)}
  .txt{flex:1;min-width:0;font-size:14px;word-break:break-word}
  li.done .txt{color:var(--sub);text-decoration:line-through}
  .del{border:0;background:transparent;color:var(--sub);font-size:16px;line-height:1;cursor:pointer;opacity:0}
  li:hover .del,li:focus-within .del{opacity:1}
  @media (hover:none){.del{opacity:1}}
  .link.armed{color:#8f2f26;font-weight:600}
  .section{margin-top:14px}
  .section-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:5px}
  .link{border:0;background:transparent;color:var(--accent);font:inherit;font-size:12px;cursor:pointer;padding:0}
  .empty{font-size:12px;color:var(--sub);padding:8px 0}
  .foot{font-size:11px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>购物清单</h1><p>想到就加，买完勾掉，下次接着用</p></div>
    <div class="left">还差 <b id="left">0</b> 件</div>
  </div>
  <div class="card">
    <div class="bar"><i id="bar"></i></div>
    <form class="add" id="form">
      <input type="text" id="input" maxlength="80" placeholder="要买什么？例如：牛奶 2 盒" aria-label="要买的东西">
      <button class="btn primary" type="submit">加入</button>
    </form>
    <ul id="todo"></ul>
    <div class="empty" id="empty">清单是空的，先加一样。</div>

    <div class="section" id="doneBox" style="display:none">
      <div class="section-head">
        <span>已买 <b id="doneCount">0</b> 件</span>
        <button class="link" id="clearDone" type="button">清空已买</button>
      </div>
      <ul id="done"></ul>
    </div>
  </div>
  <div class="foot">清单保存在应用里，换设备也在 · 勾选后移到下面</div>
</div>

<script>
(function () {
  var KEY = 'items';
  var mem = {};
  var bridge = window.glimnote && window.glimnote.data;
  function get(k, d) {
    if (!bridge) return Promise.resolve(k in mem ? mem[k] : d);
    return bridge.get(k, d).catch(function () { return k in mem ? mem[k] : d; });
  }
  function set(k, v) {
    mem[k] = v;
    if (!bridge) return Promise.resolve();
    return bridge.set(k, v).catch(function () {});
  }

  var items = [];
  var form = document.getElementById('form');
  var input = document.getElementById('input');
  var todoEl = document.getElementById('todo');
  var doneEl = document.getElementById('done');
  var doneBox = document.getElementById('doneBox');
  var emptyEl = document.getElementById('empty');
  var bar = document.getElementById('bar');
  var leftEl = document.getElementById('left');

  var touched = false; // 用户已经动过清单，异步载入的旧数据不再整体覆盖

  function save() { set(KEY, items); }

  function row(item) {
    var li = document.createElement('li');
    if (item.done) li.className = 'done';
    var tick = document.createElement('button');
    tick.className = 'tick';
    tick.type = 'button';
    tick.textContent = item.done ? '✓' : '';
    tick.title = item.done ? '放回待买' : '标记已买';
    tick.setAttribute('aria-label', tick.title);
    tick.addEventListener('click', function () {
      item.done = !item.done;
      save(); render();
    });
    var txt = document.createElement('span');
    txt.className = 'txt';
    txt.textContent = item.text;
    var del = document.createElement('button');
    del.className = 'del';
    del.type = 'button';
    del.textContent = '×';
    del.title = '删除';
    del.addEventListener('click', function () {
      items = items.filter(function (x) { return x.id !== item.id; });
      save(); render();
    });
    li.appendChild(tick); li.appendChild(txt); li.appendChild(del);
    return li;
  }

  function render() {
    var todo = items.filter(function (i) { return !i.done; });
    var done = items.filter(function (i) { return i.done; });
    todoEl.textContent = '';
    doneEl.textContent = '';
    todo.forEach(function (item) { todoEl.appendChild(row(item)); });
    done.forEach(function (item) { doneEl.appendChild(row(item)); });
    emptyEl.style.display = items.length ? 'none' : 'block';
    doneBox.style.display = done.length ? 'block' : 'none';
    document.getElementById('doneCount').textContent = String(done.length);
    leftEl.textContent = String(todo.length);
    var ratio = items.length ? Math.round((done.length / items.length) * 100) : 0;
    bar.style.width = ratio + '%';
    document.title = (todo.length ? todo.length + ' 件 · ' : '') + '购物清单';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    touched = true;
    items.push({ id: 'i' + Date.now().toString(36), text: text, done: false });
    input.value = '';
    save(); render();
    input.focus();
  });

  // 「清空已买」不可撤销，改成两步确认：第一次点击只进入待确认状态
  var clearBtn = document.getElementById('clearDone');
  var armTimer = null;
  function disarm() {
    clearTimeout(armTimer);
    clearBtn.classList.remove('armed');
    clearBtn.textContent = '清空已买';
  }
  clearBtn.addEventListener('click', function () {
    var doneCount = items.filter(function (i) { return i.done; }).length;
    if (!doneCount) return;
    if (!clearBtn.classList.contains('armed')) {
      clearBtn.classList.add('armed');
      clearBtn.textContent = '再点一次清空 ' + doneCount + ' 件';
      armTimer = setTimeout(disarm, 4000);
      return;
    }
    disarm();
    touched = true;
    items = items.filter(function (i) { return !i.done; });
    save(); render();
  });

  get(KEY, []).then(function (saved) {
    var list = Array.isArray(saved) ? saved.filter(function (i) { return i && i.text; }) : [];
    if (!touched) {
      items = list;
    } else {
      var seen = {};
      items.forEach(function (i) { seen[i.id] = true; });
      list.forEach(function (i) { if (!seen[i.id]) items.push(i); });
    }
    render();
  });
})();
</script>

<script>
(function () {
  var api = window.glimnote && window.glimnote.data;
  if (!api) return;
  var timer = null;
  function banner() {
    var box = document.getElementById('__glnError');
    if (!box) {
      box = document.createElement('div');
      box.id = '__glnError';
      box.setAttribute('role', 'alert');
      box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:10px 12px;' +
        'border-radius:10px;background:#8f2f26;color:#fff;font:13px/1.5 system-ui,sans-serif;' +
        'box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;max-width:560px;margin:0 auto;';
      document.body.appendChild(box);
    }
    return box;
  }
  function show(message) {
    var box = banner();
    box.textContent = message || '未保存，请重试';
    box.style.display = 'block';
    clearTimeout(timer);
    timer = setTimeout(function () { box.style.display = 'none'; }, 5000);
  }
  ['set', 'remove', 'clear'].forEach(function (name) {
    var original = api[name];
    if (typeof original !== 'function') return;
    api[name] = function () {
      var promise = original.apply(api, arguments);
      if (promise && typeof promise.then === 'function') {
        promise.then(null, function (error) {
          show('保存失败：' + ((error && error.message) || '请重试'));
        });
      }
      return promise;
    };
  });
})();
</script>
</body>
</html>
