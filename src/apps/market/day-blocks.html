<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日时间块</title>
<style>
  :root{--bg:#fffdf8;--surface:#fff;--line:#e6e3dc;--text:#1a1916;--sub:#6b6a65;
    --accent:#2f6b58;--accent-soft:#e8f1ed;--warn:#b4483c;--track:#efece4;
    --shadow:0 1px 2px rgba(26,25,22,.05),0 8px 24px rgba(26,25,22,.05)}
  @media (prefers-color-scheme:dark){:root{--bg:#1b1b19;--surface:#242422;--line:#373632;--text:#eceae4;--sub:#a4a29b;
    --accent:#6fae94;--accent-soft:#22302b;--warn:#e08a7d;--track:#2e2e2a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;padding:18px 14px 22px}
  .wrap{width:100%;max-width:620px;display:flex;flex-direction:column;gap:12px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  h1{margin:0;font-size:17px;font-weight:600}
  .head p{margin:2px 0 0;font-size:12px;color:var(--sub)}
  .head .date{font-size:12px;color:var(--sub);white-space:nowrap}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px}
  form.add{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  form.add input[type=text]{flex:1 1 160px;min-width:120px}
  input,select{font:inherit;font-size:13px;color:var(--text);background:var(--bg);border:1px solid var(--line);
    border-radius:8px;padding:7px 9px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  .btn{font:inherit;font-size:13px;padding:7px 14px;border-radius:8px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .msg{font-size:12px;color:var(--warn);min-height:16px;margin:-4px 0 6px}
  .board{position:relative;border-top:1px solid var(--line);max-height:70vh;overflow:auto;padding-top:7px}
  .hours{position:relative}
  .hour{height:44px;display:flex;align-items:flex-start}
  .hour span{width:52px;flex:0 0 52px;font-size:11px;color:var(--sub);transform:translateY(-7px);font-variant-numeric:tabular-nums}
  .hour i{flex:1;border-top:1px solid var(--track);height:1px}
  .lane{position:absolute;left:60px;right:4px;top:0;bottom:0}
  .block{position:absolute;left:0;right:0;border-radius:8px;padding:5px 9px;font-size:12px;line-height:1.35;
    background:var(--accent-soft);border-left:3px solid var(--accent);color:var(--text);overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;cursor:default}
  .block b{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .block em{font-style:normal;font-size:10px;color:var(--sub)}
  .block .del{position:absolute;right:4px;top:3px;border:0;background:transparent;color:var(--sub);
    font-size:14px;line-height:1;cursor:pointer;opacity:0}
  .block:hover .del,.block:focus-within .del{opacity:1}
  @media (hover:none){.block .del{opacity:1}}
  .block.c1{background:#e7f0ec;border-color:#4f8a73}
  .block.c2{background:#e8eef7;border-color:#5b82b0}
  .block.c3{background:#f6eeE2;border-color:#b78a45}
  .block.c4{background:#f2e9f1;border-color:#9a6b96}
  @media (prefers-color-scheme:dark){
    .block.c1{background:#22302b;border-color:#6fae94}
    .block.c2{background:#222c38;border-color:#7fa7cf}
    .block.c3{background:#332a1f;border-color:#d6a55e}
    .block.c4{background:#2e2430;border-color:#b79be0}
  }
  .now{position:absolute;left:52px;right:4px;height:2px;background:var(--warn);z-index:3}
  .now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
  .empty{font-size:12px;color:var(--sub);padding:8px 0 0}
  .foot{font-size:11px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>今日时间块</h1><p>把一天画出来，空隙一眼就看见</p></div>
    <div class="date" id="today"></div>
  </div>
  <div class="card">
    <form class="add" id="form">
      <input type="text" id="title" maxlength="40" placeholder="这段时间做什么？" aria-label="时间块名称">
      <input type="time" id="start" value="09:00" min="07:00" max="22:30" step="900" aria-label="开始时间">
      <select id="dur" aria-label="时长">
        <option value="30">30 分钟</option>
        <option value="60" selected>1 小时</option>
        <option value="90">1.5 小时</option>
        <option value="120">2 小时</option>
        <option value="180">3 小时</option>
      </select>
      <button class="btn primary" type="submit">加入</button>
    </form>
    <div class="msg" id="msg" role="status"></div>
    <div class="board">
      <div class="hours" id="hours">
        <div class="lane" id="lane"></div>
      </div>
    </div>
    <div class="empty" id="empty">还没有安排，先加一块试试。</div>
  </div>
  <div class="foot">只记录今天的安排，明天重新开始 · 点时间块右上角 × 删除</div>
</div>

<script>
(function () {
  var KEY = 'blocks';
  var START_H = 7, END_H = 23, HOUR_PX = 44;
  var mem = {};
  var bridge = window.glimnote && window.glimnote.data;
  function get(k, d) {
    if (!bridge) return Promise.resolve(k in mem ? mem[k] : d);
    return bridge.get(k, d).catch(function () { return k in mem ? mem[k] : d; });
  }
  function set(k, v) {
    mem[k] = v;
    if (!bridge) return Promise.resolve();
    return bridge.set(k, v).catch(function () {});
  }

  var today = dayKey(new Date());
  var items = [];
  var touched = false;

  var hoursEl = document.getElementById('hours');
  var lane = document.getElementById('lane');
  var msg = document.getElementById('msg');
  var empty = document.getElementById('empty');

  function dayKey(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function paintDate() {
    var d = new Date();
    document.getElementById('today').textContent = (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
  }

  // 跨过午夜后自动换到新的一天，别把新安排写进昨天
  function rollDay() {
    var k = dayKey(new Date());
    if (k !== today) {
      today = k;
      items = [];
      touched = false;
      paintDate();
    }
  }

  function deco() {
    for (var h = START_H; h <= END_H; h += 1) {
      var row = document.createElement('div');
      row.className = 'hour';
      var label = document.createElement('span');
      label.textContent = String(h).padStart(2, '0') + ':00';
      var line = document.createElement('i');
      row.appendChild(label); row.appendChild(line);
      hoursEl.insertBefore(row, lane);
    }
    hoursEl.style.height = (END_H - START_H + 1) * HOUR_PX + 'px';
    paintDate();
  }

  function minutes(hhmm) {
    var parts = String(hhmm || '').split(':');
    var h = Number(parts[0]), m = Number(parts[1]);
    if (!isFinite(h) || !isFinite(m)) return START_H * 60;
    return h * 60 + m;
  }

  function fmt(min) {
    return String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0');
  }

  function paint() {
    rollDay();
    Array.prototype.slice.call(lane.querySelectorAll('.block, .now')).forEach(function (n) { n.remove(); });
    var minStart = START_H * 60, minEnd = END_H * 60;
    var visible = items.filter(function (b) {
      var s = minutes(b.start), e = s + Number(b.dur || 60);
      return e > minStart && s < minEnd;
    }).sort(function (a, b) { return minutes(a.start) - minutes(b.start); });

    // 按重叠关系分组，同组内分列，重叠的块不再互相遮盖
    var groups = [];
    visible.forEach(function (b) {
      var s = Math.max(minStart, minutes(b.start));
      var e = Math.min(minEnd, minutes(b.start) + Number(b.dur || 60));
      var g = groups[groups.length - 1];
      if (!g || s >= g.end) {
        g = { end: e, list: [] };
        groups.push(g);
      } else if (e > g.end) {
        g.end = e;
      }
      g.list.push({ b: b, s: s, e: e });
    });
    groups.forEach(function (g) {
      var cols = [];
      g.list.forEach(function (item) {
        var col = 0;
        while (col < cols.length && cols[col] > item.s) col += 1;
        cols[col] = item.e;
        item.col = col;
      });
      g.count = Math.max(1, cols.length);
    });

    var idx = 0;
    groups.forEach(function (g) {
      g.list.forEach(function (item) {
        var b = item.b;
        var top = (item.s - minStart) / 60 * HOUR_PX;
        var height = Math.max(24, (item.e - item.s) / 60 * HOUR_PX - 3);
        var el = document.createElement('div');
        el.className = 'block c' + (Number(b.color) || (idx % 4) + 1);
        idx += 1;
        el.style.top = top + 'px';
        el.style.height = height + 'px';
        if (g.count > 1) {
          el.style.left = 'calc(' + (item.col * 100 / g.count) + '% + 1px)';
          el.style.width = 'calc(' + (100 / g.count) + '% - 2px)';
          el.style.right = 'auto';
        }
        var title = document.createElement('b');
        title.textContent = b.title;
        var time = document.createElement('em');
        time.textContent = fmt(minutes(b.start)) + ' – ' + fmt(minutes(b.start) + Number(b.dur || 60));
        var del = document.createElement('button');
        del.className = 'del';
        del.type = 'button';
        del.textContent = '×';
        del.title = '删除这块';
        del.addEventListener('click', function () {
          touched = true;
          items = items.filter(function (x) { return x.id !== b.id; });
          save();
          paint();
        });
        el.appendChild(title);
        if (height > 40) el.appendChild(time);
        el.appendChild(del);
        lane.appendChild(el);
      });
    });

    var now = new Date();
    var nowMin = now.getHours() * 60 + now.getMinutes();
    if (nowMin >= minStart && nowMin <= minEnd) {
      var line = document.createElement('div');
      line.className = 'now';
      line.style.top = ((nowMin - minStart) / 60 * HOUR_PX) + 'px';
      lane.appendChild(line);
    }
    empty.style.display = items.length ? 'none' : 'block';
    document.title = (visible.length ? visible.length + ' 块 · ' : '') + '今日时间块';
  }

  function save() {
    rollDay();
    set(KEY, { date: today, items: items });
  }

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    rollDay();
    var title = document.getElementById('title');
    var start = document.getElementById('start').value;
    var dur = Number(document.getElementById('dur').value) || 60;
    var text = title.value.trim();
    if (!text) { msg.textContent = '先写一下这段时间做什么'; title.focus(); return; }
    var s = minutes(start);
    if (s < START_H * 60 || s + dur > END_H * 60) {
      msg.textContent = '时间超出 07:00 – 23:00 的范围了';
      return;
    }
    msg.textContent = '';
    touched = true;
    items.push({ id: 'b' + Date.now().toString(36), title: text, start: start, dur: dur, color: (items.length % 4) + 1 });
    title.value = '';
    save();
    paint();
  });

  get(KEY, null).then(function (saved) {
    if (saved && saved.date === today && Array.isArray(saved.items)) {
      if (!touched) {
        items = saved.items;
      } else {
        // 用户抢在加载完成前加了块：保留已加的，再把旧数据里没出现过的补进来
        var seen = {};
        items.forEach(function (x) { seen[x.id] = true; });
        saved.items.forEach(function (x) {
          if (x && x.id && !seen[x.id]) items.push(x);
        });
        save();
      }
    }
    deco();
    paint();
    setInterval(paint, 60000);
  });
})();
</script>

<script>
(function () {
  var api = window.glimnote && window.glimnote.data;
  if (!api) return;
  var timer = null;
  function banner() {
    var box = document.getElementById('__glnError');
    if (!box) {
      box = document.createElement('div');
      box.id = '__glnError';
      box.setAttribute('role', 'alert');
      box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:10px 12px;' +
        'border-radius:10px;background:#8f2f26;color:#fff;font:13px/1.5 system-ui,sans-serif;' +
        'box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;max-width:560px;margin:0 auto;';
      document.body.appendChild(box);
    }
    return box;
  }
  function show(message) {
    var box = banner();
    box.textContent = message || '未保存，请重试';
    box.style.display = 'block';
    clearTimeout(timer);
    timer = setTimeout(function () { box.style.display = 'none'; }, 5000);
  }
  ['set', 'remove', 'clear'].forEach(function (name) {
    var original = api[name];
    if (typeof original !== 'function') return;
    api[name] = function () {
      var promise = original.apply(api, arguments);
      if (promise && typeof promise.then === 'function') {
        promise.then(null, function (error) {
          show('保存失败：' + ((error && error.message) || '请重试'));
        });
      }
      return promise;
    };
  });
})();
</script>
</body>
</html>
