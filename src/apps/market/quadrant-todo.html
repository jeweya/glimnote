<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四象限待办</title>
<style>
  :root{--bg:#fffdf8;--surface:#fff;--line:#e6e3dc;--text:#1a1916;--sub:#6b6a65;
    --accent:#2f6b58;--accent-soft:#e8f1ed;--red:#b4483c;--red-soft:#f7e7e4;
    --blue:#3a6ea5;--blue-soft:#e6eef7;--gray:#8a8880;--gray-soft:#efedea;
    --shadow:0 1px 2px rgba(26,25,22,.05),0 8px 24px rgba(26,25,22,.05)}
  @media (prefers-color-scheme:dark){:root{--bg:#1b1b19;--surface:#242422;--line:#373632;--text:#eceae4;--sub:#a4a29b;
    --accent:#6fae94;--accent-soft:#22302b;--red:#e08a7d;--red-soft:#3a2624;--blue:#7fa7cf;--blue-soft:#223041;--gray:#a4a29b;--gray-soft:#2c2c29;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;padding:18px 14px 22px}
  .wrap{width:100%;max-width:760px;display:flex;flex-direction:column;gap:12px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  h1{margin:0;font-size:17px;font-weight:600}
  .head p{margin:2px 0 0;font-size:12px;color:var(--sub)}
  .head b{font-size:16px;color:var(--accent);font-variant-numeric:tabular-nums}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:620px){.grid{grid-template-columns:1fr}}
  .quad{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:180px}
  .quad-head{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
  .quad-head i{margin-left:auto;font-style:normal;font-size:11px;color:var(--sub);font-weight:400}
  .q1 .dot{background:var(--red)}.q2 .dot{background:var(--accent)}
  .q3 .dot{background:var(--blue)}.q4 .dot{background:var(--gray)}
  .add{display:flex;gap:6px}
  .add input{flex:1;min-width:0;font:inherit;font-size:13px;color:var(--text);background:var(--bg);
    border:1px solid var(--line);border-radius:8px;padding:6px 9px;outline:none}
  .add input:focus{border-color:var(--accent)}
  .add button{width:30px;flex:0 0 30px;border:1px solid var(--line);border-radius:8px;background:var(--surface);
    color:var(--sub);font-size:17px;line-height:1;cursor:pointer}
  .add button:hover{color:var(--text);background:var(--bg)}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
  li{display:flex;align-items:flex-start;gap:7px;padding:4px 2px;border-radius:7px}
  li:hover{background:var(--bg)}
  .tick{width:17px;height:17px;flex:0 0 17px;margin-top:2px;border:1.5px solid var(--line);border-radius:5px;
    background:var(--surface);cursor:pointer;display:grid;place-items:center;color:#fff;font-size:11px}
  li.done .tick{background:var(--accent);border-color:var(--accent)}
  .txt{flex:1;min-width:0;font-size:13px;line-height:1.45;word-break:break-word}
  li.done .txt{color:var(--sub);text-decoration:line-through}
  .del{border:0;background:transparent;color:var(--sub);font-size:15px;line-height:1;cursor:pointer;
    padding:0 2px;opacity:0}
  li:hover .del,li:focus-within .del{opacity:1}
  @media (hover:none){.del{opacity:1}}
  .empty{font-size:12px;color:var(--sub);opacity:.8}
  .foot{font-size:11px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>四象限待办</h1><p>先做重要且紧急的，别让重要的事一直拖着</p></div>
    <div>还有 <b id="left">0</b> 件</div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="foot">数据保存在应用里，随笔记一起同步 · 勾选即完成</div>
</div>

<script>
(function () {
  var KEY = 'tasks';
  var mem = {};
  var bridge = window.glimnote && window.glimnote.data;
  function get(k, d) {
    if (!bridge) return Promise.resolve(k in mem ? mem[k] : d);
    return bridge.get(k, d).catch(function () { return k in mem ? mem[k] : d; });
  }
  function set(k, v) {
    mem[k] = v;
    if (!bridge) return Promise.resolve();
    return bridge.set(k, v).catch(function () {});
  }

  var QUADS = [
    { q: 1, name: '重要且紧急', hint: '马上做' },
    { q: 2, name: '重要不紧急', hint: '安排时间做' },
    { q: 3, name: '紧急不重要', hint: '能委托就委托' },
    { q: 4, name: '不重要不紧急', hint: '有空再说' }
  ];
  var tasks = [];
  var seq = 0;

  var grid = document.getElementById('grid');
  var leftEl = document.getElementById('left');

  function uid() {
    seq += 1;
    return 't' + Date.now().toString(36) + seq;
  }

  function save() { set(KEY, tasks); }

  function render() {
    grid.textContent = '';
    QUADS.forEach(function (quad) {
      var list = tasks.filter(function (t) { return Number(t.q) === quad.q; });
      var open = list.filter(function (t) { return !t.done; }).length;

      var box = document.createElement('section');
      box.className = 'quad q' + quad.q;

      var head = document.createElement('div');
      head.className = 'quad-head';
      var dot = document.createElement('span');
      dot.className = 'dot';
      var title = document.createElement('span');
      title.textContent = quad.name;
      var meta = document.createElement('i');
      meta.textContent = open + ' 件 · ' + quad.hint;
      head.appendChild(dot); head.appendChild(title); head.appendChild(meta);

      var form = document.createElement('form');
      form.className = 'add';
      var input = document.createElement('input');
      input.type = 'text';
      input.maxLength = 120;
      input.placeholder = '加一件事…';
      input.setAttribute('aria-label', '加入' + quad.name);
      var add = document.createElement('button');
      add.type = 'submit';
      add.textContent = '+';
      add.title = '添加';
      form.appendChild(input); form.appendChild(add);
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var text = input.value.trim();
        if (!text) return;
        tasks.push({ id: uid(), q: quad.q, text: text, done: false, created: new Date().toISOString() });
        input.value = '';
        save();
        render();
      });

      var ul = document.createElement('ul');
      if (!list.length) {
        var empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '暂时空着';
        ul.appendChild(empty);
      }
      list.forEach(function (task) {
        var li = document.createElement('li');
        if (task.done) li.className = 'done';
        var tick = document.createElement('button');
        tick.className = 'tick';
        tick.type = 'button';
        tick.setAttribute('aria-label', task.done ? '标记未完成' : '标记完成');
        tick.textContent = task.done ? '✓' : '';
        tick.addEventListener('click', function () {
          task.done = !task.done;
          save();
          render();
        });
        var txt = document.createElement('span');
        txt.className = 'txt';
        txt.textContent = task.text;
        var del = document.createElement('button');
        del.className = 'del';
        del.type = 'button';
        del.textContent = '×';
        del.title = '删除';
        del.addEventListener('click', function () {
          tasks = tasks.filter(function (t) { return t.id !== task.id; });
          save();
          render();
        });
        li.appendChild(tick); li.appendChild(txt); li.appendChild(del);
        ul.appendChild(li);
      });

      box.appendChild(head); box.appendChild(form); box.appendChild(ul);
      grid.appendChild(box);
    });
    var left = tasks.filter(function (t) { return !t.done; }).length;
    leftEl.textContent = String(left);
    document.title = (left ? left + ' 件 · ' : '') + '四象限待办';
  }

  get(KEY, []).then(function (saved) {
    tasks = Array.isArray(saved) ? saved.filter(function (t) { return t && t.text; }).map(function (t) {
      return { id: t.id || uid(), q: Number(t.q) || 1, text: String(t.text), done: !!t.done, created: t.created };
    }) : [];
    render();
  });
})();
</script>

<script>
(function () {
  var api = window.glimnote && window.glimnote.data;
  if (!api) return;
  var timer = null;
  function banner() {
    var box = document.getElementById('__glnError');
    if (!box) {
      box = document.createElement('div');
      box.id = '__glnError';
      box.setAttribute('role', 'alert');
      box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:10px 12px;' +
        'border-radius:10px;background:#8f2f26;color:#fff;font:13px/1.5 system-ui,sans-serif;' +
        'box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;max-width:560px;margin:0 auto;';
      document.body.appendChild(box);
    }
    return box;
  }
  function show(message) {
    var box = banner();
    box.textContent = message || '未保存，请重试';
    box.style.display = 'block';
    clearTimeout(timer);
    timer = setTimeout(function () { box.style.display = 'none'; }, 5000);
  }
  ['set', 'remove', 'clear'].forEach(function (name) {
    var original = api[name];
    if (typeof original !== 'function') return;
    api[name] = function () {
      var promise = original.apply(api, arguments);
      if (promise && typeof promise.then === 'function') {
        promise.then(null, function (error) {
          show('保存失败：' + ((error && error.message) || '请重试'));
        });
      }
      return promise;
    };
  });
})();
</script>
</body>
</html>
