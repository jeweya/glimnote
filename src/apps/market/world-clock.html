<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多时区时钟</title>
<style>
  :root{
    --bg:#fffdf8; --surface:#fff; --line:#e6e3dc; --text:#1a1916; --sub:#6b6a65;
    --accent:#2f6b58; --accent-soft:#e8f1ed; --warn:#b4483c; --amber:#b07f2a;
    --shadow:0 1px 2px rgba(26,25,22,.05),0 8px 24px rgba(26,25,22,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#1b1b19;--surface:#242422;--line:#373632;--text:#eceae4;--sub:#a4a29b;
      --accent:#6fae94;--accent-soft:#22302b;--warn:#e08a7d;--amber:#d6a75a;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;padding:18px 14px 26px}
  .wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px}
  h1{margin:0;font-size:17px;font-weight:600}
  .sub{margin:2px 0 0;font-size:12px;color:var(--sub)}
  .add{display:flex;gap:6px}
  .add select{flex:1;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);
    border-radius:10px;padding:8px 10px;min-width:0}
  .add select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .add button{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;
    border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
  .add button:hover{filter:brightness(1.06)}
  .list{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:10px 12px}
  .row .body{flex:1;min-width:0}
  .row .name{font-size:13px;font-weight:600}
  .row .meta{font-size:11px;color:var(--sub)}
  .row .time{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .row .time small{font-size:11px;font-weight:400;color:var(--sub);margin-left:4px}
  .row .del{border:0;background:transparent;color:var(--sub);cursor:pointer;padding:4px;border-radius:6px;line-height:0}
  .row .del:hover{background:var(--bg);color:var(--warn)}
  .empty{border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--sub);font-size:12px}
  .hint{display:none;font-size:12px;color:var(--warn);margin:-4px 0 0;padding-left:2px}
  .foot{font-size:11px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>多时区时钟</h1>
    <p class="sub">跨时差开会前，先看一眼对面几点；夏令时自动处理</p>
  </div>

  <div class="add">
    <select id="picker" aria-label="选择城市">
      <option value="Asia/Shanghai">北京 / 上海</option>
      <option value="Asia/Hong_Kong">香港</option>
      <option value="Asia/Taipei">台北</option>
      <option value="Asia/Tokyo">东京</option>
      <option value="Asia/Seoul">首尔</option>
      <option value="Asia/Singapore">新加坡</option>
      <option value="Asia/Bangkok">曼谷</option>
      <option value="Asia/Kolkata">孟买 / 新德里</option>
      <option value="Asia/Dubai">迪拜</option>
      <option value="Europe/Moscow">莫斯科</option>
      <option value="Europe/Berlin">柏林</option>
      <option value="Europe/Paris">巴黎</option>
      <option value="Europe/London">伦敦</option>
      <option value="America/Sao_Paulo">圣保罗</option>
      <option value="America/New_York">纽约</option>
      <option value="America/Chicago">芝加哥</option>
      <option value="America/Denver">丹佛</option>
      <option value="America/Los_Angeles">洛杉矶</option>
      <option value="America/Vancouver">温哥华</option>
      <option value="Australia/Sydney">悉尼</option>
      <option value="Pacific/Auckland">奥克兰</option>
      <option value="UTC">UTC 协调世界时</option>
    </select>
    <button type="button" id="add">添加</button>
  </div>
  <p class="hint" id="hint" role="status"></p>

  <div class="list" id="list"></div>
  <div class="foot">最多 8 个城市 · 已选列表保存在仓库里，换设备也在</div>
</div>

<script>
(function () {
  var KEY = 'zones';
  var DEFAULT = ['Asia/Shanghai', 'Europe/London', 'America/New_York'];
  var mem = DEFAULT.slice();
  var touched = false;
  var bridge = window.glimnote && window.glimnote.data;
  var labelOf = {};

  Array.prototype.forEach.call(document.querySelectorAll('#picker option'), function (o) {
    labelOf[o.value] = o.textContent;
  });

  function load() {
    if (!bridge) return Promise.resolve(mem);
    return bridge.get(KEY, DEFAULT).then(function (v) {
      // 空数组是有效状态（用户全部删掉了），只有完全没有记录时才用默认城市
      if (!Array.isArray(v)) return DEFAULT.slice();
      var seen = {};
      return v.filter(function (z) {
        if (typeof z !== 'string' || !labelOf[z] || seen[z]) return false;
        seen[z] = true;
        return true;
      }).slice(0, 8);
    }).catch(function () { return mem; });
  }
  function save() {
    if (!bridge) return Promise.resolve();
    return bridge.set(KEY, mem).catch(function () {});
  }

  function parts(tz, date) {
    var dtf = new Intl.DateTimeFormat('en-US', {
      timeZone: tz, hour12: false, year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', weekday: 'short'
    });
    var out = {};
    dtf.formatToParts(date).forEach(function (p) { out[p.type] = p.value; });
    return out;
  }

  function offsetMinutes(tz, date) {
    try {
      var p = parts(tz, date);
      var asUTC = Date.UTC(Number(p.year), Number(p.month) - 1, Number(p.day),
        Number(p.hour) % 24, Number(p.minute), Number(p.second));
      return Math.round((asUTC - date.getTime()) / 60000);
    } catch (e) {
      return 0;
    }
  }

  function offsetText(min) {
    var sign = min >= 0 ? '+' : '−';
    var abs = Math.abs(min);
    var h = Math.floor(abs / 60), m = abs % 60;
    return 'UTC' + sign + h + (m ? ':' + String(m).padStart(2, '0') : '');
  }

  function dayDelta(tzParts, localDate) {
    var a = Date.UTC(Number(tzParts.year), Number(tzParts.month) - 1, Number(tzParts.day));
    var b = Date.UTC(localDate.getFullYear(), localDate.getMonth(), localDate.getDate());
    return Math.round((a - b) / 86400000);
  }

  var el = { list: document.getElementById('list'), picker: document.getElementById('picker') };
  var hintEl = document.getElementById('hint');
  var hintTimer = null;

  function hint(text) {
    hintEl.textContent = text;
    hintEl.style.display = text ? 'block' : 'none';
    clearTimeout(hintTimer);
    if (text) hintTimer = setTimeout(function () {
      hintEl.textContent = '';
      hintEl.style.display = 'none';
    }, 2800);
  }

  function renderList() {
    el.list.textContent = '';
    if (!mem.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '还没添加城市，从上面选一个';
      el.list.appendChild(empty);
      return;
    }
    mem.forEach(function (tz) {
      var row = document.createElement('div');
      row.className = 'row';
      row.setAttribute('data-tz', tz);

      var body = document.createElement('div');
      body.className = 'body';
      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = labelOf[tz] || tz;
      var meta = document.createElement('div');
      meta.className = 'meta';
      meta.setAttribute('data-meta', '');
      body.appendChild(name);
      body.appendChild(meta);

      var time = document.createElement('div');
      time.className = 'time';
      time.setAttribute('data-time', '');

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.title = '移除';
      del.setAttribute('aria-label', '移除 ' + (labelOf[tz] || tz));
      del.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
      del.addEventListener('click', function () {
        touched = true;
        mem = mem.filter(function (z) { return z !== tz; });
        save().then(renderList);
        tick();
      });

      row.appendChild(body);
      row.appendChild(time);
      row.appendChild(del);
      el.list.appendChild(row);
    });
  }

  function tick() {
    var now = new Date();
    Array.prototype.forEach.call(el.list.querySelectorAll('.row'), function (row) {
      var tz = row.getAttribute('data-tz');
      var p;
      try {
        p = parts(tz, now);
      } catch (e) {
        return;
      }
      var timeEl = row.querySelector('[data-time]');
      var metaEl = row.querySelector('[data-meta]');
      var delta = dayDelta(p, now);
      var dayText = delta === 0 ? '今天' : delta > 0 ? '明天' : '昨天';
      var hh = String(Number(p.hour) % 24).padStart(2, '0');
      timeEl.textContent = hh + ':' + p.minute;
      var small = document.createElement('small');
      small.textContent = p.second;
      timeEl.appendChild(small);
      var week = { Mon: '周一', Tue: '周二', Wed: '周三', Thu: '周四', Fri: '周五', Sat: '周六', Sun: '周日' }[p.weekday] || p.weekday;
      metaEl.textContent = dayText + ' · ' + week + ' · ' + offsetText(offsetMinutes(tz, now));
    });
  }

  document.getElementById('add').addEventListener('click', function () {
    var tz = el.picker.value;
    if (!tz) return;
    if (mem.indexOf(tz) >= 0) { hint('「' + (labelOf[tz] || tz) + '」已经在列表里了'); return; }
    if (mem.length >= 8) { hint('最多同时看 8 个城市，先移除一个再添加'); return; }
    hint('');
    touched = true;
    mem = mem.concat([tz]);
    save();
    renderList();
    tick();
  });

  load().then(function (zones) {
    // 加载是异步的：用户可能已经先加了城市，别拿旧数据覆盖
    if (!touched) {
      mem = zones.slice(0, 8);
      renderList();
      tick();
    }
  });

  setInterval(tick, 1000);
})();
</script>

<script>
(function () {
  var api = window.glimnote && window.glimnote.data;
  if (!api) return;
  var timer = null;
  function banner() {
    var box = document.getElementById('__glnError');
    if (!box) {
      box = document.createElement('div');
      box.id = '__glnError';
      box.setAttribute('role', 'alert');
      box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:10px 12px;' +
        'border-radius:10px;background:#8f2f26;color:#fff;font:13px/1.5 system-ui,sans-serif;' +
        'box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;max-width:560px;margin:0 auto;';
      document.body.appendChild(box);
    }
    return box;
  }
  function show(message) {
    var box = banner();
    box.textContent = message || '未保存，请重试';
    box.style.display = 'block';
    clearTimeout(timer);
    timer = setTimeout(function () { box.style.display = 'none'; }, 5000);
  }
  ['set', 'remove', 'clear'].forEach(function (name) {
    var original = api[name];
    if (typeof original !== 'function') return;
    api[name] = function () {
      var promise = original.apply(api, arguments);
      if (promise && typeof promise.then === 'function') {
        promise.then(null, function (error) {
          show('保存失败：' + ((error && error.message) || '请重试'));
        });
      }
      return promise;
    };
  });
})();
</script>
</body>
</html>
