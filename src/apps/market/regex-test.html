<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正则测试</title>
<style>
  :root{
    --bg:#fffdf8; --surface:#fff; --line:#e6e3dc; --text:#1a1916; --sub:#6b6a65;
    --accent:#2f6b58; --accent-soft:#e8f1ed; --warn:#b4483c; --dim:#f4f1e9;
    --shadow:0 1px 2px rgba(26,25,22,.05),0 8px 24px rgba(26,25,22,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#1b1b19;--surface:#242422;--line:#373632;--text:#eceae4;--sub:#a4a29b;
      --accent:#6fae94;--accent-soft:#22302b;--warn:#e08a7d;--dim:#2d2d2a;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;padding:18px 14px 24px}
  .wrap{width:100%;max-width:820px;display:flex;flex-direction:column;gap:10px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{margin:0;font-size:17px;font-weight:600}
  .head p{margin:2px 0 0;font-size:12px;color:var(--sub)}
  .samples{display:flex;flex-wrap:wrap;gap:5px}
  .samples button{font:inherit;font-size:11.5px;border:1px solid var(--line);background:var(--surface);
    color:var(--sub);border-radius:999px;padding:3px 9px;cursor:pointer}
  .samples button:hover{border-color:var(--accent);color:var(--accent)}
  .pattern{background:var(--surface);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .pattern .slash{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:16px;color:var(--sub)}
  #pattern{flex:1;min-width:180px;font:inherit;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13px;color:var(--text);background:var(--bg);border:1px solid var(--line);
    border-radius:8px;padding:6px 9px;outline:none}
  #pattern:focus{border-color:var(--accent)}
  #flagText{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;
    color:var(--accent);min-width:18px}
  .flags{display:flex;gap:3px;flex-wrap:wrap}
  .flags button{font:inherit;font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    border:1px solid var(--line);background:var(--surface);color:var(--sub);border-radius:6px;
    padding:3px 7px;cursor:pointer}
  .flags button:hover{border-color:var(--accent);color:var(--accent)}
  .flags button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
  .tools{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .tools button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--surface);
    color:var(--sub);border-radius:8px;padding:5px 10px;cursor:pointer}
  .tools button:hover{border-color:var(--accent);color:var(--accent)}
  .tools button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .tools button.primary:hover{filter:brightness(1.06)}
  .tools button.danger:hover{border-color:var(--warn);color:var(--warn)}
  textarea{width:100%;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12.5px;line-height:1.65;color:inherit;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:10px;box-shadow:var(--shadow)}
  textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  textarea[readonly]{color:var(--text)}
  #text{min-height:130px}
  h2{margin:2px 0 0;font-size:12px;font-weight:500;color:var(--sub);
    display:flex;justify-content:space-between;align-items:center;gap:8px}
  h2 span:last-child{font-weight:400;font-size:11px}
  .highlight{background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:10px;min-height:60px;max-height:210px;overflow:auto;white-space:pre-wrap;word-break:break-word;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.7}
  .highlight .empty{color:var(--sub);font-family:system-ui,sans-serif;font-size:12px}
  mark{background:var(--accent-soft);color:var(--accent);border-bottom:1px solid var(--accent);
    border-radius:3px;padding:0 1px}
  .msg{font-size:12px;color:var(--accent);min-height:18px;word-break:break-word}
  .msg.err{color:var(--warn)}
  .list-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;
    max-height:240px;overflow:auto}
  .list-wrap .empty{padding:10px 12px;font-size:12px;color:var(--sub)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{padding:6px 9px;text-align:left;border-bottom:1px solid var(--dim);vertical-align:top}
  th{position:sticky;top:0;background:var(--surface);color:var(--sub);font-weight:500;z-index:1}
  tr:last-child td{border-bottom:0}
  td.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all}
  td.pos{font-variant-numeric:tabular-nums;color:var(--sub);white-space:nowrap}
  td.group{color:var(--sub);font-size:11px}
  .replace{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:680px){.replace{grid-template-columns:1fr}}
  .replace .pane{display:flex;flex-direction:column;gap:5px;min-width:0}
  #replacement{font:inherit;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12.5px;color:var(--text);background:var(--surface);border:1px solid var(--line);
    border-radius:9px;padding:7px 9px;outline:none}
  #replacement:focus{border-color:var(--accent)}
  #replaced{min-height:86px}
  .foot{font-size:11px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>正则测试</h1>
      <p>边写边看匹配、分组和替换结果，不用来回切工具</p>
    </div>
  </div>

  <div class="samples">
    <button type="button" data-sample="email">邮箱</button>
    <button type="button" data-sample="phone">手机号</button>
    <button type="button" data-sample="url">网址</button>
    <button type="button" data-sample="date">日期</button>
    <button type="button" data-sample="cn">中文</button>
    <button type="button" data-sample="space">多余空格</button>
    <button type="button" data-act="fillText">填入示例文本</button>
  </div>

  <div class="pattern">
    <span class="slash">/</span>
    <input id="pattern" spellcheck="false" autocomplete="off" aria-label="正则表达式"
      placeholder="例如：\b\w+@\w+\.\w+\b">
    <span class="slash">/</span>
    <span id="flagText">g</span>
    <div class="flags" role="group" aria-label="匹配选项">
      <button type="button" data-flag="g" class="on" aria-pressed="true" title="全局匹配">g</button>
      <button type="button" data-flag="i" aria-pressed="false" title="忽略大小写">i</button>
      <button type="button" data-flag="m" aria-pressed="false" title="多行模式">m</button>
      <button type="button" data-flag="s" aria-pressed="false" title="点号匹配换行">s</button>
      <button type="button" data-flag="u" aria-pressed="false" title="Unicode 模式">u</button>
      <button type="button" data-flag="y" aria-pressed="false" title="粘连匹配">y</button>
    </div>
  </div>

  <div class="tools">
    <button type="button" data-act="run" class="primary">测试</button>
    <button type="button" data-act="copyMatches">复制匹配内容</button>
    <button type="button" data-act="copyReplaced">复制替换结果</button>
    <button type="button" data-act="clear" class="danger">清空</button>
  </div>

  <h2><span>测试文本</span><span id="textCount">0 字符</span></h2>
  <textarea id="text" spellcheck="false" aria-label="测试文本"
    placeholder="粘一段要测试的文本。匹配结果会立刻高亮，下面列出每一处和它的分组。"></textarea>

  <div class="msg" id="msg" role="status"></div>

  <h2><span>高亮预览</span><span id="summary">还没有匹配</span></h2>
  <div class="highlight" id="highlight"><div class="empty">匹配到的内容会在这里高亮</div></div>

  <h2><span>匹配明细</span><span>最多显示 200 条</span></h2>
  <div class="list-wrap" id="listWrap"><div class="empty">还没有匹配结果</div></div>

  <h2><span>替换预览</span><span>支持 $1、$&amp;、$&lt;name&gt;</span></h2>
  <div class="replace">
    <div class="pane">
      <input id="replacement" spellcheck="false" aria-label="替换内容"
        placeholder="替换为……留空表示删除匹配内容">
    </div>
    <div class="pane">
      <textarea id="replaced" spellcheck="false" readonly aria-label="替换结果"
        placeholder="替换后的文本"></textarea>
    </div>
  </div>

  <div class="foot">匹配都在本机完成 · 文本较长时会限制在 2000 处以内，避免卡住</div>
</div>

<script>
(function () {
  var patternEl = document.getElementById('pattern');
  var textEl = document.getElementById('text');
  var flagText = document.getElementById('flagText');
  var highlight = document.getElementById('highlight');
  var listWrap = document.getElementById('listWrap');
  var summary = document.getElementById('summary');
  var msg = document.getElementById('msg');
  var replacementEl = document.getElementById('replacement');
  var replacedEl = document.getElementById('replaced');
  var textCount = document.getElementById('textCount');

  var flags = { g: true, i: false, m: false, s: false, u: false, y: false };
  var timer = null;
  var lastMatches = [];

  var SAMPLES = {
    email: '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}',
    phone: '1[3-9]\\d{9}',
    url: 'https?://[^\\s"\'<>]+',
    date: '\\d{4}-\\d{2}-\\d{2}',
    cn: '[\\u4e00-\\u9fa5]+',
    space: '[ \\t]{2,}',
  };

  function say(text, isErr) {
    msg.textContent = text;
    msg.className = 'msg' + (isErr ? ' err' : '');
  }

  function flagString() {
    return ['g', 'i', 'm', 's', 'u', 'y'].filter(function (f) { return flags[f]; }).join('');
  }

  function clearView(emptyText) {
    highlight.textContent = '';
    var empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = emptyText;
    highlight.appendChild(empty);
    listWrap.textContent = '';
    var empty2 = document.createElement('div');
    empty2.className = 'empty';
    empty2.textContent = emptyText;
    listWrap.appendChild(empty2);
    summary.textContent = emptyText;
    replacedEl.value = '';
    lastMatches = [];
  }

  function showHighlight(text, matches) {
    highlight.textContent = '';
    if (!text) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '还没有测试文本';
      highlight.appendChild(empty);
      return;
    }
    var frag = document.createDocumentFragment();
    var pos = 0;
    var marked = 0;
    matches.forEach(function (m) {
      var start = m.index;
      var end = start + m[0].length;
      if (start > pos) frag.appendChild(document.createTextNode(text.slice(pos, start)));
      if (end > start) {
        var mark = document.createElement('mark');
        mark.textContent = text.slice(start, end);
        frag.appendChild(mark);
        marked += 1;
      }
      pos = Math.max(pos, end);
    });
    if (pos < text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
    if (!marked && matches.length) {
      var tip = document.createElement('div');
      tip.className = 'empty';
      tip.textContent = '匹配都是零长度（例如 ^ 或 \\b），文字里没有可高亮的片段';
      highlight.appendChild(tip);
    }
    highlight.appendChild(frag);
  }

  function groupText(m) {
    var parts = [];
    for (var i = 1; i < m.length; i += 1) {
      parts.push('$' + i + '=' + (m[i] === undefined ? '未参与' : m[i]));
    }
    if (m.groups) {
      Object.keys(m.groups).forEach(function (name) {
        parts.push('$<' + name + '>=' + (m.groups[name] === undefined ? '未参与' : m.groups[name]));
      });
    }
    return parts.join(' · ');
  }

  function showList(text, matches) {
    listWrap.textContent = '';
    if (!matches.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '没有匹配到内容';
      listWrap.appendChild(empty);
      return;
    }
    var table = document.createElement('table');
    var thead = document.createElement('thead');
    var hr = document.createElement('tr');
    ['#', '位置', '匹配内容', '分组'].forEach(function (name) {
      var th = document.createElement('th');
      th.textContent = name;
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    table.appendChild(thead);
    var tbody = document.createElement('tbody');
    matches.slice(0, 200).forEach(function (m, index) {
      var tr = document.createElement('tr');
      var tdIndex = document.createElement('td');
      tdIndex.className = 'pos';
      tdIndex.textContent = String(index + 1);
      var tdPos = document.createElement('td');
      tdPos.className = 'pos';
      tdPos.textContent = (m.index + 1) + '–' + (m.index + m[0].length);
      var tdMatch = document.createElement('td');
      tdMatch.className = 'mono';
      var value = m[0];
      tdMatch.textContent = value.length > 120 ? value.slice(0, 120) + '…' : value || '（空）';
      var tdGroup = document.createElement('td');
      tdGroup.className = 'group mono';
      tdGroup.textContent = groupText(m) || '—';
      tr.appendChild(tdIndex);
      tr.appendChild(tdPos);
      tr.appendChild(tdMatch);
      tr.appendChild(tdGroup);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    listWrap.appendChild(table);
    if (matches.length > 200) {
      var more = document.createElement('div');
      more.className = 'empty';
      more.textContent = '还有 ' + (matches.length - 200) + ' 处没有列出';
      listWrap.appendChild(more);
    }
  }

  function renderReplace(text, matches) {
    if (!matches.length) {
      replacedEl.value = '';
      return;
    }
    try {
      var re = new RegExp(patternEl.value, flagString());
      replacedEl.value = text.replace(re, replacementEl.value);
    } catch (e) {
      replacedEl.value = '';
    }
  }

  function run() {
    textCount.textContent = textEl.value.length + ' 字符';
    var pattern = patternEl.value;
    var text = textEl.value;
    flagText.textContent = flagString() || '（无）';

    if (!pattern) {
      clearView('先写一个正则表达式');
      say('');
      return;
    }
    if (!text) {
      clearView('还没有测试文本');
      say('先粘一段要测试的文本', true);
      return;
    }

    var re;
    try {
      re = new RegExp(pattern, flagString());
    } catch (e) {
      clearView('正则写错了，改好再看结果');
      say('正则写错了：' + ((e && e.message) || '语法不对'), true);
      return;
    }

    var matches = [];
    var truncated = false;
    try {
      if (re.global || re.sticky) {
        var m;
        while ((m = re.exec(text)) !== null) {
          matches.push(m);
          if (matches.length >= 2000) {
            truncated = true;
            break;
          }
          if (m[0] === '') re.lastIndex += 1;
          if (re.lastIndex > text.length) break;
        }
      } else {
        var one = re.exec(text);
        if (one) matches.push(one);
      }
    } catch (e) {
      clearView('匹配时出错');
      say('匹配时出错：' + ((e && e.message) || '未知问题'), true);
      return;
    }

    lastMatches = matches;
    showHighlight(text, matches);
    showList(text, matches);
    summary.textContent = matches.length
      ? '找到 ' + matches.length + ' 处匹配' + (truncated ? '（已到 2000 处上限）' : '')
      : '没有匹配到内容';
    say(matches.length ? '匹配完成' : '这段文本里没有匹配');
    renderReplace(text, matches);
  }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(run, 140);
  }

  var ACTIONS = {
    run: run,
    fillText: function () {
      textEl.value = [
        '联系人：林晓 lin.xiao@example.com，电话 13800138000。',
        '项目主页 https://glimnote.example.com/docs，更新于 2026-11-10。',
        '备注：这是一段   中间有多余空格   的示例文本。',
      ].join('\n');
      schedule();
    },
    copyMatches: function () {
      if (!lastMatches.length) return say('还没有匹配内容可复制', true);
      var text = lastMatches.map(function (m) { return m[0]; }).join('\n');
      copy(text, '已复制 ' + lastMatches.length + ' 条匹配');
    },
    copyReplaced: function () {
      if (!replacedEl.value) return say('还没有替换结果可复制', true);
      copy(replacedEl.value, '已复制替换结果');
    },
    clear: function () {
      patternEl.value = '';
      textEl.value = '';
      replacementEl.value = '';
      clearView('还没有匹配结果');
      textCount.textContent = '0 字符';
      flagText.textContent = flagString();
      say('');
      patternEl.focus();
    },
  };

  function copy(text, okMessage) {
    var fail = function () { say('复制失败，请手动选择后按 Ctrl+C', true); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { say(okMessage); }, fail);
        return;
      }
    } catch (e) { /* 兜底 */ }
    var area = document.createElement('textarea');
    area.value = text;
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    try {
      document.execCommand('copy') ? say(okMessage) : fail();
    } catch (e2) {
      fail();
    }
    document.body.removeChild(area);
  }

  document.querySelectorAll('[data-flag]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var flag = btn.getAttribute('data-flag');
      flags[flag] = !flags[flag];
      btn.classList.toggle('on', flags[flag]);
      btn.setAttribute('aria-pressed', String(flags[flag]));
      flagText.textContent = flagString() || '（无）';
      schedule();
    });
  });

  document.querySelectorAll('[data-sample]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var sample = SAMPLES[btn.getAttribute('data-sample')];
      if (!sample) return;
      patternEl.value = sample;
      if (!textEl.value.trim()) ACTIONS.fillText();
      else schedule();
    });
  });

  document.querySelectorAll('[data-act]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var act = ACTIONS[btn.getAttribute('data-act')];
      if (act) act();
    });
  });

  patternEl.addEventListener('input', schedule);
  textEl.addEventListener('input', schedule);
  replacementEl.addEventListener('input', function () {
    renderReplace(textEl.value, lastMatches);
  });
  patternEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      run();
    }
  });

  run();
})();
</script>
</body>
</html>
