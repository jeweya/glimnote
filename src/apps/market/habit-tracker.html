<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>习惯打卡</title>
<style>
  :root{
    --bg:#fffdf8; --surface:#fff; --line:#e6e3dc; --text:#1a1916; --sub:#6b6a65;
    --accent:#2f6b58; --accent-soft:#e8f1ed; --warn:#b4483c; --dim:#ede9e0;
    --shadow:0 1px 2px rgba(26,25,22,.05),0 8px 24px rgba(26,25,22,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#1b1b19;--surface:#242422;--line:#373632;--text:#eceae4;--sub:#a4a29b;
      --accent:#6fae94;--accent-soft:#22302b;--warn:#e08a7d;--dim:#33322e;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;padding:18px 14px 26px}
  .wrap{width:100%;max-width:600px;display:flex;flex-direction:column;gap:12px}
  h1{margin:0;font-size:17px;font-weight:600}
  .sub{margin:2px 0 0;font-size:12px;color:var(--sub)}
  .add{display:flex;gap:6px}
  .add input{flex:1;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);
    border-radius:10px;padding:8px 10px;min-width:0}
  .add input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .add button{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;
    border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
  .add button:hover{filter:brightness(1.06)}
  .list{display:flex;flex-direction:column;gap:10px}
  .item{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:12px 13px;display:flex;flex-direction:column;gap:9px}
  .top{display:flex;align-items:center;gap:10px}
  .name{font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .streak{font-size:11px;color:var(--sub);white-space:nowrap}
  .streak b{color:var(--accent);font-size:13px;font-variant-numeric:tabular-nums}
  .check{width:34px;height:34px;flex:none;border-radius:10px;border:1px solid var(--line);
    background:var(--bg);color:transparent;cursor:pointer;display:grid;place-items:center;
    transition:background .15s,border-color .15s,color .15s}
  .check:hover{border-color:var(--accent)}
  .check:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .check.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(28,1fr);gap:2px}
  .cell{aspect-ratio:1;border-radius:2px;background:var(--dim);min-width:3px}
  .cell.on{background:var(--accent);opacity:.85}
  .cell.today{box-shadow:0 0 0 1px var(--accent)}
  .cell.future{background:transparent;box-shadow:inset 0 0 0 1px var(--dim)}
  .legend{font-size:10px;color:var(--sub);display:flex;justify-content:space-between}
  .empty{border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--sub);font-size:12px}
  .msg{font-size:12px;color:var(--warn);min-height:16px}
  .foot{font-size:11px;color:var(--sub);text-align:center}
  .del{border:0;background:transparent;color:var(--sub);cursor:pointer;padding:3px;border-radius:6px;line-height:0}
  .del:hover{background:var(--bg);color:var(--warn)}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>习惯打卡</h1>
    <p class="sub">连续天数会累加，断一天就归零；格子是最近 28 天</p>
  </div>

  <form class="add" id="form">
    <input id="name" maxlength="16" placeholder="想坚持的事，例如 早起、读书 30 分钟" aria-label="习惯名称">
    <button type="submit">添加</button>
  </form>
  <div class="msg" id="msg" role="status"></div>

  <div class="list" id="list"></div>
  <div class="foot">数据保存在仓库里，随同步上云；换台电脑接着打</div>
</div>

<script>
(function () {
  var KEY = 'habits';
  var mem = [];
  var bridge = window.glimnote && window.glimnote.data;

  function load() {
    if (!bridge) return Promise.resolve(mem);
    return bridge.get(KEY, []).then(function (v) { return Array.isArray(v) ? v : []; })
      .catch(function () { return mem; });
  }
  function save() {
    if (!bridge) return Promise.resolve();
    return bridge.set(KEY, mem).catch(function () {});
  }

  var touched = false;
  var lastDay = '';
  var el = { list: document.getElementById('list'), form: document.getElementById('form'),
    name: document.getElementById('name'), msg: document.getElementById('msg') };

  function dayKey(d) {
    var t = d || new Date();
    return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
  }

  function streak(habit) {
    var n = 0;
    var d = new Date();
    // 今天没打也不算断，从昨天往前数
    if (!habit.log[dayKey(d)]) d.setDate(d.getDate() - 1);
    while (habit.log[dayKey(d)]) {
      n += 1;
      d.setDate(d.getDate() - 1);
    }
    return n;
  }

  function render() {
    el.list.textContent = '';
    if (!mem.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '还没有习惯。先加一个最容易坚持的。';
      el.list.appendChild(empty);
      return;
    }
    var now = new Date();
    mem.forEach(function (habit) {
      var card = document.createElement('div');
      card.className = 'item';

      var top = document.createElement('div');
      top.className = 'top';

      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = habit.name;

      var streakEl = document.createElement('div');
      streakEl.className = 'streak';
      var s = streak(habit);
      streakEl.innerHTML = '连续 <b>' + s + '</b> 天';

      var check = document.createElement('button');
      check.type = 'button';
      var on = !!habit.log[dayKey(now)];
      check.className = 'check' + (on ? ' on' : '');
      check.setAttribute('aria-pressed', String(on));
      check.setAttribute('aria-label', (on ? '取消' : '完成') + '今天的' + habit.name);
      check.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';
      check.addEventListener('click', function () {
        touched = true;
        var key = dayKey();
        if (habit.log[key]) delete habit.log[key];
        else habit.log[key] = 1;
        save().then(render);
      });

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.title = '删除这个习惯';
      del.setAttribute('aria-label', '删除 ' + habit.name);
      del.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
      del.addEventListener('click', function () {
        touched = true;
        mem = mem.filter(function (h) { return h.id !== habit.id; });
        save().then(render);
      });

      top.appendChild(name);
      top.appendChild(streakEl);
      top.appendChild(check);
      top.appendChild(del);

      var grid = document.createElement('div');
      grid.className = 'grid';
      for (var i = 27; i >= 0; i -= 1) {
        var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
        var cell = document.createElement('span');
        var key = dayKey(d);
        cell.className = 'cell' + (habit.log[key] ? ' on' : '') + (i === 0 ? ' today' : '');
        cell.title = key + (habit.log[key] ? ' 已打卡' : ' 未打卡');
        grid.appendChild(cell);
      }

      var legend = document.createElement('div');
      legend.className = 'legend';
      var l = document.createElement('span');
      l.textContent = '27 天前';
      var r = document.createElement('span');
      r.textContent = '今天';
      legend.appendChild(l);
      legend.appendChild(r);

      card.appendChild(top);
      card.appendChild(grid);
      card.appendChild(legend);
      el.list.appendChild(card);
    });
  }

  el.form.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = el.name.value.trim();
    if (!name) {
      el.msg.textContent = '先写一个习惯名称';
      return;
    }
    if (mem.length >= 20) {
      el.msg.textContent = '最多 20 个习惯，先删掉一些';
      return;
    }
    if (mem.some(function (h) { return h.name === name; })) {
      el.msg.textContent = '这个习惯已经有了';
      return;
    }
    el.msg.textContent = '';
    touched = true;
    mem.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: name, log: {} });
    el.name.value = '';
    save().then(render);
  });

  load().then(function (list) {
    var loaded = list.map(function (h) {
      return { id: String(h.id || ''), name: String(h.name || ''), log: h.log && typeof h.log === 'object' ? h.log : {} };
    }).filter(function (h) { return h.name; });
    if (touched) {
      var seen = {};
      mem.forEach(function (h) { seen[h.id] = true; });
      loaded.forEach(function (h) { if (!seen[h.id]) mem.push(h); });
      save();
    } else {
      mem = loaded;
    }
    render();
    lastDay = dayKey();
    // 跨过午夜后自动刷新「今天」的勾选和格子
    setInterval(function () {
      var k = dayKey();
      if (k !== lastDay) {
        lastDay = k;
        render();
      }
    }, 30000);
  });
})();
</script>

<script>
(function () {
  var api = window.glimnote && window.glimnote.data;
  if (!api) return;
  var timer = null;
  function banner() {
    var box = document.getElementById('__glnError');
    if (!box) {
      box = document.createElement('div');
      box.id = '__glnError';
      box.setAttribute('role', 'alert');
      box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:10px 12px;' +
        'border-radius:10px;background:#8f2f26;color:#fff;font:13px/1.5 system-ui,sans-serif;' +
        'box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;max-width:560px;margin:0 auto;';
      document.body.appendChild(box);
    }
    return box;
  }
  function show(message) {
    var box = banner();
    box.textContent = message || '未保存，请重试';
    box.style.display = 'block';
    clearTimeout(timer);
    timer = setTimeout(function () { box.style.display = 'none'; }, 5000);
  }
  ['set', 'remove', 'clear'].forEach(function (name) {
    var original = api[name];
    if (typeof original !== 'function') return;
    api[name] = function () {
      var promise = original.apply(api, arguments);
      if (promise && typeof promise.then === 'function') {
        promise.then(null, function (error) {
          show('保存失败：' + ((error && error.message) || '请重试'));
        });
      }
      return promise;
    };
  });
})();
</script>
</body>
</html>
