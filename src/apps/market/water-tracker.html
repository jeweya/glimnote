<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>喝水记录</title>
<style>
  :root{--bg:#fffdf8;--surface:#fff;--line:#e6e3dc;--text:#1a1916;--sub:#6b6a65;
    --accent:#3a6ea5;--accent-soft:#e6eef7;--track:#efece4;--warn:#b4483c;
    --shadow:0 1px 2px rgba(26,25,22,.05),0 8px 24px rgba(26,25,22,.05)}
  @media (prefers-color-scheme:dark){:root{--bg:#1b1b19;--surface:#242422;--line:#373632;--text:#eceae4;--sub:#a4a29b;
    --accent:#7fa7cf;--accent-soft:#222c38;--track:#2e2e2a;--warn:#e08a7d;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;padding:18px 14px 22px}
  .wrap{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  h1{margin:0;font-size:17px;font-weight:600}
  .head p{margin:2px 0 0;font-size:12px;color:var(--sub)}
  .head .goals{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:2px}
  .head .goals button{border:0;background:transparent;color:var(--sub);font:inherit;font-size:11px;padding:3px 8px;border-radius:7px;cursor:pointer}
  .head .goals button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;text-align:center}
  .big{font-size:40px;font-weight:600;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
  .big span{font-size:16px;color:var(--sub);font-weight:400}
  .sub{font-size:12px;color:var(--sub);margin-top:2px;min-height:18px}
  .cups{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0 6px}
  .cup{position:relative;width:34px;height:44px;border:1.5px solid var(--line);border-radius:6px 6px 10px 10px;
    background:var(--bg);overflow:hidden;cursor:pointer;padding:0}
  .cup::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:var(--accent);
    opacity:.55;transition:height .2s}
  .cup.full::after{height:100%}
  .cup:hover{border-color:var(--accent)}
  .cup:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .cup.more{width:auto;padding:0 10px;display:grid;place-items:center;font-size:12px;color:var(--sub);
    border-style:dashed}
  .cup.more::after{display:none}
  .cup.more:hover{color:var(--accent)}
  .bar{height:6px;border-radius:6px;background:var(--track);overflow:hidden;margin:10px 2px 0}
  .bar i{display:block;height:100%;width:0;border-radius:6px;background:var(--accent);transition:width .25s}
  .week{margin-top:18px;text-align:left}
  .week-head{font-size:12px;color:var(--sub);margin-bottom:6px}
  .days{display:flex;align-items:flex-end;gap:6px;height:74px}
  .day{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
  .day i{display:block;width:100%;max-width:30px;background:var(--accent);opacity:.6;border-radius:4px 4px 2px 2px;min-height:3px}
  .day.today i{opacity:1}
  .day span{font-size:10px;color:var(--sub)}
  .day.today span{color:var(--text);font-weight:600}
  .foot{font-size:11px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>喝水记录</h1><p>点一下杯子就记一杯</p></div>
    <div class="goals" role="group" aria-label="每天目标">
      <button type="button" data-goal="6" aria-pressed="false">6 杯</button>
      <button type="button" data-goal="8" aria-pressed="true">8 杯</button>
      <button type="button" data-goal="10" aria-pressed="false">10 杯</button>
    </div>
  </div>
  <div class="card">
    <div class="big"><b id="count">0</b><span> / <i id="goalLabel" style="font-style:normal">8</i> 杯</span></div>
    <div class="sub" id="msg">今天还没喝，先来一杯。</div>
    <div class="cups" id="cups" role="group" aria-label="今天的杯数"></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="week">
      <div class="week-head">最近七天</div>
      <div class="days" id="days"></div>
    </div>
  </div>
  <div class="foot">记录保存在应用里 · 达成目标会发一条系统通知</div>
</div>

<script>
(function () {
  var KEY = 'water';
  var mem = {};
  var bridge = window.glimnote && window.glimnote.data;
  function get(k, d) {
    if (!bridge) return Promise.resolve(k in mem ? mem[k] : d);
    return bridge.get(k, d).catch(function () { return k in mem ? mem[k] : d; });
  }
  function set(k, v) {
    mem[k] = v;
    if (!bridge) return Promise.resolve();
    return bridge.set(k, v).catch(function () {});
  }
  function notify(title, body) {
    try {
      if (window.glimnote && window.glimnote.notify) window.glimnote.notify(title, { body: body });
    } catch (e) { /* 通知失败不影响记录 */ }
  }

  var state = { goal: 8, log: {}, notified: '' };
  var touched = false;
  var lastDay = '';
  var cupsEl = document.getElementById('cups');
  var countEl = document.getElementById('count');
  var goalEl = document.getElementById('goalLabel');
  var msgEl = document.getElementById('msg');
  var barEl = document.getElementById('bar');

  function dayKey(d) {
    var t = d || new Date();
    return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
  }
  function cupsToday() { return Number(state.log[dayKey()] || 0); }
  function save() { set(KEY, state); }

  function applyCount(next) {
    next = Math.max(0, Math.min(99, next));
    state.log[dayKey()] = next;
    save();
    if (next >= Math.max(1, Number(state.goal) || 8) && state.notified !== dayKey()) {
      state.notified = dayKey();
      save();
      notify('喝水目标达成', '今天已经喝了 ' + next + ' 杯水，休息一下再继续。');
    }
    paint();
  }

  function paint() {
    var count = cupsToday();
    var goal = Math.max(1, Number(state.goal) || 8);
    countEl.textContent = String(count);
    goalEl.textContent = String(goal);
    barEl.style.width = Math.min(100, Math.round(count / goal * 100)) + '%';
    cupsEl.textContent = '';
    for (var i = 1; i <= goal; i += 1) {
      (function (n) {
        var cup = document.createElement('button');
        cup.type = 'button';
        cup.className = 'cup' + (n <= count ? ' full' : '');
        cup.title = '记录到第 ' + n + ' 杯';
        cup.setAttribute('aria-label', '记录到第 ' + n + ' 杯');
        cup.setAttribute('aria-pressed', n <= count ? 'true' : 'false');
        cup.addEventListener('click', function () {
          applyCount(count === n ? n - 1 : n);
        });
        cupsEl.appendChild(cup);
      })(i);
    }
    // 目标只是目标，不是上限：超过以后还能继续记
    var more = document.createElement('button');
    more.type = 'button';
    more.className = 'cup more';
    more.textContent = '＋1';
    more.title = '再记一杯';
    more.setAttribute('aria-label', '再记一杯');
    more.addEventListener('click', function () { applyCount(cupsToday() + 1); });
    cupsEl.appendChild(more);
    if (count === 0) msgEl.textContent = '今天还没喝，先来一杯。';
    else if (count >= goal) msgEl.textContent = '目标达成，今天做得很不错。';
    else msgEl.textContent = '还差 ' + (goal - count) + ' 杯，慢慢补上。';
    document.title = (count ? count + ' 杯 · ' : '') + '喝水记录';
    paintWeek();
  }

  function paintWeek() {
    var names = ['日', '一', '二', '三', '四', '五', '六'];
    var now = new Date();
    var days = [];
    for (var i = 6; i >= 0; i -= 1) {
      var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
      days.push({ key: dayKey(d), label: names[d.getDay()], count: Number(state.log[dayKey(d)] || 0) });
    }
    var max = Math.max(1, state.goal || 8, Math.max.apply(null, days.map(function (d) { return d.count; })));
    var box = document.getElementById('days');
    box.textContent = '';
    days.forEach(function (d) {
      var day = document.createElement('div');
      day.className = 'day' + (d.key === dayKey() ? ' today' : '');
      var bar = document.createElement('i');
      bar.style.height = (3 + d.count / max * 52) + 'px';
      bar.title = d.count + ' 杯';
      var label = document.createElement('span');
      label.textContent = d.label;
      day.appendChild(bar); day.appendChild(label);
      box.appendChild(day);
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('.goals button'), function (btn) {
    btn.addEventListener('click', function () {
      touched = true;
      state.goal = Number(btn.getAttribute('data-goal')) || 8;
      Array.prototype.forEach.call(document.querySelectorAll('.goals button'), function (b) {
        b.setAttribute('aria-pressed', String(b === btn));
      });
      save();
      paint();
    });
  });

  get(KEY, null).then(function (saved) {
    if (saved && typeof saved === 'object') {
      if (!touched) state.goal = Number(saved.goal) || 8;
      state.log = saved.log && typeof saved.log === 'object' ? saved.log : {};
      state.notified = saved.notified || '';
    }
    Array.prototype.forEach.call(document.querySelectorAll('.goals button'), function (b) {
      b.setAttribute('aria-pressed', String(Number(b.getAttribute('data-goal')) === state.goal));
    });
    paint();
    lastDay = dayKey();
    // 午夜之后自动回到新的一天
    setInterval(function () {
      var k = dayKey();
      if (k !== lastDay) {
        lastDay = k;
        paint();
      }
    }, 30000);
  });
})();
</script>

<script>
(function () {
  var api = window.glimnote && window.glimnote.data;
  if (!api) return;
  var timer = null;
  function banner() {
    var box = document.getElementById('__glnError');
    if (!box) {
      box = document.createElement('div');
      box.id = '__glnError';
      box.setAttribute('role', 'alert');
      box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:10px 12px;' +
        'border-radius:10px;background:#8f2f26;color:#fff;font:13px/1.5 system-ui,sans-serif;' +
        'box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;max-width:560px;margin:0 auto;';
      document.body.appendChild(box);
    }
    return box;
  }
  function show(message) {
    var box = banner();
    box.textContent = message || '未保存，请重试';
    box.style.display = 'block';
    clearTimeout(timer);
    timer = setTimeout(function () { box.style.display = 'none'; }, 5000);
  }
  ['set', 'remove', 'clear'].forEach(function (name) {
    var original = api[name];
    if (typeof original !== 'function') return;
    api[name] = function () {
      var promise = original.apply(api, arguments);
      if (promise && typeof promise.then === 'function') {
        promise.then(null, function (error) {
          show('保存失败：' + ((error && error.message) || '请重试'));
        });
      }
      return promise;
    };
  });
})();
</script>
</body>
</html>
