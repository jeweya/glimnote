<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>番茄专注</title>
<style>
  :root{
    --bg:#fffdf8; --surface:#fff; --line:#e6e3dc; --text:#1a1916; --sub:#6b6a65;
    --accent:#2f6b58; --accent-soft:#e8f1ed; --track:#ede9e0; --warn:#b4483c;
    --shadow:0 1px 2px rgba(26,25,22,.05),0 8px 24px rgba(26,25,22,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#1b1b19;--surface:#242422;--line:#373632;--text:#eceae4;--sub:#a4a29b;
      --accent:#6fae94;--accent-soft:#22302b;--track:#33322e;--warn:#e08a7d;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);}
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;padding:18px 14px 22px;}
  .wrap{width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.01em}
  .head p{margin:2px 0 0;font-size:12px;color:var(--sub)}
  .today{font-size:12px;color:var(--sub);white-space:nowrap}
  .today b{font-size:16px;color:var(--accent);font-variant-numeric:tabular-nums}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);padding:18px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .ring{position:relative;width:196px;height:196px}
  .ring svg{transform:rotate(-90deg);display:block}
  .ring .track{stroke:var(--track)}
  .ring .bar{stroke:var(--accent);transition:stroke-dashoffset .3s linear}
  .ring.break .bar{stroke:#c6892f}
  @media (prefers-color-scheme:dark){.ring.break .bar{stroke:#d9a464}}
  .ring-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .time{font-size:40px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1}
  .phase{font-size:12px;color:var(--sub);letter-spacing:.08em}
  .modes{display:flex;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
  .modes button{border:0;background:transparent;color:var(--sub);font:inherit;font-size:12px;
    padding:5px 12px;border-radius:8px;cursor:pointer}
  .modes button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06);font-weight:600}
  .actions{display:flex;gap:8px;width:100%;max-width:300px}
  .btn{flex:1;font:inherit;font-size:14px;padding:10px 12px;border-radius:10px;cursor:pointer;
    border:1px solid var(--line);background:var(--surface);color:var(--text);transition:background .15s,border-color .15s}
  .btn:hover{background:var(--bg)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:hover{filter:brightness(1.06)}
  .week{width:100%;display:flex;align-items:flex-end;gap:6px;height:58px;margin-top:2px}
  .day{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%}
  .day i{display:block;width:100%;max-width:26px;background:var(--accent);opacity:.72;border-radius:4px 4px 2px 2px;min-height:3px}
  .day span{font-size:10px;color:var(--sub)}
  .day.today i{opacity:1}
  .day.today span{color:var(--text);font-weight:600}
  .foot{font-size:11px;color:var(--sub);text-align:center}
  .msg{font-size:12px;color:var(--accent);min-height:18px}
  kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;font:inherit;font-size:10px;background:var(--surface)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>番茄专注</h1>
      <p id="sub">专注 25 分钟，休息 5 分钟</p>
    </div>
    <div class="today">今天 <b id="todayCount">0</b> 个</div>
  </div>

  <div class="card">
    <div class="modes" role="group" aria-label="专注时长">
      <button type="button" data-min="25" aria-pressed="true">25 分钟</button>
      <button type="button" data-min="50" aria-pressed="false">50 分钟</button>
    </div>

    <div class="ring">
      <svg width="196" height="196" viewBox="0 0 196 196" aria-hidden="true">
        <circle class="track" cx="98" cy="98" r="88" fill="none" stroke-width="10"></circle>
        <circle id="bar" class="bar" cx="98" cy="98" r="88" fill="none" stroke-width="10"
          stroke-linecap="round" stroke-dasharray="552.9" stroke-dashoffset="0"></circle>
      </svg>
      <div class="ring-mid">
        <div class="time" id="time" aria-live="off">25:00</div>
        <div class="phase" id="phase">准备开始</div>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn primary" id="toggle">开始</button>
      <button type="button" class="btn" id="reset">重置</button>
    </div>
    <div class="msg" id="msg" role="status"></div>

    <div class="week" id="week" aria-label="最近七天完成的番茄数"></div>
  </div>

  <div class="foot">按 <kbd>空格</kbd> 开始或暂停 · 按 <kbd>R</kbd> 重置 · 记录保存在仓库里，换设备也在</div>
</div>

<script>
(function () {
  var MIN_KEY = 'min';
  var LOG_KEY = 'log';
  var SESSION_KEY = 'session';
  var BREAK_MIN = 5;
  var mem = {};
  var bridge = window.glimnote && window.glimnote.data;

  function get(key, fallback) {
    if (!bridge) return Promise.resolve(key in mem ? mem[key] : fallback);
    return bridge.get(key, fallback).catch(function () {
      return key in mem ? mem[key] : fallback;
    });
  }
  function set(key, value) {
    mem[key] = value;
    if (!bridge) return Promise.resolve();
    return bridge.set(key, value).catch(function () {});
  }

  var dayKey = function (d) {
    var t = d || new Date();
    return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
  };

  var state = { mode: 'focus', focusTotal: 25 * 60, total: 25 * 60, left: 25 * 60, running: false, endAt: 0, log: {} };
  var timer = null;
  var touched = false;   // 用户在异步加载完成前是否已经操作过
  var CIRC = 2 * Math.PI * 88;

  var el = {
    time: document.getElementById('time'),
    phase: document.getElementById('phase'),
    bar: document.getElementById('bar'),
    toggle: document.getElementById('toggle'),
    reset: document.getElementById('reset'),
    msg: document.getElementById('msg'),
    week: document.getElementById('week'),
    today: document.getElementById('todayCount'),
    ring: document.querySelector('.ring')
  };

  function fmt(sec) {
    var m = Math.floor(sec / 60), s = Math.max(0, sec % 60);
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function phaseLabel() {
    if (state.running) return state.mode === 'break' ? '休息中' : '专注中';
    if (state.left < state.total) return state.mode === 'break' ? '休息暂停' : '已暂停';
    return state.mode === 'break' ? '准备休息' : '准备开始';
  }

  function saveSession() {
    set(SESSION_KEY, {
      mode: state.mode,
      focusMin: Math.round(state.focusTotal / 60),
      left: state.left,
      running: state.running,
      endAt: state.endAt
    });
  }

  function paintModes(min) {
    Array.prototype.forEach.call(document.querySelectorAll('.modes button'), function (b) {
      b.setAttribute('aria-pressed', String(Number(b.getAttribute('data-min')) === Number(min)));
    });
    var sub = document.getElementById('sub');
    if (sub) sub.textContent = '专注 ' + min + ' 分钟，休息 ' + BREAK_MIN + ' 分钟';
  }

  function paint() {
    el.time.textContent = fmt(state.left);
    var ratio = state.total ? state.left / state.total : 0;
    el.bar.setAttribute('stroke-dasharray', CIRC.toFixed(1));
    el.bar.setAttribute('stroke-dashoffset', (CIRC * (1 - ratio)).toFixed(1));
    el.toggle.textContent = state.running ? '暂停' : (state.left === state.total ? '开始' : '继续');
    el.phase.textContent = phaseLabel();
    el.ring.classList.toggle('break', state.mode === 'break');
    document.title = (state.running ? fmt(state.left) + ' · ' : '') + (state.mode === 'break' ? '番茄休息' : '番茄专注');
    paintWeek();
  }

  function paintWeek() {
    var names = ['日', '一', '二', '三', '四', '五', '六'];
    var today = new Date();
    var days = [];
    for (var i = 6; i >= 0; i -= 1) {
      var d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
      days.push({ key: dayKey(d), label: names[d.getDay()], count: Number(state.log[dayKey(d)] || 0) });
    }
    var max = Math.max(1, Math.max.apply(null, days.map(function (d) { return d.count; })));
    el.week.textContent = '';
    days.forEach(function (d) {
      var box = document.createElement('div');
      box.className = 'day' + (d.key === dayKey() ? ' today' : '');
      var bar = document.createElement('i');
      bar.style.height = (4 + (d.count / max) * 40) + 'px';
      bar.title = d.count + ' 个';
      var label = document.createElement('span');
      label.textContent = d.label;
      box.appendChild(bar);
      box.appendChild(label);
      el.week.appendChild(box);
    });
    el.today.textContent = String(state.log[dayKey()] || 0);
  }

  function beep(freqs) {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      var ctx = beep.ctx || (beep.ctx = new Ctx());
      freqs.forEach(function (f, i) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = f;
        var at = ctx.currentTime + i * 0.16;
        gain.gain.setValueAtTime(0.0001, at);
        gain.gain.exponentialRampToValueAtTime(0.16, at + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.14);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(at);
        osc.stop(at + 0.16);
      });
    } catch (e) { /* 没有音频权限也不影响计时 */ }
  }

  function tick() {
    if (!state.running) return;
    var left = Math.round((state.endAt - Date.now()) / 1000);
    state.left = Math.max(0, left);
    if (left <= 0) {
      finish();
      return;
    }
    paint();
  }

  function finish(fromLoad) {
    state.running = false;
    state.left = 0;
    clearInterval(timer);
    timer = null;
    if (state.mode === 'focus') {
      var key = dayKey();
      state.log[key] = Number(state.log[key] || 0) + 1;
      set(LOG_KEY, state.log);
      beep([660, 880, 990]);
      if (!fromLoad && window.glimnote && window.glimnote.notify) {
        window.glimnote.notify('番茄钟结束', { body: '这一轮专注完成了，起来走两步吧。' });
      }
      state.mode = 'break';
      state.total = BREAK_MIN * 60;
      state.left = state.total;
      el.msg.textContent = fromLoad
        ? '离开时这一轮专注已经完成，先休息一下吧。'
        : '这一轮结束了，按空格开始 5 分钟休息。';
    } else {
      beep([880, 660]);
      if (!fromLoad && window.glimnote && window.glimnote.notify) {
        window.glimnote.notify('休息结束', { body: '休息结束，准备下一个番茄吧。' });
      }
      state.mode = 'focus';
      state.total = state.focusTotal;
      state.left = state.total;
      el.msg.textContent = fromLoad ? '休息已经结束，回来继续吧。' : '休息结束，按空格开始下一个番茄。';
    }
    saveSession();
    paint();
  }

  function start() {
    touched = true;
    if (state.left <= 0) state.left = state.total;
    state.running = true;
    state.endAt = Date.now() + state.left * 1000;
    el.msg.textContent = '';
    clearInterval(timer);
    timer = setInterval(tick, 250);
    saveSession();
    paint();
  }

  function pause() {
    touched = true;
    state.running = false;
    state.left = Math.max(0, Math.round((state.endAt - Date.now()) / 1000));
    clearInterval(timer);
    timer = null;
    saveSession();
    paint();
  }

  function reset() {
    touched = true;
    state.running = false;
    state.mode = 'focus';
    state.total = state.focusTotal;
    state.left = state.total;
    clearInterval(timer);
    timer = null;
    el.msg.textContent = '';
    saveSession();
    paint();
  }

  function chooseFocus(min) {
    touched = true;
    state.focusTotal = Math.max(1, Math.min(180, Number(min) || 25)) * 60;
    set(MIN_KEY, Math.round(state.focusTotal / 60));
    paintModes(Math.round(state.focusTotal / 60));
    reset();
  }

  el.toggle.addEventListener('click', function () {
    if (state.running) pause(); else start();
  });
  el.reset.addEventListener('click', reset);

  Array.prototype.forEach.call(document.querySelectorAll('.modes button'), function (btn) {
    btn.addEventListener('click', function () {
      chooseFocus(Number(btn.getAttribute('data-min')));
    });
  });

  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault();
      if (state.running) pause(); else start();
    } else if (e.key === 'r' || e.key === 'R') {
      reset();
    }
  });

  function restoreSession(saved) {
    if (!saved || typeof saved !== 'object') return false;
    if (saved.mode !== 'focus' && saved.mode !== 'break') return false;
    var min = Number(saved.focusMin);
    state.focusTotal = (isFinite(min) && min >= 1 && min <= 180 ? Math.round(min) : 25) * 60;
    state.mode = saved.mode;
    state.total = state.mode === 'break' ? BREAK_MIN * 60 : state.focusTotal;
    var left = Number(saved.left);
    state.left = isFinite(left) && left > 0 && left <= state.total ? Math.round(left) : state.total;
    if (saved.running) {
      state.endAt = Number(saved.endAt) || 0;
      var remain = Math.round((state.endAt - Date.now()) / 1000);
      if (remain > 0) {
        state.left = Math.min(state.total, remain);
        state.running = true;
        timer = setInterval(tick, 250);
      } else {
        // 关窗口期间已经到点：补完成这一阶段
        finish(true);
      }
    }
    return true;
  }

  Promise.all([get(MIN_KEY, 25), get(SESSION_KEY, null), get(LOG_KEY, {})]).then(function (res) {
    state.log = res[2] && typeof res[2] === 'object' ? res[2] : {};
    var min = Number(res[0]);
    if (!touched) {
      var savedMin = isFinite(min) && min >= 1 && min <= 180 ? Math.round(min) : 25;
      state.focusTotal = savedMin * 60;
      var restored = restoreSession(res[1]);
      if (!restored) {
        state.mode = 'focus';
        state.total = state.focusTotal;
        state.left = state.focusTotal;
        state.running = false;
      }
      paintModes(Math.round(state.focusTotal / 60));
      paint();
    } else {
      paintWeek();
    }
  });
})();
</script>

<script>
(function () {
  var api = window.glimnote && window.glimnote.data;
  if (!api) return;
  var timer = null;
  function banner() {
    var box = document.getElementById('__glnError');
    if (!box) {
      box = document.createElement('div');
      box.id = '__glnError';
      box.setAttribute('role', 'alert');
      box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:10px 12px;' +
        'border-radius:10px;background:#8f2f26;color:#fff;font:13px/1.5 system-ui,sans-serif;' +
        'box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;max-width:560px;margin:0 auto;';
      document.body.appendChild(box);
    }
    return box;
  }
  function show(message) {
    var box = banner();
    box.textContent = message || '未保存，请重试';
    box.style.display = 'block';
    clearTimeout(timer);
    timer = setTimeout(function () { box.style.display = 'none'; }, 5000);
  }
  ['set', 'remove', 'clear'].forEach(function (name) {
    var original = api[name];
    if (typeof original !== 'function') return;
    api[name] = function () {
      var promise = original.apply(api, arguments);
      if (promise && typeof promise.then === 'function') {
        promise.then(null, function (error) {
          show('保存失败：' + ((error && error.message) || '请重试'));
        });
      }
      return promise;
    };
  });
})();
</script>
</body>
</html>
