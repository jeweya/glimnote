<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>随机决定</title>
<style>
  :root{
    --bg:#fffdf8; --surface:#fff; --line:#e6e3dc; --text:#1a1916; --sub:#6b6a65;
    --accent:#2f6b58; --accent-soft:#e8f1ed; --warn:#b4483c; --amber:#b07f2a; --dim:#ede9e0;
    --shadow:0 1px 2px rgba(26,25,22,.05),0 8px 24px rgba(26,25,22,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#1b1b19;--surface:#242422;--line:#373632;--text:#eceae4;--sub:#a4a29b;
      --accent:#6fae94;--accent-soft:#22302b;--warn:#e08a7d;--amber:#d6a75a;--dim:#33322e;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;padding:18px 14px 26px}
  .wrap{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px}
  h1{margin:0;font-size:17px;font-weight:600}
  .sub{margin:2px 0 0;font-size:12px;color:var(--sub)}
  .stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;
    box-shadow:var(--shadow);padding:26px 18px;text-align:center;display:flex;
    flex-direction:column;gap:14px;align-items:stretch}
  .result{font-size:26px;font-weight:600;line-height:1.35;min-height:38px;
    word-break:break-word;color:var(--accent);transition:opacity .12s}
  .result.rolling{color:var(--sub);opacity:.7}
  .result.none{font-size:14px;color:var(--sub);font-weight:400}
  .go{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--accent);
    background:var(--accent);color:#fff;border-radius:12px;padding:12px;cursor:pointer}
  .go:hover{filter:brightness(1.06)}
  .go:disabled{opacity:.5;cursor:not-allowed;filter:none}
  .opsrow{display:flex;justify-content:center;gap:10px;font-size:11px;color:var(--sub);flex-wrap:wrap}
  .opsrow label{display:flex;align-items:center;gap:5px;cursor:pointer}
  .opsrow input{accent-color:var(--accent);margin:0}
  .opsrow button{border:0;background:transparent;color:var(--accent);cursor:pointer;
    font:inherit;font-size:11px;text-decoration:underline;padding:0}
  .add{display:flex;gap:6px}
  .add input{flex:1;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);
    border-radius:10px;padding:9px 11px;min-width:0}
  .add input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .add button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--text);
    border-radius:10px;padding:9px 14px;cursor:pointer;white-space:nowrap}
  .add button:hover{border-color:var(--accent);color:var(--accent)}
  .pool{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface);
    border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;cursor:default}
  .chip.used{opacity:.42;text-decoration:line-through}
  .chip button{border:0;background:transparent;color:var(--sub);cursor:pointer;
    font:inherit;line-height:1;padding:0 0 0 2px;font-size:13px}
  .chip button:hover{color:var(--warn)}
  .empty{border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--sub);font-size:12px}
  .msg{font-size:12px;color:var(--warn);min-height:16px}
  .foot{font-size:11px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>随机决定</h1>
    <p class="sub">午饭吃什么、谁来干活、先做哪件——交给它，省掉纠结</p>
  </div>

  <div class="stage">
    <div class="result none" id="result">先加几个选项</div>
    <button type="button" class="go" id="go">转一下</button>
    <div class="opsrow">
      <label><input type="checkbox" id="norepeat"> 不重复抽</label>
      <button type="button" id="reset" hidden>重新开始</button>
    </div>
  </div>

  <form class="add" id="form">
    <input id="text" maxlength="20" placeholder="加一个选项，例如 兰州拉面" aria-label="选项内容">
    <button type="submit">添加</button>
  </form>
  <div class="msg" id="msg" role="status"></div>

  <div class="pool" id="pool"></div>
  <div class="foot">最多 60 个选项 · 选项保存在仓库里</div>
</div>

<script>
(function () {
  var KEY = 'options';
  var mem = [];
  var used = {};
  var rolling = false;
  var touched = false;
  var timer = null;
  var bridge = window.glimnote && window.glimnote.data;

  function load() {
    if (!bridge) return Promise.resolve(mem);
    return bridge.get(KEY, []).then(function (v) { return Array.isArray(v) ? v : []; })
      .catch(function () { return mem; });
  }
  function save() {
    if (!bridge) return Promise.resolve();
    return bridge.set(KEY, mem).catch(function () {});
  }

  var el = {
    result: document.getElementById('result'), go: document.getElementById('go'),
    pool: document.getElementById('pool'), form: document.getElementById('form'),
    text: document.getElementById('text'), msg: document.getElementById('msg'),
    norepeat: document.getElementById('norepeat'), reset: document.getElementById('reset')
  };

  function available() {
    return mem.filter(function (o) { return !el.norepeat.checked || !used[o.id]; });
  }

  function renderPool() {
    el.pool.textContent = '';
    if (!mem.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '还没有选项。想不出来的时候，先写三个烂主意也行。';
      el.pool.appendChild(empty);
      el.go.disabled = true;
      el.reset.hidden = true;
      return;
    }
    el.go.disabled = rolling;
    mem.forEach(function (o) {
      var chip = document.createElement('span');
      chip.className = 'chip' + (used[o.id] ? ' used' : '');
      var label = document.createElement('span');
      label.textContent = o.text;
      var del = document.createElement('button');
      del.type = 'button';
      del.title = '删除';
      del.setAttribute('aria-label', '删除 ' + o.text);
      del.innerHTML = '×';
      del.disabled = rolling;
      del.addEventListener('click', function () {
        if (rolling) return;
        touched = true;
        mem = mem.filter(function (x) { return x.id !== o.id; });
        delete used[o.id];
        save().then(renderPool);
      });
      chip.appendChild(label);
      chip.appendChild(del);
      el.pool.appendChild(chip);
    });
    var left = available().length;
    el.reset.hidden = !el.norepeat.checked || left === mem.length;
    if (el.norepeat.checked && !left && mem.length) {
      // 提示放在 msg 里，别把刚抽出的最终结果覆盖掉
      el.msg.textContent = '都抽完了，点「重新开始」';
      el.go.disabled = true;
    } else if (el.msg.textContent.indexOf('都抽完了') === 0) {
      el.msg.textContent = '';
    }
  }

  function spin() {
    if (rolling) return;
    var pool = available();
    if (!pool.length) {
      if (mem.length && el.norepeat.checked) el.msg.textContent = '都抽完了，点「重新开始」';
      return;
    }
    rolling = true;
    el.go.disabled = true;
    el.go.textContent = '…';
    el.result.className = 'result rolling';
    var start = Date.now();
    var total = 1100;
    timer = setInterval(function () {
      var t = Math.min(1, (Date.now() - start) / total);
      if (t < 1) {
        var r = pool[Math.floor(Math.random() * pool.length)];
        el.result.textContent = r.text;
        return;
      }
      clearInterval(timer);
      timer = null;
      var pick = pool[Math.floor(Math.random() * pool.length)];
      el.result.textContent = pick.text;
      el.result.className = 'result';
      if (el.norepeat.checked) used[pick.id] = true;
      rolling = false;
      el.go.textContent = '再转一下';
      renderPool();
    }, 55);
  }

  el.go.addEventListener('click', spin);
  el.norepeat.addEventListener('change', function () {
    if (!el.norepeat.checked) {
      used = {};
      el.result.className = 'result none';
      el.result.textContent = '不重复已关闭';
    }
    renderPool();
  });
  el.reset.addEventListener('click', function () {
    used = {};
    el.result.className = 'result none';
    el.result.textContent = '重新开始，全部选项回到池子里';
    renderPool();
  });

  el.form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = el.text.value.trim();
    if (!text) {
      el.msg.textContent = '先写点内容';
      el.text.focus();
      return;
    }
    if (mem.length >= 60) {
      el.msg.textContent = '选项太多了，先删掉一些';
      return;
    }
    if (mem.some(function (o) { return o.text === text; })) {
      el.msg.textContent = '这个选项已经有了';
      return;
    }
    el.msg.textContent = '';
    touched = true;
    mem.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text: text });
    el.text.value = '';
    el.text.focus();
    save().then(function () {
      if (el.result.classList.contains('none')) {
        el.result.textContent = '池子里有 ' + mem.length + ' 个选项了';
      }
      renderPool();
    });
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === ' ' && document.activeElement === document.body) {
      e.preventDefault();
      spin();
    }
  });

  load().then(function (list) {
    var loaded = list.map(function (o) {
      return { id: String(o.id || ''), text: String(o.text || '') };
    }).filter(function (o) { return o.text; });
    if (touched) {
      var seen = {};
      mem.forEach(function (o) { seen[o.id] = true; });
      loaded.forEach(function (o) { if (!seen[o.id]) mem.push(o); });
      save();
    } else {
      mem = loaded;
    }
    renderPool();
  });
})();
</script>

<script>
(function () {
  var api = window.glimnote && window.glimnote.data;
  if (!api) return;
  var timer = null;
  function banner() {
    var box = document.getElementById('__glnError');
    if (!box) {
      box = document.createElement('div');
      box.id = '__glnError';
      box.setAttribute('role', 'alert');
      box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:10px 12px;' +
        'border-radius:10px;background:#8f2f26;color:#fff;font:13px/1.5 system-ui,sans-serif;' +
        'box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;max-width:560px;margin:0 auto;';
      document.body.appendChild(box);
    }
    return box;
  }
  function show(message) {
    var box = banner();
    box.textContent = message || '未保存，请重试';
    box.style.display = 'block';
    clearTimeout(timer);
    timer = setTimeout(function () { box.style.display = 'none'; }, 5000);
  }
  ['set', 'remove', 'clear'].forEach(function (name) {
    var original = api[name];
    if (typeof original !== 'function') return;
    api[name] = function () {
      var promise = original.apply(api, arguments);
      if (promise && typeof promise.then === 'function') {
        promise.then(null, function (error) {
          show('保存失败：' + ((error && error.message) || '请重试'));
        });
      }
      return promise;
    };
  });
})();
</script>
</body>
</html>
