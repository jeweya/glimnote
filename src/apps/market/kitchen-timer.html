<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>厨房计时</title>
<style>
  :root{--bg:#fffdf8;--surface:#fff;--line:#e6e3dc;--text:#1a1916;--sub:#6b6a65;
    --accent:#b4782f;--accent-soft:#f7efe1;--track:#efece4;--warn:#b4483c;
    --shadow:0 1px 2px rgba(26,25,22,.05),0 8px 24px rgba(26,25,22,.05)}
  @media (prefers-color-scheme:dark){:root{--bg:#1b1b19;--surface:#242422;--line:#373632;--text:#eceae4;--sub:#a4a29b;
    --accent:#d6a55e;--accent-soft:#332a1f;--track:#2e2e2a;--warn:#e08a7d;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;padding:18px 14px 22px}
  .wrap{width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  h1{margin:0;font-size:17px;font-weight:600}
  .head p{margin:2px 0 0;font-size:12px;color:var(--sub)}
  .head .state{font-size:12px;color:var(--sub);white-space:nowrap}
  .head .state b{color:var(--accent)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 16px;
    display:flex;flex-direction:column;align-items:center;gap:14px}
  .time{font-size:56px;font-weight:600;letter-spacing:.03em;line-height:1;font-variant-numeric:tabular-nums}
  .time.done{color:var(--warn)}
  .label{font-size:12px;color:var(--sub);min-height:18px;text-align:center}
  .presets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .presets button{border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:12px;
    padding:5px 11px;border-radius:8px;cursor:pointer}
  .presets button:hover{border-color:var(--accent);color:var(--accent)}
  .row{display:flex;gap:8px;width:100%;max-width:320px}
  input{flex:1;min-width:0;font:inherit;font-size:13px;color:var(--text);background:var(--bg);border:1px solid var(--line);
    border-radius:9px;padding:8px 10px;outline:none;text-align:center}
  input:focus{border-color:var(--accent)}
  .btn{font:inherit;font-size:13px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);cursor:pointer;white-space:nowrap;flex:1}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.warn{background:var(--warn);border-color:var(--warn);color:#fff;font-weight:600}
  .msg{font-size:12px;color:var(--accent);min-height:18px;text-align:center}
  .foot{font-size:11px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>厨房计时</h1><p>煮蛋、炖汤、烤面包，到点会响并提醒</p></div>
    <div class="state" id="state"></div>
  </div>
  <div class="card">
    <div class="time" id="time">05:00</div>
    <div class="label" id="label">选一个常用时长，或自己填</div>
    <div class="presets" id="presets" role="group" aria-label="常用时长"></div>
    <div class="row">
      <input type="number" id="minutes" min="1" max="240" step="1" placeholder="分钟" aria-label="自定义分钟数">
      <button class="btn primary" id="start" type="button">开始</button>
    </div>
    <div class="row">
      <button class="btn" id="pause" type="button" disabled>暂停</button>
      <button class="btn" id="reset" type="button">重置</button>
    </div>
    <div class="msg" id="msg" role="status"></div>
  </div>
  <div class="foot">计时状态会保留，窗口关掉再打开仍然继续 · 到点发系统通知</div>
</div>

<script>
(function () {
  var KEY = 'timer';
  var PRESETS = [1, 3, 5, 10, 15, 30];
  var mem = {};
  var bridge = window.glimnote && window.glimnote.data;
  function get(k, d) {
    if (!bridge) return Promise.resolve(k in mem ? mem[k] : d);
    return bridge.get(k, d).catch(function () { return k in mem ? mem[k] : d; });
  }
  function set(k, v) {
    mem[k] = v;
    if (!bridge) return Promise.resolve();
    return bridge.set(k, v).catch(function () {});
  }
  function notify(title, body) {
    try {
      if (window.glimnote && window.glimnote.notify) window.glimnote.notify(title, { body: body });
    } catch (e) { /* 通知失败时仍然有声音 */ }
  }

  var state = { total: 300, left: 300, endAt: 0, running: false, done: false };
  var timer = null;
  var touched = false;   // 用户是否在异步加载完成前就已经操作过
  var timeEl = document.getElementById('time');
  var labelEl = document.getElementById('label');
  var stateEl = document.getElementById('state');
  var startEl = document.getElementById('start');
  var pauseEl = document.getElementById('pause');
  var resetEl = document.getElementById('reset');
  var minutesEl = document.getElementById('minutes');
  var msgEl = document.getElementById('msg');

  function fmt(sec) {
    var s = Math.max(0, Math.round(sec));
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }
  function save() {
    set(KEY, { total: state.total, left: state.left, endAt: state.endAt, running: state.running, done: state.done });
  }

  function paint() {
    timeEl.textContent = fmt(state.left);
    timeEl.classList.toggle('done', state.done);
    if (state.running) {
      stateEl.textContent = '运行中';
      labelEl.textContent = '还剩 ' + fmt(state.left);
      startEl.textContent = '重新开始';
      pauseEl.disabled = false;
      pauseEl.textContent = '暂停';
    } else if (state.done) {
      stateEl.textContent = '已结束';
      labelEl.textContent = '时间到了，去看看锅';
      startEl.textContent = '再来一次';
      pauseEl.disabled = true;
    } else if (state.left < state.total && state.left > 0) {
      stateEl.textContent = '已暂停';
      labelEl.textContent = '暂停在 ' + fmt(state.left);
      startEl.textContent = '继续';
      pauseEl.disabled = true;
    } else {
      stateEl.textContent = '';
      labelEl.textContent = '选一个常用时长，或自己填';
      startEl.textContent = '开始';
      pauseEl.disabled = true;
    }
    document.title = (state.running ? fmt(state.left) + ' · ' : '') + '厨房计时';
  }

  function beep() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      var ctx = beep.ctx || (beep.ctx = new Ctx());
      [880, 1040, 880, 1040].forEach(function (freq, i) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        var at = ctx.currentTime + i * 0.28;
        gain.gain.setValueAtTime(0.0001, at);
        gain.gain.exponentialRampToValueAtTime(0.2, at + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.26);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(at);
        osc.stop(at + 0.3);
      });
    } catch (e) { /* 没有音频权限时只依赖通知 */ }
  }

  function finish(fromLoad) {
    state.running = false;
    state.done = true;
    state.left = 0;
    clearInterval(timer);
    timer = null;
    save();
    paint();
    beep();
    var mins = Math.round(state.total / 60);
    notify('计时结束', mins + ' 分钟到了，去看看锅里。');
    if (fromLoad) msgEl.textContent = '离开时计时已经结束，已补发一次提醒';
  }

  function tick() {
    if (!state.running) return;
    var left = Math.round((state.endAt - Date.now()) / 1000);
    state.left = Math.max(0, left);
    if (left <= 0) { finish(false); return; }
    paint();
  }

  function setMinutes(min) {
    touched = true;
    state.total = Math.max(1, Math.min(240, Math.round(Number(min) || 5))) * 60;
    state.left = state.total;
    state.running = false;
    state.done = false;
    state.endAt = 0;
    clearInterval(timer);
    timer = null;
    save();
    paint();
  }

  function start() {
    touched = true;
    if (state.done || state.left <= 0) {
      state.left = state.total;
      state.done = false;
    }
    state.running = true;
    state.endAt = Date.now() + state.left * 1000;
    save();
    clearInterval(timer);
    timer = setInterval(tick, 250);
    msgEl.textContent = '';
    paint();
  }

  function pause() {
    touched = true;
    if (!state.running) return;
    state.left = Math.max(0, Math.round((state.endAt - Date.now()) / 1000));
    state.running = false;
    clearInterval(timer);
    timer = null;
    save();
    paint();
  }

  function reset() {
    touched = true;
    state.running = false;
    state.done = false;
    state.left = state.total;
    state.endAt = 0;
    clearInterval(timer);
    timer = null;
    save();
    paint();
  }

  PRESETS.forEach(function (min) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = min + ' 分钟';
    btn.addEventListener('click', function () {
      minutesEl.value = String(min);
      setMinutes(min);
    });
    document.getElementById('presets').appendChild(btn);
  });

  startEl.addEventListener('click', function () {
    var typed = Number(minutesEl.value);
    if (typed > 0) {
      if (!state.running && !state.done && state.left === state.total && typed * 60 !== state.total) setMinutes(typed);
      else if (state.done && typed * 60 !== state.total) setMinutes(typed);
    }
    start();
  });
  pauseEl.addEventListener('click', pause);
  resetEl.addEventListener('click', reset);
  minutesEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      setMinutes(Number(minutesEl.value));
      start();
    }
  });

  get(KEY, null).then(function (saved) {
    // 加载是异步的：用户如果已经点了开始/暂停，就不再拿仓库里的旧状态覆盖
    if (!touched && saved && typeof saved === 'object') {
      state.total = Math.max(60, Math.min(14400, Number(saved.total) || 300));
      state.endAt = Number(saved.endAt) || 0;
      state.running = Boolean(saved.running);
      state.done = Boolean(saved.done);
      if (state.running) {
        var left = Math.round((state.endAt - Date.now()) / 1000);
        state.left = Math.max(0, left);
        if (left <= 0) {
          finish(true);
        } else {
          timer = setInterval(tick, 250);
        }
      } else if (state.done) {
        state.left = 0;
      } else {
        // 恢复暂停时剩余的时长，而不是回到整段时长
        var savedLeft = Number(saved.left);
        state.left = isFinite(savedLeft) && savedLeft > 0 && savedLeft <= state.total ? Math.round(savedLeft) : state.total;
      }
    }
    if (!touched) minutesEl.value = String(Math.round(state.total / 60));
    paint();
  });
})();
</script>

<script>
(function () {
  var api = window.glimnote && window.glimnote.data;
  if (!api) return;
  var timer = null;
  function banner() {
    var box = document.getElementById('__glnError');
    if (!box) {
      box = document.createElement('div');
      box.id = '__glnError';
      box.setAttribute('role', 'alert');
      box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:10px 12px;' +
        'border-radius:10px;background:#8f2f26;color:#fff;font:13px/1.5 system-ui,sans-serif;' +
        'box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;max-width:560px;margin:0 auto;';
      document.body.appendChild(box);
    }
    return box;
  }
  function show(message) {
    var box = banner();
    box.textContent = message || '未保存，请重试';
    box.style.display = 'block';
    clearTimeout(timer);
    timer = setTimeout(function () { box.style.display = 'none'; }, 5000);
  }
  ['set', 'remove', 'clear'].forEach(function (name) {
    var original = api[name];
    if (typeof original !== 'function') return;
    api[name] = function () {
      var promise = original.apply(api, arguments);
      if (promise && typeof promise.then === 'function') {
        promise.then(null, function (error) {
          show('保存失败：' + ((error && error.message) || '请重试'));
        });
      }
      return promise;
    };
  });
})();
</script>
</body>
</html>
