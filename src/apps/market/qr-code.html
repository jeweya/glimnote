<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二维码</title>
<style>
  :root{--bg:#fffdf8;--surface:#fff;--line:#e6e3dc;--text:#1a1916;--sub:#6b6a65;
    --accent:#1f1f1f;--accent-soft:#f0ede6;--track:#efece4;--warn:#b4483c;
    --shadow:0 1px 2px rgba(26,25,22,.05),0 8px 24px rgba(26,25,22,.05)}
  @media (prefers-color-scheme:dark){:root{--bg:#1b1b19;--surface:#242422;--line:#373632;--text:#eceae4;--sub:#a4a29b;
    --accent:#eceae4;--accent-soft:#33332f;--track:#2e2e2a;--warn:#e08a7d;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;padding:18px 14px 22px}
  .wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  h1{margin:0;font-size:17px;font-weight:600}
  .head p{margin:2px 0 0;font-size:12px;color:var(--sub)}
  .head .size{font-size:12px;color:var(--sub);white-space:nowrap;text-align:right}
  .head .size b{color:var(--text);font-variant-numeric:tabular-nums}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px}
  textarea{width:100%;min-height:76px;resize:vertical;font:inherit;font-size:13px;line-height:1.55;color:var(--text);
    background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none}
  textarea:focus{border-color:var(--accent)}
  .opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:9px}
  label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
  select{font:inherit;font-size:12px;color:var(--text);background:var(--bg);border:1px solid var(--line);
    border-radius:8px;padding:5px 7px;outline:none}
  select:focus{border-color:var(--accent)}
  .grow{flex:1}
  .btn{font:inherit;font-size:13px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);cursor:pointer;white-space:nowrap}
  .btn.primary{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:600}
  .btn:disabled{opacity:.45;cursor:default}
  .msg{font-size:12px;color:var(--sub);min-height:18px;margin:6px 0 0}
  .msg.warn{color:var(--warn)}
  .stage{margin:12px auto 0;width:100%;max-width:300px;aspect-ratio:1;border:1px solid var(--line);border-radius:14px;
    background:#fff;display:grid;place-items:center;overflow:hidden;padding:10px}
  .stage img{width:100%;height:100%;object-fit:contain;display:none}
  .stage .ph{font-size:12px;color:#6b6a65;text-align:center;line-height:1.6;padding:0 12px}
  .actions{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
  .history{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
  .history h2{font-size:12px;color:var(--sub);font-weight:500;margin:0 0 6px}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{max-width:100%;border:1px solid var(--line);background:var(--bg);color:var(--sub);font:inherit;font-size:11px;
    padding:3px 9px;border-radius:999px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip:hover{color:var(--text);border-color:var(--accent)}
  .foot{font-size:11px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>二维码</h1><p>网址、文本、WiFi，贴到哪儿都能扫</p></div>
    <div class="size">模块 <b id="version">—</b></div>
  </div>
  <div class="card">
    <textarea id="text" maxlength="1200" placeholder="输入网址或任意文字，例如 https://example.com" aria-label="二维码内容"></textarea>
    <div class="opts">
      <label>纠错
        <select id="level" aria-label="纠错级别">
          <option value="L">L（7%）</option>
          <option value="M" selected>M（15%）</option>
          <option value="Q">Q（25%）</option>
          <option value="H">H（30%）</option>
        </select>
      </label>
      <label>尺寸
        <select id="scale" aria-label="尺寸">
          <option value="4">小</option>
          <option value="6" selected>中</option>
          <option value="8">大</option>
        </select>
      </label>
      <span class="grow"></span>
      <button class="btn primary" id="make" type="button">生成</button>
    </div>

    <div class="stage"><img id="img" alt="生成的二维码"><div class="ph" id="ph">输入内容后点「生成」<br>需要一次联网加载二维码算法</div></div>
    <div class="msg" id="msg" role="status"></div>

    <div class="actions">
      <button class="btn" id="copyText" type="button" disabled>复制内容</button>
      <button class="btn" id="copyImg" type="button" disabled>复制图片</button>
      <button class="btn" id="clear" type="button">清空</button>
    </div>

    <div class="history">
      <h2>最近生成</h2>
      <div class="chips" id="history"><span class="chip" style="cursor:default">还没有记录</span></div>
    </div>
  </div>
  <div class="foot">内容只在本机处理，不会上传 · 历史记录保存在应用里</div>
</div>

<script>
(function () {
  var KEY = 'qrcode';
  var CDN = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';

  var mem = {};
  var bridge = window.glimnote && window.glimnote.data;
  function get(k, d) {
    if (!bridge) return Promise.resolve(k in mem ? mem[k] : d);
    return bridge.get(k, d).catch(function () { return k in mem ? mem[k] : d; });
  }
  function set(k, v) {
    mem[k] = v;
    if (!bridge) return Promise.resolve();
    return bridge.set(k, v).catch(function () {});
  }

  var textEl = document.getElementById('text');
  var levelEl = document.getElementById('level');
  var scaleEl = document.getElementById('scale');
  var imgEl = document.getElementById('img');
  var phEl = document.getElementById('ph');
  var msgEl = document.getElementById('msg');
  var history = [];        // [{text, at}]
  var current = null;      // 当前二维码内容与参数
  var libState = 'idle';   // idle | loading | ready | failed

  function save() { set(KEY, { history: history.slice(-8) }); }

  function loadingLib() {
    if (libState === 'ready') return Promise.resolve(window.qrcode);
    if (libState === 'failed') return Promise.reject(new Error('failed'));
    if (libState === 'loading') {
      return new Promise(function (resolve, reject) {
        var tries = 0;
        var timer = setInterval(function () {
          tries += 1;
          if (window.qrcode) { clearInterval(timer); libState = 'ready'; resolve(window.qrcode); }
          else if (libState === 'failed' || tries > 60) { clearInterval(timer); reject(new Error('failed')); }
        }, 100);
      });
    }
    libState = 'loading';
    msgEl.classList.remove('warn');
    msgEl.textContent = '正在加载二维码算法…';
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = CDN;
      s.async = true;
      s.onload = function () {
        if (window.qrcode) {
          libState = 'ready';
          if (window.qrcode.stringToBytesFuncs && window.qrcode.stringToBytesFuncs['UTF-8']) {
            window.qrcode.stringToBytes = window.qrcode.stringToBytesFuncs['UTF-8'];
          }
          resolve(window.qrcode);
        } else {
          libState = 'idle';
          reject(new Error('failed'));
        }
      };
      s.onerror = function () {
        libState = 'idle';
        if (s.parentNode) s.parentNode.removeChild(s);
        reject(new Error('failed'));
      };
      document.head.appendChild(s);
    });
  }

  function paintVersion() {
    var n = current && current.modules ? current.modules : 0;
    document.getElementById('version').textContent = n ? n + ' × ' + n : '—';
  }

  function renderQr(text, level, scale) {
    return loadingLib().then(function (qrLib) {
      var qr = qrLib(0, level);
      try {
        qr.addData(text, 'Byte');
        qr.make();
      } catch (e) {
        var tooLong = new Error('内容太长');
        tooLong.code = 'too-long';
        throw tooLong;
      }
      var url = qr.createDataURL(scale, 4 * scale);
      imgEl.src = url;
      imgEl.style.display = 'block';
      phEl.style.display = 'none';
      current = { text: text, level: level, scale: scale, modules: qr.getModuleCount() };
      paintVersion();
      document.getElementById('copyText').disabled = false;
      document.getElementById('copyImg').disabled = false;
      msgEl.classList.remove('warn');
      msgEl.textContent = '已生成，长按或右键图片可保存';
      return current;
    });
  }

  function make() {
    var text = textEl.value;
    if (!text.trim()) {
      msgEl.classList.add('warn');
      msgEl.textContent = '先写点内容再生成';
      textEl.focus();
      return;
    }
    var level = levelEl.value;
    var scale = Number(scaleEl.value) || 6;
    renderQr(text, level, scale).then(function (info) {
      var exists = history.some(function (h) { return h.text === text; });
      if (!exists) {
        history.push({ text: text, at: new Date().toISOString() });
        history = history.slice(-8);
        save();
        paintHistory();
      }
      document.title = text.slice(0, 20) + ' · 二维码';
      void info;
    }).catch(function (e) {
      msgEl.classList.add('warn');
      msgEl.textContent = e && e.code === 'too-long'
        ? '内容太长，二维码装不下，删掉一些再试'
        : '算法库没加载成功，检查网络后再点一次「生成」';
    });
  }

  function paintHistory() {
    var box = document.getElementById('history');
    box.textContent = '';
    if (!history.length) {
      var empty = document.createElement('span');
      empty.className = 'chip';
      empty.style.cursor = 'default';
      empty.textContent = '还没有记录';
      box.appendChild(empty);
      return;
    }
    history.slice().reverse().forEach(function (h) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.textContent = h.text.length > 26 ? h.text.slice(0, 26) + '…' : h.text;
      chip.title = h.text;
      chip.addEventListener('click', function () {
        textEl.value = h.text;
        make();
      });
      box.appendChild(chip);
    });
  }

  function copyText() {
    if (!current) return;
    var text = current.text;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        msgEl.classList.remove('warn');
        msgEl.textContent = '内容已复制';
      }).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }
    function fallbackCopy() {
      var area = document.createElement('textarea');
      area.value = text;
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(area);
      msgEl.classList.remove('warn');
      msgEl.textContent = ok ? '内容已复制' : '复制失败，请手动选择文字';
    }
  }

  function copyImage() {
    if (!imgEl.src) return;
    var img = new Image();
    img.onload = function () {
      var canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
      canvas.toBlob(function (blob) {
        if (!blob || !navigator.clipboard || !window.ClipboardItem) {
          msgEl.classList.add('warn');
          msgEl.textContent = '这个环境不支持复制图片，请右键图片保存';
          return;
        }
        var item = new ClipboardItem({ 'image/png': blob });
        navigator.clipboard.write([item]).then(function () {
          msgEl.classList.remove('warn');
          msgEl.textContent = '图片已复制，可以直接粘贴发送';
        }).catch(function () {
          msgEl.classList.add('warn');
          msgEl.textContent = '复制图片被拦截了，请右键图片保存';
        });
      }, 'image/png');
    };
    img.onerror = function () {
      msgEl.classList.add('warn');
      msgEl.textContent = '图片还没生成好';
    };
    img.src = imgEl.src;
  }

  document.getElementById('make').addEventListener('click', make);
  document.getElementById('copyText').addEventListener('click', copyText);
  document.getElementById('copyImg').addEventListener('click', copyImage);
  document.getElementById('clear').addEventListener('click', function () {
    textEl.value = '';
    current = null;
    imgEl.removeAttribute('src');
    imgEl.style.display = 'none';
    phEl.style.display = 'block';
    document.getElementById('copyText').disabled = true;
    document.getElementById('copyImg').disabled = true;
    paintVersion();
    msgEl.classList.remove('warn');
    msgEl.textContent = '';
    document.title = '二维码';
    textEl.focus();
  });
  textEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      make();
    }
  });
  levelEl.addEventListener('change', function () { if (current) make(); });
  scaleEl.addEventListener('change', function () { if (current) make(); });

  get(KEY, null).then(function (saved) {
    if (saved && Array.isArray(saved.history)) {
      history = saved.history.filter(function (h) { return h && typeof h.text === 'string'; }).slice(-8);
    }
    paintHistory();
  });
})();
</script>

<script>
(function () {
  var api = window.glimnote && window.glimnote.data;
  if (!api) return;
  var timer = null;
  function banner() {
    var box = document.getElementById('__glnError');
    if (!box) {
      box = document.createElement('div');
      box.id = '__glnError';
      box.setAttribute('role', 'alert');
      box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:10px 12px;' +
        'border-radius:10px;background:#8f2f26;color:#fff;font:13px/1.5 system-ui,sans-serif;' +
        'box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;max-width:560px;margin:0 auto;';
      document.body.appendChild(box);
    }
    return box;
  }
  function show(message) {
    var box = banner();
    box.textContent = message || '未保存，请重试';
    box.style.display = 'block';
    clearTimeout(timer);
    timer = setTimeout(function () { box.style.display = 'none'; }, 5000);
  }
  ['set', 'remove', 'clear'].forEach(function (name) {
    var original = api[name];
    if (typeof original !== 'function') return;
    api[name] = function () {
      var promise = original.apply(api, arguments);
      if (promise && typeof promise.then === 'function') {
        promise.then(null, function (error) {
          show('保存失败：' + ((error && error.message) || '请重试'));
        });
      }
      return promise;
    };
  });
})();
</script>
</body>
</html>
