<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日期推算</title>
<style>
  :root{
    --bg:#fffdf8; --surface:#fff; --line:#e6e3dc; --text:#1a1916; --sub:#6b6a65;
    --accent:#2f6b58; --accent-soft:#e8f1ed; --warn:#b4483c;
    --shadow:0 1px 2px rgba(26,25,22,.05),0 8px 24px rgba(26,25,22,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#1b1b19;--surface:#242422;--line:#373632;--text:#eceae4;--sub:#a4a29b;
      --accent:#6fae94;--accent-soft:#22302b;--warn:#e08a7d;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);}
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;padding:18px 14px 26px}
  .wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px}
  h1{margin:0;font-size:17px;font-weight:600}
  .sub{margin:2px 0 0;font-size:12px;color:var(--sub)}
  .tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px}
  .tabs button{flex:1;border:0;background:transparent;color:var(--sub);font:inherit;font-size:12px;
    padding:7px 4px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    padding:16px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .field{display:flex;flex-direction:column;gap:4px;flex:1 1 130px;min-width:0}
  .field label{font-size:11px;color:var(--sub)}
  .field input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);
    border-radius:9px;padding:8px 10px;min-width:0;width:100%}
  .field input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .result{background:var(--accent-soft);border-radius:12px;padding:14px 16px;display:flex;
    flex-direction:column;gap:2px;align-items:flex-start}
  .result .big{font-size:24px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
  .result .small{font-size:12px;color:var(--sub)}
  .hint{font-size:11px;color:var(--sub)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:999px;
    padding:4px 10px;font:inherit;font-size:11px;cursor:pointer}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .empty{color:var(--sub);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>日期推算</h1>
    <p class="sub">数日子、往后推、按工作日算，都不用翻日历</p>
  </div>

  <div class="tabs" role="tablist" aria-label="推算方式">
    <button type="button" role="tab" data-tab="diff" aria-selected="true">相差天数</button>
    <button type="button" role="tab" data-tab="add" aria-selected="false">往后推算</button>
    <button type="button" role="tab" data-tab="work" aria-selected="false">工作日</button>
  </div>

  <div class="card" id="pane-diff">
    <div class="row">
      <div class="field"><label for="d1">开始日期</label><input id="d1" type="date"></div>
      <div class="field"><label for="d2">结束日期</label><input id="d2" type="date"></div>
    </div>
    <div class="chips">
      <button type="button" class="chip" data-shift="7">一周后</button>
      <button type="button" class="chip" data-shift="30">30 天后</button>
      <button type="button" class="chip" data-shift="100">100 天后</button>
    </div>
    <div class="result"><span class="big" id="diffBig">—</span><span class="small" id="diffSmall"></span></div>
  </div>

  <div class="card" id="pane-add" hidden>
    <div class="row">
      <div class="field"><label for="a0">起始日期</label><input id="a0" type="date"></div>
      <div class="field"><label for="an">往后推几天（可为负）</label><input id="an" type="number" value="30" step="1" min="-100000" max="100000"></div>
    </div>
    <div class="chips">
      <button type="button" class="chip" data-days="30">+30</button>
      <button type="button" class="chip" data-days="90">+90</button>
      <button type="button" class="chip" data-days="180">+180</button>
      <button type="button" class="chip" data-days="365">+365</button>
    </div>
    <div class="result"><span class="big" id="addBig">—</span><span class="small" id="addSmall"></span></div>
  </div>

  <div class="card" id="pane-work" hidden>
    <div class="row">
      <div class="field"><label for="w0">起始日期</label><input id="w0" type="date"></div>
      <div class="field"><label for="wn">往后几个工作日</label><input id="wn" type="number" value="10" step="1" min="0" max="10000"></div>
    </div>
    <div class="hint">只跳过周六、周日，不包含法定节假日调休。</div>
    <div class="result"><span class="big" id="workBig">—</span><span class="small" id="workSmall"></span></div>
  </div>
</div>

<script>
(function () {
  var WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  var pad = function (n) { return String(n).padStart(2, '0'); };
  function fmtInput(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    if (!m) return null;
    var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return isNaN(d.getTime()) ? null : d;
  }
  function label(d) {
    return d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · ' + WEEK[d.getDay()];
  }
  function dayNumber(d) { return Math.round(new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() / 86400000); }

  var today = new Date();
  var d1 = document.getElementById('d1');
  var d2 = document.getElementById('d2');
  var a0 = document.getElementById('a0');
  var an = document.getElementById('an');
  var w0 = document.getElementById('w0');
  var wn = document.getElementById('wn');
  d1.value = fmtInput(today);
  d2.value = fmtInput(today);
  a0.value = fmtInput(today);
  w0.value = fmtInput(today);

  function diff() {
    var A = parse(d1.value), B = parse(d2.value);
    var big = document.getElementById('diffBig');
    var small = document.getElementById('diffSmall');
    if (!A || !B) {
      big.textContent = '选两个日期';
      small.textContent = '';
      return;
    }
    var n = dayNumber(B) - dayNumber(A);
    big.textContent = (n >= 0 ? '+ ' : '− ') + Math.abs(n) + ' 天';
    var weeks = Math.abs(n) / 7;
    small.textContent = n === 0
      ? '两个日期是同一天'
      : (n > 0 ? '从 ' + d1.value + ' 到 ' + d2.value : '从 ' + d2.value + ' 到 ' + d1.value) +
        '，约 ' + (Number.isInteger(weeks) ? weeks : weeks.toFixed(1)) + ' 周';
  }

  function add() {
    var A = parse(a0.value);
    var raw = an.value.trim();
    var n = Math.trunc(Number(raw));
    var big = document.getElementById('addBig');
    var small = document.getElementById('addSmall');
    if (!A || !raw || !isFinite(n)) {
      big.textContent = '填一下日期和天数';
      small.textContent = '';
      return;
    }
    if (Math.abs(n) > 100000) {
      big.textContent = '天数太大';
      small.textContent = '请控制在 ±100000 天以内';
      return;
    }
    var d = new Date(A.getFullYear(), A.getMonth(), A.getDate() + n);
    big.textContent = label(d);
    small.textContent = n === 0 ? '就是起始日期' : '从 ' + a0.value + (n > 0 ? ' 往后 ' : ' 往前 ') + Math.abs(n) + ' 天';
  }

  function work() {
    var A = parse(w0.value);
    var raw = wn.value.trim();
    var n = Math.max(0, Math.trunc(Number(raw)) || 0);
    var big = document.getElementById('workBig');
    var small = document.getElementById('workSmall');
    if (!A) {
      big.textContent = '选一个起始日期';
      small.textContent = '';
      return;
    }
    if (!raw) {
      big.textContent = '填一下工作日数量';
      small.textContent = '';
      return;
    }
    var capped = false;
    if (n > 10000) {
      n = 10000;
      wn.value = '10000';
      capped = true;
    }
    var d = new Date(A.getFullYear(), A.getMonth(), A.getDate());
    var left = n;
    while (left > 0) {
      d.setDate(d.getDate() + 1);
      var day = d.getDay();
      if (day !== 0 && day !== 6) left -= 1;
    }
    big.textContent = label(d);
    small.textContent = '自然日 ' + (dayNumber(d) - dayNumber(A)) + ' 天，其中工作日 ' + n + ' 个' + (capped ? '（已按上限计算）' : '');
  }

  document.getElementById('d1').addEventListener('input', diff);
  document.getElementById('d2').addEventListener('input', diff);
  a0.addEventListener('input', add);
  an.addEventListener('input', add);
  w0.addEventListener('input', work);
  wn.addEventListener('input', work);

  Array.prototype.forEach.call(document.querySelectorAll('[data-shift]'), function (btn) {
    btn.addEventListener('click', function () {
      var days = Number(btn.getAttribute('data-shift'));
      var A = parse(d1.value) || new Date();
      d2.value = fmtInput(new Date(A.getFullYear(), A.getMonth(), A.getDate() + days));
      diff();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-days]'), function (btn) {
    btn.addEventListener('click', function () {
      an.value = btn.getAttribute('data-days');
      add();
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll('[role="tab"]'), function (tab) {
    tab.addEventListener('click', function () {
      var name = tab.getAttribute('data-tab');
      Array.prototype.forEach.call(document.querySelectorAll('[role="tab"]'), function (t) {
        t.setAttribute('aria-selected', String(t === tab));
      });
      document.getElementById('pane-diff').hidden = name !== 'diff';
      document.getElementById('pane-add').hidden = name !== 'add';
      document.getElementById('pane-work').hidden = name !== 'work';
    });
  });

  diff(); add(); work();
})();
</script>

<script>
(function () {
  var api = window.glimnote && window.glimnote.data;
  if (!api) return;
  var timer = null;
  function banner() {
    var box = document.getElementById('__glnError');
    if (!box) {
      box = document.createElement('div');
      box.id = '__glnError';
      box.setAttribute('role', 'alert');
      box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:10px 12px;' +
        'border-radius:10px;background:#8f2f26;color:#fff;font:13px/1.5 system-ui,sans-serif;' +
        'box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;max-width:560px;margin:0 auto;';
      document.body.appendChild(box);
    }
    return box;
  }
  function show(message) {
    var box = banner();
    box.textContent = message || '未保存，请重试';
    box.style.display = 'block';
    clearTimeout(timer);
    timer = setTimeout(function () { box.style.display = 'none'; }, 5000);
  }
  ['set', 'remove', 'clear'].forEach(function (name) {
    var original = api[name];
    if (typeof original !== 'function') return;
    api[name] = function () {
      var promise = original.apply(api, arguments);
      if (promise && typeof promise.then === 'function') {
        promise.then(null, function (error) {
          show('保存失败：' + ((error && error.message) || '请重试'));
        });
      }
      return promise;
    };
  });
})();
</script>
</body>
</html>
