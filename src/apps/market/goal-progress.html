<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>目标进度</title>
<style>
  :root{
    --bg:#fffdf8; --surface:#fff; --line:#e6e3dc; --text:#1a1916; --sub:#6b6a65;
    --accent:#2f6b58; --accent-soft:#e8f1ed; --warn:#b4483c; --amber:#b07f2a; --dim:#ede9e0;
    --shadow:0 1px 2px rgba(26,25,22,.05),0 8px 24px rgba(26,25,22,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#1b1b19;--surface:#242422;--line:#373632;--text:#eceae4;--sub:#a4a29b;
      --accent:#6fae94;--accent-soft:#22302b;--warn:#e08a7d;--amber:#d6a75a;--dim:#33322e;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;padding:18px 14px 26px}
  .wrap{width:100%;max-width:600px;display:flex;flex-direction:column;gap:12px}
  h1{margin:0;font-size:17px;font-weight:600}
  .sub{margin:2px 0 0;font-size:12px;color:var(--sub)}
  .list{display:flex;flex-direction:column;gap:10px}
  .item{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    padding:13px 14px;display:flex;flex-direction:column;gap:8px}
  .top{display:flex;align-items:center;gap:8px}
  .title{font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pct{font-size:13px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
  .track{height:8px;border-radius:4px;background:var(--dim);overflow:hidden}
  .track i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .25s ease}
  .item.done .track i{background:var(--amber)}
  .meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--sub);flex-wrap:wrap}
  .ops{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .ops button{font:inherit;font-size:11px;border:1px solid var(--line);background:var(--bg);color:var(--sub);
    border-radius:7px;padding:3px 9px;cursor:pointer}
  .ops button:hover{border-color:var(--accent);color:var(--accent)}
  .ops input{width:64px;font:inherit;font-size:12px;color:inherit;background:var(--bg);border:1px solid var(--line);
    border-radius:7px;padding:3px 7px}
  .ops .del{margin-left:auto;border:0;background:transparent;padding:3px;line-height:0}
  .ops .del:hover{color:var(--warn)}
  .empty{border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--sub);font-size:12px}
  .msg{font-size:12px;color:var(--warn);min-height:16px}
  .foot{font-size:11px;color:var(--sub);text-align:center}
  .add-toggle{border:1px dashed var(--line);background:transparent;color:var(--sub);border-radius:12px;
    padding:9px;font:inherit;font-size:12px;cursor:pointer}
  .add-toggle:hover{border-color:var(--accent);color:var(--accent)}
  .add{display:none;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:12px}
  .add.open{display:grid}
  .add input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);
    border-radius:9px;padding:8px 10px;min-width:0;width:100%}
  .add input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .add .wide{grid-column:1 / -1}
  .add button{grid-column:1 / -1;font:inherit;border:1px solid var(--accent);background:var(--accent);
    color:#fff;border-radius:10px;padding:9px;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>目标进度</h1>
    <p class="sub">把一个目标拆成数字，每次更新都看得见往前走</p>
  </div>

  <button type="button" class="add-toggle" id="toggle">+ 新建目标</button>
  <form class="add" id="form">
    <input id="title" class="wide" maxlength="24" placeholder="目标，例如 今年读完 20 本书" aria-label="目标名称">
    <input id="current" inputmode="decimal" placeholder="现在" aria-label="当前值">
    <input id="target" inputmode="decimal" placeholder="目标值" aria-label="目标值">
    <input id="unit" maxlength="6" placeholder="单位（本 / 公里 / 次）" aria-label="单位">
    <input id="deadline" type="date" aria-label="截止日期">
    <button type="submit">添加</button>
  </form>
  <div class="msg" id="msg" role="status"></div>

  <div class="list" id="list"></div>
  <div class="foot">数据保存在仓库里，随同步上云</div>
</div>

<script>
(function () {
  var KEY = 'goals';
  var mem = [];
  var bridge = window.glimnote && window.glimnote.data;

  function load() {
    if (!bridge) return Promise.resolve(mem);
    return bridge.get(KEY, []).then(function (v) { return Array.isArray(v) ? v : []; })
      .catch(function () { return mem; });
  }
  function save() {
    if (!bridge) return Promise.resolve();
    return bridge.set(KEY, mem).catch(function () {});
  }

  var touched = false;
  var el = {
    list: document.getElementById('list'), form: document.getElementById('form'),
    toggle: document.getElementById('toggle'), msg: document.getElementById('msg'),
    title: document.getElementById('title'), current: document.getElementById('current'),
    target: document.getElementById('target'), unit: document.getElementById('unit'),
    deadline: document.getElementById('deadline')
  };

  function num(v) {
    var n = Number(v);
    return isFinite(n) ? n : 0;
  }
  function fmt(n) {
    return Math.abs(n) >= 100 ? String(Math.round(n)) : String(Math.round(n * 10) / 10);
  }
  function daysLeft(date) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(date || '');
    if (!m) return null;
    var target = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    var now = new Date();
    var a = new Date(target.getFullYear(), target.getMonth(), target.getDate());
    var b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((a - b) / 86400000);
  }

  function render() {
    el.list.textContent = '';
    if (!mem.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '还没有目标。先建一个，数字小一点更容易开始。';
      el.list.appendChild(empty);
      return;
    }
    mem.forEach(function (goal) {
      var cur = num(goal.current), target = Math.max(0.0001, num(goal.target));
      var ratio = Math.max(0, Math.min(1, cur / target));
      var done = cur >= target;
      var card = document.createElement('div');
      card.className = 'item' + (done ? ' done' : '');

      var top = document.createElement('div');
      top.className = 'top';
      var title = document.createElement('div');
      title.className = 'title';
      title.textContent = goal.title;
      var pct = document.createElement('div');
      pct.className = 'pct';
      // 没完成之前不要显示 100%（99.6 / 100 仍是 99.6%）
      pct.textContent = (ratio >= 1 ? 100 : Math.floor(ratio * 1000) / 10) + '%';
      top.appendChild(title);
      top.appendChild(pct);

      var track = document.createElement('div');
      track.className = 'track';
      var fill = document.createElement('i');
      fill.style.width = (ratio * 100).toFixed(1) + '%';
      track.appendChild(fill);

      var meta = document.createElement('div');
      meta.className = 'meta';
      var left = document.createElement('span');
      left.textContent = done
        ? '已完成 · ' + fmt(cur) + ' / ' + fmt(target) + ' ' + (goal.unit || '')
        : '还差 ' + fmt(target - cur) + ' ' + (goal.unit || '') + '（' + fmt(cur) + ' / ' + fmt(target) + '）';
      meta.appendChild(left);
      var dl = daysLeft(goal.deadline);
      if (dl !== null) {
        var right = document.createElement('span');
        right.textContent = dl > 0 ? '还剩 ' + dl + ' 天' : dl === 0 ? '今天截止' : '已过期 ' + Math.abs(dl) + ' 天';
        meta.appendChild(right);
      }

      var ops = document.createElement('div');
      ops.className = 'ops';
      var quick = document.createElement('button');
      quick.type = 'button';
      quick.textContent = '+1';
      quick.addEventListener('click', function () {
        touched = true;
        goal.current = Math.max(0, num(goal.current) + 1);
        save().then(render);
      });
      var custom = document.createElement('input');
      custom.type = 'number';
      custom.step = 'any';
      custom.placeholder = '更新为';
      custom.setAttribute('aria-label', goal.title + ' 的当前值');
      custom.value = String(goal.current);
      custom.addEventListener('change', function () {
        touched = true;
        // 当前值不允许为负
        goal.current = Math.max(0, num(custom.value));
        custom.value = String(goal.current);
        save().then(render);
      });
      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.title = '删除目标';
      del.setAttribute('aria-label', '删除 ' + goal.title);
      del.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>';
      del.addEventListener('click', function () {
        touched = true;
        mem = mem.filter(function (g) { return g.id !== goal.id; });
        save().then(render);
      });
      ops.appendChild(quick);
      ops.appendChild(custom);
      ops.appendChild(del);

      card.appendChild(top);
      card.appendChild(track);
      card.appendChild(meta);
      card.appendChild(ops);
      el.list.appendChild(card);
    });
  }

  el.toggle.addEventListener('click', function () {
    el.form.classList.toggle('open');
    if (el.form.classList.contains('open')) el.title.focus();
  });

  el.form.addEventListener('submit', function (e) {
    e.preventDefault();
    var title = el.title.value.trim();
    var target = num(el.target.value);
    if (!title) {
      el.msg.textContent = '先写目标名称';
      el.title.focus();
      return;
    }
    if (target <= 0) {
      el.msg.textContent = '目标值要大于 0';
      el.target.focus();
      return;
    }
    if (mem.length >= 30) {
      el.msg.textContent = '最多 30 个目标，先删掉一些';
      return;
    }
    el.msg.textContent = '';
    touched = true;
    mem.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      title: title,
      current: Math.max(0, num(el.current.value)),
      target: target,
      unit: el.unit.value.trim().slice(0, 6),
      deadline: el.deadline.value || ''
    });
    el.title.value = '';
    el.current.value = '';
    el.target.value = '';
    el.unit.value = '';
    el.deadline.value = '';
    el.form.classList.remove('open');
    save().then(render);
  });

  load().then(function (list) {
    var loaded = list.map(function (g) {
      return {
        id: String(g.id || ''), title: String(g.title || ''), current: Math.max(0, num(g.current)),
        target: num(g.target), unit: String(g.unit || ''), deadline: String(g.deadline || '')
      };
    }).filter(function (g) { return g.title && g.target > 0; });
    if (touched) {
      var seen = {};
      mem.forEach(function (g) { seen[g.id] = true; });
      loaded.forEach(function (g) { if (!seen[g.id]) mem.push(g); });
      save();
    } else {
      mem = loaded;
    }
    render();
  });
})();
</script>

<script>
(function () {
  var api = window.glimnote && window.glimnote.data;
  if (!api) return;
  var timer = null;
  function banner() {
    var box = document.getElementById('__glnError');
    if (!box) {
      box = document.createElement('div');
      box.id = '__glnError';
      box.setAttribute('role', 'alert');
      box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:10px 12px;' +
        'border-radius:10px;background:#8f2f26;color:#fff;font:13px/1.5 system-ui,sans-serif;' +
        'box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;max-width:560px;margin:0 auto;';
      document.body.appendChild(box);
    }
    return box;
  }
  function show(message) {
    var box = banner();
    box.textContent = message || '未保存，请重试';
    box.style.display = 'block';
    clearTimeout(timer);
    timer = setTimeout(function () { box.style.display = 'none'; }, 5000);
  }
  ['set', 'remove', 'clear'].forEach(function (name) {
    var original = api[name];
    if (typeof original !== 'function') return;
    api[name] = function () {
      var promise = original.apply(api, arguments);
      if (promise && typeof promise.then === 'function') {
        promise.then(null, function (error) {
          show('保存失败：' + ((error && error.message) || '请重试'));
        });
      }
      return promise;
    };
  });
})();
</script>
</body>
</html>
