<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文本对比</title>
<style>
  :root{--bg:#fffdf8;--surface:#fff;--line:#e6e3dc;--text:#1a1916;--sub:#6b6a65;
    --accent:#2f6b58;--add:#e5f2e9;--add-line:#2f6b58;--del:#f9e6e3;--del-line:#b4483c;
    --shadow:0 1px 2px rgba(26,25,22,.05),0 8px 24px rgba(26,25,22,.05)}
  @media (prefers-color-scheme:dark){:root{--bg:#1b1b19;--surface:#242422;--line:#373632;--text:#eceae4;--sub:#a4a29b;
    --accent:#6fae94;--add:#1f2e27;--add-line:#6fae94;--del:#332321;--del-line:#e08a7d;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;padding:18px 14px 22px}
  .wrap{width:100%;max-width:820px;display:flex;flex-direction:column;gap:12px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  h1{margin:0;font-size:17px;font-weight:600}
  .head p{margin:2px 0 0;font-size:12px;color:var(--sub)}
  .head .stat{font-size:12px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
  .head .stat b{color:var(--accent)}
  .head .stat i{color:var(--del-line);font-style:normal}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:640px){.cols{grid-template-columns:1fr}}
  .pane{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    padding:10px;display:flex;flex-direction:column;gap:6px}
  .pane span{font-size:12px;color:var(--sub)}
  textarea{width:100%;min-height:180px;resize:vertical;font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,"Microsoft YaHei",monospace;
    color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none}
  textarea:focus{border-color:var(--accent)}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{font:inherit;font-size:13px;padding:8px 16px;border-radius:9px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);cursor:pointer}
  .btn:hover{background:var(--bg)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .result{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    overflow:hidden;display:none}
  .result.on{display:block}
  .result-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);
    font-size:12px;color:var(--sub)}
  .diff{max-height:52vh;overflow:auto;font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,"Microsoft YaHei",monospace}
  .diff div{display:flex;gap:8px;padding:1px 12px;white-space:pre-wrap;word-break:break-word}
  .diff div.add{background:var(--add);box-shadow:inset 3px 0 0 var(--add-line)}
  .diff div.del{background:var(--del);box-shadow:inset 3px 0 0 var(--del-line)}
  .diff div.same{color:var(--sub)}
  .diff .sign{flex:0 0 12px;opacity:.8}
  .diff .ln{flex:0 0 34px;text-align:right;opacity:.55;user-select:none}
  .empty{font-size:12px;color:var(--sub);text-align:center;padding:8px}
  .foot{font-size:11px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>文本对比</h1><p>改稿前后贴进来，一眼看到加删了什么</p></div>
    <div class="stat">新增 <b id="addCount">0</b> · 删除 <i id="delCount">0</i></div>
  </div>
  <div class="cols">
    <div class="pane">
      <span>原文</span>
      <textarea id="left" placeholder="粘贴改动前的版本"></textarea>
    </div>
    <div class="pane">
      <span>新文</span>
      <textarea id="right" placeholder="粘贴改动后的版本"></textarea>
    </div>
  </div>
  <div class="actions">
    <button class="btn primary" id="run" type="button">对比</button>
    <button class="btn" id="swap" type="button">交换左右</button>
    <button class="btn" id="clear" type="button">清空</button>
  </div>
  <div class="result" id="result">
    <div class="result-head"><span>逐行对比 · 最多比较 600 行</span><span id="resultMsg"></span></div>
    <div class="diff" id="diff"></div>
  </div>
  <div class="foot">只做行级对比 · 两边内容作为草稿存在本机应用里，下次打开可以接着改</div>
</div>

<script>
(function () {
  var KEY = 'drafts';
  var mem = {};
  var bridge = window.glimnote && window.glimnote.data;
  function get(k, d) {
    if (!bridge) return Promise.resolve(k in mem ? mem[k] : d);
    return bridge.get(k, d).catch(function () { return k in mem ? mem[k] : d; });
  }
  function set(k, v) {
    mem[k] = v;
    if (!bridge) return Promise.resolve();
    return bridge.set(k, v).catch(function () {});
  }

  var leftEl = document.getElementById('left');
  var rightEl = document.getElementById('right');
  var diffEl = document.getElementById('diff');
  var resultEl = document.getElementById('result');
  var addEl = document.getElementById('addCount');
  var delEl = document.getElementById('delCount');
  var touched = false; // 用户已经动过输入框，异步载入的草稿不再覆盖

  function lines(text) {
    // 末尾单个换行不算多出一行；空文本仍视为 1 行
    return String(text || '').replace(/\r\n?/g, '\n').replace(/\n$/, '').split('\n');
  }

  // 经典 LCS：行数不多时足够快，也容易看懂
  function diff(a, b) {
    var n = a.length, m = b.length;
    var dp = [];
    for (var i = 0; i <= n; i += 1) dp.push(new Array(m + 1).fill(0));
    for (i = n - 1; i >= 0; i -= 1) {
      for (var j = m - 1; j >= 0; j -= 1) {
        dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    var out = [];
    i = 0; var j2 = 0;
    while (i < n && j2 < m) {
      if (a[i] === b[j2]) {
        out.push({ type: 'same', text: a[i], ln: i + 1 });
        i += 1; j2 += 1;
      } else if (dp[i + 1][j2] >= dp[i][j2 + 1]) {
        out.push({ type: 'del', text: a[i], ln: i + 1 });
        i += 1;
      } else {
        out.push({ type: 'add', text: b[j2], ln: j2 + 1 });
        j2 += 1;
      }
    }
    while (i < n) { out.push({ type: 'del', text: a[i], ln: i + 1 }); i += 1; }
    while (j2 < m) { out.push({ type: 'add', text: b[j2], ln: j2 + 1 }); j2 += 1; }
    return out;
  }

  function run() {
    var a = lines(leftEl.value);
    var b = lines(rightEl.value);
    if (a.length > 600 || b.length > 600) {
      resultEl.classList.add('on');
      diffEl.textContent = '';
      addEl.textContent = '0';
      delEl.textContent = '0';
      document.getElementById('resultMsg').textContent = '';
      document.title = '文本对比';
      var tip = document.createElement('div');
      tip.className = 'empty';
      tip.textContent = '行数太多了，请分段对比（每次不超过 600 行）。';
      diffEl.appendChild(tip);
      return;
    }
    var rows = diff(a, b);
    var add = 0, del = 0;
    diffEl.textContent = '';
    rows.forEach(function (row) {
      if (row.type === 'add') add += 1;
      if (row.type === 'del') del += 1;
      var line = document.createElement('div');
      line.className = row.type;
      var sign = document.createElement('span');
      sign.className = 'sign';
      sign.textContent = row.type === 'add' ? '+' : row.type === 'del' ? '−' : ' ';
      var ln = document.createElement('span');
      ln.className = 'ln';
      ln.textContent = String(row.ln);
      var txt = document.createElement('span');
      txt.textContent = row.text || ' ';
      line.appendChild(sign); line.appendChild(ln); line.appendChild(txt);
      diffEl.appendChild(line);
    });
    addEl.textContent = String(add);
    delEl.textContent = String(del);
    document.getElementById('resultMsg').textContent = add + ' 行新增 · ' + del + ' 行删除';
    resultEl.classList.add('on');
    document.title = (add || del ? '+' + add + ' −' + del + ' · ' : '') + '文本对比';
  }

  function save() { set(KEY, { left: leftEl.value, right: rightEl.value }); }

  document.getElementById('run').addEventListener('click', run);
  document.getElementById('swap').addEventListener('click', function () {
    var t = leftEl.value;
    leftEl.value = rightEl.value;
    rightEl.value = t;
    save();
    run();
  });
  document.getElementById('clear').addEventListener('click', function () {
    leftEl.value = ''; rightEl.value = '';
    diffEl.textContent = '';
    resultEl.classList.remove('on');
    addEl.textContent = '0'; delEl.textContent = '0';
    save();
  });
  [leftEl, rightEl].forEach(function (el) {
    el.addEventListener('input', function () {
      touched = true;
      clearTimeout(save.t);
      save.t = setTimeout(save, 400);
    });
  });

  get(KEY, null).then(function (saved) {
    if (touched || !saved || typeof saved !== 'object') return;
    leftEl.value = saved.left || '';
    rightEl.value = saved.right || '';
  });
})();
</script>

<script>
(function () {
  var api = window.glimnote && window.glimnote.data;
  if (!api) return;
  var timer = null;
  function banner() {
    var box = document.getElementById('__glnError');
    if (!box) {
      box = document.createElement('div');
      box.id = '__glnError';
      box.setAttribute('role', 'alert');
      box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:10px 12px;' +
        'border-radius:10px;background:#8f2f26;color:#fff;font:13px/1.5 system-ui,sans-serif;' +
        'box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;max-width:560px;margin:0 auto;';
      document.body.appendChild(box);
    }
    return box;
  }
  function show(message) {
    var box = banner();
    box.textContent = message || '未保存，请重试';
    box.style.display = 'block';
    clearTimeout(timer);
    timer = setTimeout(function () { box.style.display = 'none'; }, 5000);
  }
  ['set', 'remove', 'clear'].forEach(function (name) {
    var original = api[name];
    if (typeof original !== 'function') return;
    api[name] = function () {
      var promise = original.apply(api, arguments);
      if (promise && typeof promise.then === 'function') {
        promise.then(null, function (error) {
          show('保存失败：' + ((error && error.message) || '请重试'));
        });
      }
      return promise;
    };
  });
})();
</script>
</body>
</html>
