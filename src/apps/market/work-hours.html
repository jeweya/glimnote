<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工时记录</title>
<style>
  :root{--bg:#fffdf8;--surface:#fff;--line:#e6e3dc;--text:#1a1916;--sub:#6b6a65;
    --accent:#2f6b58;--accent-soft:#e8f1ed;--warn:#b4483c;--track:#efece4;
    --shadow:0 1px 2px rgba(26,25,22,.05),0 8px 24px rgba(26,25,22,.05)}
  @media (prefers-color-scheme:dark){:root{--bg:#1b1b19;--surface:#242422;--line:#373632;--text:#eceae4;--sub:#a4a29b;
    --accent:#6fae94;--accent-soft:#22302b;--warn:#e08a7d;--track:#2e2e2a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;padding:18px 14px 22px}
  .wrap{width:100%;max-width:600px;display:flex;flex-direction:column;gap:12px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  h1{margin:0;font-size:17px;font-weight:600}
  .head p{margin:2px 0 0;font-size:12px;color:var(--sub)}
  .head .sum{text-align:right;font-size:12px;color:var(--sub);white-space:nowrap}
  .head .sum b{display:block;font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px}
  .timer{display:flex;flex-direction:column;gap:10px;align-items:center;padding:4px 0 10px}
  .clock{font-size:42px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1.1}
  .clock.idle{color:var(--sub);font-size:28px}
  .task{font-size:12px;color:var(--sub);min-height:18px}
  .form{display:flex;gap:8px;width:100%}
  input{font:inherit;font-size:13px;color:var(--text);background:var(--bg);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;outline:none}
  input:focus{border-color:var(--accent)}
  .form input{flex:1;min-width:0}
  .btn{font:inherit;font-size:13px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);cursor:pointer;white-space:nowrap}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.stop{background:var(--warn);border-color:var(--warn);color:#fff;font-weight:600}
  .btn:hover{filter:brightness(.98)}
  .sub{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px;font-size:12px;color:var(--sub)}
  .sub b{color:var(--text)}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
  li{display:flex;align-items:center;gap:9px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
  li .name{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  li .range{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
  li .dur{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
  li .del{border:0;background:transparent;color:var(--sub);font-size:15px;line-height:1;cursor:pointer;opacity:0;min-width:32px;min-height:32px}
  li:hover .del,li:focus-within .del,li .del:focus-visible{opacity:1}
  @media (hover:none){li .del{opacity:1}}
  .empty{font-size:12px;color:var(--sub);padding:6px 0}
  .foot{font-size:11px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>工时记录</h1><p>开始做就按下，停下来就记上一笔</p></div>
    <div class="sum">今天 <b id="todayTotal">0 分</b><span id="weekHint"></span></div>
  </div>
  <div class="card">
    <div class="timer">
      <div class="clock idle" id="clock">00:00:00</div>
      <div class="task" id="taskLabel">还没有在计时</div>
      <div class="form">
        <input type="text" id="name" maxlength="40" placeholder="在做什么？例如：写方案" aria-label="任务名称">
        <button class="btn primary" id="toggle" type="button">开始</button>
      </div>
    </div>
    <div class="sub"><span>今天的记录</span><b id="weekTotal"></b></div>
    <ul id="list"></ul>
    <div class="empty" id="empty">今天还没有记录。</div>
  </div>
  <div class="foot">计时状态和记录都存在应用里 · 重新打开会接着算</div>
</div>

<script>
(function () {
  var KEY = 'hours';
  var mem = {};
  var bridge = window.glimnote && window.glimnote.data;
  function get(k, d) {
    if (!bridge) return Promise.resolve(k in mem ? mem[k] : d);
    return bridge.get(k, d).catch(function () { return k in mem ? mem[k] : d; });
  }
  function set(k, v) {
    mem[k] = v;
    if (!bridge) return Promise.resolve();
    return bridge.set(k, v).catch(function () {});
  }

  var state = { running: null, entries: [] };
  var nameEl = document.getElementById('name');
  var clockEl = document.getElementById('clock');
  var taskEl = document.getElementById('taskLabel');
  var toggleEl = document.getElementById('toggle');
  var listEl = document.getElementById('list');
  var emptyEl = document.getElementById('empty');
  var todayEl = document.getElementById('todayTotal');
  var weekEl = document.getElementById('weekTotal');
  var timer = null;

  function dayKey(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function startOfDay(ts) {
    var d = new Date(ts);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  }
  function startOfWeek(ts) {
    var d = new Date(ts);
    var back = (d.getDay() + 6) % 7;
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() - back).getTime();
  }
  function overlapSec(entry, from, to) {
    var a = Math.max(Number(entry.startAt) || 0, from);
    var b = Math.min(Number(entry.endAt) || 0, to);
    return Math.max(0, Math.round((b - a) / 1000));
  }
  function stamp(ts) {
    var d = new Date(ts);
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + timeOf(ts);
  }
  function hm(sec) {
    var s = Math.max(0, Math.round(sec));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    if (h) return h + ' 小时 ' + m + ' 分';
    return m + ' 分';
  }
  function clock(sec) {
    var s = Math.max(0, Math.floor(sec));
    return String(Math.floor(s / 3600)).padStart(2, '0') + ':' +
      String(Math.floor((s % 3600) / 60)).padStart(2, '0') + ':' +
      String(s % 60).padStart(2, '0');
  }
  function timeOf(ts) {
    var d = new Date(ts);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function save() { set(KEY, state); }

  function elapsed() {
    if (!state.running) return 0;
    return Math.max(0, Math.floor((Date.now() - state.running.startAt) / 1000));
  }

  function paintClock() {
    var sec = elapsed();
    clockEl.textContent = clock(sec);
    clockEl.classList.toggle('idle', !state.running);
    toggleEl.textContent = state.running ? '停止' : '开始';
    toggleEl.className = 'btn ' + (state.running ? 'stop' : 'primary');
    if (state.running) {
      taskEl.textContent = '正在做：' + state.running.name + ' · 从 ' + timeOf(state.running.startAt) + ' 开始';
    } else {
      taskEl.textContent = '还没有在计时';
    }
  }

  function paintTotals() {
    var now = Date.now();
    var dayFrom = startOfDay(now);
    var weekFrom = startOfWeek(now);
    var todaySec = 0;
    var weekSec = 0;
    state.entries.forEach(function (e) {
      todaySec += overlapSec(e, dayFrom, dayFrom + 86400000);
      weekSec += overlapSec(e, weekFrom, now);
    });
    if (state.running) {
      var running = { startAt: state.running.startAt, endAt: now };
      todaySec += overlapSec(running, dayFrom, dayFrom + 86400000);
      weekSec += overlapSec(running, weekFrom, now);
    }
    todayEl.textContent = hm(todaySec);
    weekEl.textContent = '本周 ' + hm(weekSec);
    var hint = document.getElementById('weekHint');
    if (hint) hint.textContent = state.running ? ' · 计时中' : '';
  }

  function paintList() {
    var dayFrom = startOfDay(Date.now());
    var items = state.entries.filter(function (e) { return overlapSec(e, dayFrom, dayFrom + 86400000) > 0; })
      .sort(function (a, b) { return b.startAt - a.startAt; });
    listEl.textContent = '';
    items.forEach(function (entry) {
      var li = document.createElement('li');
      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = entry.name;
      var range = document.createElement('span');
      range.className = 'range';
      range.textContent = (dayKey(new Date(entry.startAt)) === dayKey(new Date(entry.endAt))
        ? timeOf(entry.startAt) + ' – ' + timeOf(entry.endAt)
        : stamp(entry.startAt) + ' – ' + stamp(entry.endAt));
      var dur = document.createElement('span');
      dur.className = 'dur';
      dur.textContent = hm(entry.sec);
      var del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.textContent = '×';
      del.title = '删除这条记录';
      del.addEventListener('click', function () {
        state.entries = state.entries.filter(function (e) { return e.id !== entry.id; });
        save(); paintList(); paintTotals();
      });
      li.appendChild(name); li.appendChild(range); li.appendChild(dur); li.appendChild(del);
      listEl.appendChild(li);
    });
    emptyEl.style.display = items.length ? 'none' : 'block';
    var open = items.length;
    document.title = (open ? open + ' 条 · ' : '') + '工时记录';
  }

  function tick() {
    if (!state.running) return;
    paintClock();
  }

  function start() {
    var name = nameEl.value.trim() || '未命名任务';
    state.running = { name: name, startAt: Date.now() };
    save();
    paintClock();
    clearInterval(timer);
    timer = setInterval(tick, 1000);
    nameEl.value = '';
  }

  function stop() {
    if (!state.running) return;
    var endAt = Date.now();
    var cursor = state.running.startAt;
    var index = 0;
    while (cursor < endAt) {
      var pieceEnd = Math.min(endAt, startOfDay(cursor) + 86400000);
      state.entries.push({
        id: 'e' + endAt.toString(36) + '-' + index,
        name: state.running.name,
        startAt: cursor,
        endAt: pieceEnd,
        sec: Math.max(1, Math.round((pieceEnd - cursor) / 1000)),
        day: dayKey(new Date(cursor))
      });
      cursor = pieceEnd;
      index += 1;
    }
    // 只留最近 500 条，避免 data.json 无限变大
    if (state.entries.length > 500) state.entries = state.entries.slice(-500);
    state.running = null;
    save();
    clearInterval(timer);
    timer = null;
    paintClock(); paintList(); paintTotals();
  }

  toggleEl.addEventListener('click', function () {
    if (state.running) stop(); else start();
  });
  nameEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !state.running) {
      e.preventDefault();
      start();
    }
  });

  get(KEY, null).then(function (saved) {
    if (saved && typeof saved === 'object') {
      state.entries = Array.isArray(saved.entries) ? saved.entries : [];
      if (saved.running && saved.running.startAt) state.running = saved.running;
    }
    paintClock(); paintList(); paintTotals();
    if (state.running) timer = setInterval(tick, 1000);
    var lastDay = dayKey(new Date());
    setInterval(function () {
      var now = dayKey(new Date());
      if (now !== lastDay) {
        lastDay = now;
        paintList(); paintTotals(); paintClock();
      }
    }, 60000);
  });
})();
</script>

<script>
(function () {
  var api = window.glimnote && window.glimnote.data;
  if (!api) return;
  var timer = null;
  function banner() {
    var box = document.getElementById('__glnError');
    if (!box) {
      box = document.createElement('div');
      box.id = '__glnError';
      box.setAttribute('role', 'alert');
      box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:10px 12px;' +
        'border-radius:10px;background:#8f2f26;color:#fff;font:13px/1.5 system-ui,sans-serif;' +
        'box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;max-width:560px;margin:0 auto;';
      document.body.appendChild(box);
    }
    return box;
  }
  function show(message) {
    var box = banner();
    box.textContent = message || '未保存，请重试';
    box.style.display = 'block';
    clearTimeout(timer);
    timer = setTimeout(function () { box.style.display = 'none'; }, 5000);
  }
  ['set', 'remove', 'clear'].forEach(function (name) {
    var original = api[name];
    if (typeof original !== 'function') return;
    api[name] = function () {
      var promise = original.apply(api, arguments);
      if (promise && typeof promise.then === 'function') {
        promise.then(null, function (error) {
          show('保存失败：' + ((error && error.message) || '请重试'));
        });
      }
      return promise;
    };
  });
})();
</script>
</body>
</html>
